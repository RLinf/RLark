services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.4@sha256:c730bccdbc8739f8f0c13cefe9bea8b61926f599b88fa4d0d229baa91846c7bc
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      media:
        ipv4_address: 10.60.0.2
      control:
        ipv4_address: 10.61.0.2

  test-client:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    profiles: [test]
    command: ["sleep", "infinity"]
    volumes:
      - ./smoke.py:/tests/smoke.py:ro
      - synthetic-media:/media:ro
    depends_on:
      - publisher
    networks:
      - media
      - control

  control-publish-probe:
    image: jrottenberg/ffmpeg:7.1-alpine@sha256:8ec1ee1f6a0fcd37c97725827b6b7832795c9596e3439b8da56d7700d61ae778
    profiles: [test]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if ffmpeg -hide_banner -loglevel error -re -f lavfi
        -i testsrc=size=320x180:rate=5 -an -c:v libx264 -pix_fmt yuv420p -t 2
        -f rtsp -rtsp_transport tcp
        rtsp://media-controller:control-test-only@10.60.0.2:8554/demo-agent/demo-node/front
        >/tmp/publish-probe.log 2>&1;
        then echo 'control credential unexpectedly published'; exit 1;
        else grep -qi '401 Unauthorized' /tmp/publish-probe.log || { cat /tmp/publish-probe.log; exit 1; };
        echo 'control credential denied RTSP publish as expected'; fi
    networks:
      - media

  publisher-path-probe:
    image: jrottenberg/ffmpeg:7.1-alpine@sha256:8ec1ee1f6a0fcd37c97725827b6b7832795c9596e3439b8da56d7700d61ae778
    profiles: [test]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        if ffmpeg -hide_banner -loglevel error -re -f lavfi
        -i testsrc=size=320x180:rate=5 -an -c:v libx264 -pix_fmt yuv420p -t 2
        -f rtsp -rtsp_transport tcp
        rtsp://synthetic-publisher:publish-test-only@10.60.0.2:8554/demo-agent/demo-node/rear
        >/tmp/publish-probe.log 2>&1;
        then echo 'publisher credential unexpectedly published an unconfigured path'; exit 1;
        else grep -Eqi '400 Bad Request|401 Unauthorized|404 Not Found' /tmp/publish-probe.log || { cat /tmp/publish-probe.log; exit 1; };
        echo 'publisher credential denied an unconfigured RTSP path as expected'; fi
    networks:
      - media

  publisher:
    image: jrottenberg/ffmpeg:7.1-alpine@sha256:8ec1ee1f6a0fcd37c97725827b6b7832795c9596e3439b8da56d7700d61ae778
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        ffmpeg -hide_banner -loglevel error -f lavfi
        -i testsrc=size=640x360:rate=15 -frames:v 1 -y /media/synthetic.jpg;
        exec ffmpeg -hide_banner -loglevel info -re -f lavfi
        -i testsrc=size=640x360:rate=15 -an -c:v libx264
        -profile:v baseline -preset ultrafast -tune zerolatency
        -pix_fmt yuv420p -g 30 -keyint_min 30 -bf 0
        -f rtsp -rtsp_transport tcp
        rtsp://synthetic-publisher:publish-test-only@10.60.0.2:8554/demo-agent/demo-node/front
    volumes:
      - synthetic-media:/media
    depends_on:
      - mediamtx
    networks:
      - media

networks:
  media:
    internal: true
    ipam:
      config:
        - subnet: 10.60.0.0/24
  control:
    internal: true
    ipam:
      config:
        - subnet: 10.61.0.0/24

volumes:
  synthetic-media:
