# 本分叉在官方 apps/rlark/docs/api/swagger.yaml 之上加的接口与字段。
# 官方文件不动；apps/rlark/pkg/gateway/astribot_swagger_test.go 把本文件逐键叠到官方文件上
# （同名的映射递归合并，其余以本文件为准），再跑官方的路由与引用检查。
# 证书吊销接口 POST /api/v1/certificates/revoke 要求管理员，并要求 Server 持久化吊销记录。
paths:
  /api/v1/certificates/revoke:
    post:
      summary: Persist certificate revocation (administrator only)
      description: Requires a compatible Server. An ambiguous failure may be retried with the same identity; existing sessions are not terminated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cert_type, serial_number, subject_key_id]
              properties:
                cert_type: {type: string, enum: [x509, ssh]}
                serial_number: {type: string, description: Canonical decimal serial}
                subject_key_id: {type: string, description: Lowercase hexadecimal for X.509; SSH key ID for SSH}
                reason: {type: string}
      responses:
        '200':
          description: Server confirmed durable storage
          content:
            application/json:
              schema:
                type: object
                properties:
                  persisted: {type: boolean, enum: [true]}
        '400': {description: Invalid certificate identity}
        '401': {description: Authentication required}
        '403': {description: Administrator role required}
        '502': {description: Server failed or did not confirm persistence; outcome may be unknown}
        '503': {description: Server connection not configured}
  /api/v1/image-registries/{id}/password:
    get:
      tags: [Image]
      summary: Reveal a registry password (administrator only)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Password; response is not cacheable
          content:
            application/json:
              schema:
                type: object
                required: [password]
                properties:
                  password: {type: string, format: password}
        '400': {description: Invalid registry ID}
        '403': {description: Administrator role required}
        '404': {description: Registry not found}
  /api/v1/node-networks/{name}:
    get:
      tags: [Station]
      summary: Get the verified node network summary (preview)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Current, stale or unreported WireGuard observation
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string, enum: [current, stale, unreported]}
                  interface: {type: string}
                  addresses: {type: array, items: {type: string}}
                  reportedAt: {type: string, format: date-time}
        '400': {description: Missing cluster ID}
        '404': {description: Cluster or node not visible}
        '409': {description: Invalid cluster namespace mapping}
        '503': {description: Verified observation unavailable}
  /api/v1/site-nodes:
    get:
      tags: [Station]
      summary: List the site nodes of a cluster (read-only), optionally those carrying a label
      parameters:
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
        - {name: label, in: query, required: false, schema: {type: string}, description: key=value}
      responses:
        '200':
          description: Site nodes by node name, each shaped as in GET /api/v1/site-nodes/{name}
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object}}
        '400': {description: Missing cluster ID}
        '404': {description: Cluster not found}
        '409': {description: Invalid cluster namespace mapping}
        '502': {description: Management API request failed}
        '503': {description: Station API unavailable}
  /api/v1/site-nodes/{name}:
    get:
      tags: [Station]
      summary: Look up one site node by Node name (read-only; identity, network address, robot)
      description: >-
        The interface for consumers that place work on machines, such as a Fleet Run. A caller keeps
        the cluster ID and Node name and reads the rest here. node_uid changes when the machine is
        reinstalled or replaced under the name; a removed node is not served;
        network.address is the one address every other member reaches the node at. The answer says
        nothing about what runs on the machine.
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: The site node of this Node name
          content:
            application/json:
              schema:
                type: object
                required: [cluster_id, node_name, node_uid, phase, online]
                properties:
                  cluster_id: {type: string}
                  node_name: {type: string}
                  node_uid: {type: string, description: UID of the Kubernetes Node the record is of}
                  phase: {type: string, enum: [Bound, Offline, Conflict, ''], description: Empty until the node's first report}
                  online: {type: boolean, description: Heartbeat only; the agent reported within 90 s}
                  tunnel: {type: string, enum: [verified, failed, unknown], description: Whether the node reaches every peer that is itself online}
                  rlark_node: {type: string, enum: [ready, not-ready, unknown]}
                  last_seen_time: {type: string, format: date-time}
                  boot_time: {type: string, format: date-time}
                  reboots: {type: integer, description: Boot-time changes seen since the record was made or passed to this Node}
                  labels: {type: object, additionalProperties: {type: string}}
                  cameras: {type: string, description: "A robot's cameras as its camera service last wrote them (the Node annotation rlark.io/cameras, the JSON of GET .../nodes/{name}/cameras)"}
                  robot_id: {type: string}
                  workstation_id: {type: string}
                  network:
                    type: object
                    description: Absent for a node that has enrolled no tunnel key
                    properties:
                      state: {type: string, enum: [Pending, Enrolled, Rejected]}
                      site: {type: string}
                      role: {type: string, enum: [Leaf, Hub]}
                      address: {type: string}
                      tunnel_address: {type: string}
                      link_summary: {type: string, description: 'For a leaf, what the hubs it dials see of it, in one line; empty while every link is connected'}
                      public_key: {type: string, description: 'The WireGuard public key the node enrolled with; the private key never leaves the machine'}
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            hub: {type: string, description: 'The hub the leaf dials, <clusterID>/<nodeName>'}
                            state: {type: string, enum: [Connected, Unanswered, Silent, Unknown]}
                            since: {type: string, format: date-time}
                            latest_handshake: {type: string, format: date-time}
        '400': {description: Missing cluster ID}
        '404': {description: Cluster or site node not found}
        '409': {description: Invalid cluster namespace mapping}
        '502': {description: Management API request failed}
        '503': {description: Station API unavailable}
  /api/v1/cluster-provisions:
    get:
      tags: [Clusters]
      summary: List the clusters made from a machine, each with its stages (administrator only)
      responses:
        '200': {description: The ClusterProvisions, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}}}}}}
    post:
      tags: [Clusters]
      summary: Make a new site's cluster from its first machine (administrator only)
      description: >-
        The Gateway logs in to the machine with the account given, and in stages makes it the new site's first
        hub and the cluster's control plane, installs the cluster agent, Station and the Addons at the release
        the site is at, and runs a check Job. Each stage's read-back and, where it stopped, the reason are in the
        ClusterProvision's status. The password is used for this making only and kept nowhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, site, address, user, password]
              properties:
                type: {type: string, enum: [gpu, robot], description: "The cluster's type (GPU 集群 / 机器人集群): the ClusterProvision's and then the Cluster's label rlark.io/cluster-type"}
                site: {type: string, description: The new site's name}
                cluster: {type: string, description: "The cluster's name, rlark-...; empty, rlark-<site>-<type>"}
                address: {type: string, description: "The machine's address; its WireGuard endpoint is this address, UDP 51820"}
                port: {type: integer, description: SSH port, default 22}
                user: {type: string}
                password: {type: string, format: password}
      responses:
        '201': {description: Started; the ClusterProvision, content: {application/json: {schema: {type: object, properties: {data: {type: object}}}}}}
        '400': {description: Invalid request}
        '409': {description: The site or the cluster exists}
        '503': {description: No SiteNetwork, or no release record to make the cluster at}
  /api/v1/cluster-provisions/{name}:
    get:
      tags: [Clusters]
      summary: One cluster's making, stage by stage (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The ClusterProvision, content: {application/json: {schema: {type: object, properties: {data: {type: object}}}}}}
        '404': {description: Not found}
  /api/v1/cluster-provisions/{name}/retry:
    post:
      tags: [Clusters]
      summary: Go on from the stage a making stopped at (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string, format: password, description: Required when the stage logs in to the machine (every stage up to station)}
                user: {type: string, description: "The account to log in to the machine with from now on, when the one given first was refused"}
      responses:
        '202': {description: Going on}
        '400': {description: The stage logs in to the machine and no password was given}
        '409': {description: The making runs, or has finished}
  /api/v1/cluster-provisions/{name}/clear:
    post:
      tags: [Clusters]
      summary: Take away a making that stopped, or what the making of a deleted cluster left (administrator only)
      description: >-
        Puts the machine back (the installer's control-plane undo, the tunnel), deletes the Cluster a making that did
        not finish listed and the credentials the management plane reaches it with, takes the making's site, name and
        nodes out of the SiteNetwork, and deletes the record; the site, the cluster's name and the machine can then be
        used again. Answers what it did, a line a step.
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string, format: password, description: "The machine's SSH password, when the making reached the machine"}
                user: {type: string, description: The account to log in to the machine with}
                machine_gone: {type: boolean, description: "The machine is not there to be put back: only RLark's records go"}
      responses:
        '200': {description: Cleared, content: {application/json: {schema: {type: object, properties: {steps: {type: array, items: {type: string}}}}}}}
        '400': {description: The making reached the machine and neither its password nor machine_gone was given}
        '409': {description: "The making runs, or its cluster is made and listed (delete the cluster first)"}
        '502': {description: "A step failed; steps holds what was done before it"}
  /api/v1/station/node-admissions:
    get:
      tags: [Station]
      summary: List the node admissions of a cluster (administrator only); never the codes
      parameters:
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Admissions, newest code first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/NodeAdmission'}}
        '400': {description: Missing cluster ID}
        '404': {description: Cluster not found}
        '502': {description: Management API request failed}
    post:
      tags: [Station]
      summary: Admit a machine as a node and give out its one-time join code (administrator only)
      description: >-
        The answer carries the code and the one line to run as root on the machine, once; the
        management plane keeps only the code's SHA-256. A node that has an admission keeps it as what
        declares its tunnel address: a new code for it replaces what the admission declares, labels
        included, and opens it again. Who gave the code out and when is recorded on the admission. Where the
        cluster's API is nobody gives: when the machine redeems the code, Station API answers it the server of the
        cluster's kube-public/cluster-info, where every node of the cluster reaches the API. A cluster that refuses
        Station API what the machine joins with (cluster-info, a join token) leaves the code unredeemed, and the
        machine is told which Role of astribot/station/deploy/member-rbac.yaml the cluster lacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id, node_name]
              additionalProperties: false
              properties:
                cluster_id: {type: string}
                node_name: {type: string, description: The Node name the machine joins as}
                site: {type: string, description: "The site the machine stands in, when it is not its cluster's"}
                address: {type: string, description: Pins the tunnel address; empty lets station-controller allocate one}
                uplink: {type: string, description: "The gateway of a machine whose default route does not lead out, where its site declares no leafUplink"}
                node_class: {type: string, description: "The NodeClass of the machine; the node follows it, and it says what lets the machine out to its site"}
                taints: {type: array, maxItems: 8, items: {type: string, description: "key[=value]:Effect"}}
                labels: {type: object, maxProperties: 32, additionalProperties: {type: string}}
                ttl_seconds: {type: integer, minimum: 600, maximum: 604800, description: Default 7200}
      responses:
        '200': {description: A new code for an existing admission, content: {application/json: {schema: {$ref: '#/components/schemas/IssuedNodeAdmission'}}}}
        '201': {description: Admitted, content: {application/json: {schema: {$ref: '#/components/schemas/IssuedNodeAdmission'}}}}
        '400': {description: Invalid request or unknown site}
        '404': {description: Cluster not found}
        '409': {description: The admission changed meanwhile}
        '502': {description: Management API or Station API request failed}
  /api/v1/station/node-admissions/{name}/reissue:
    post:
      tags: [Station]
      summary: Give out a new code for what an admission declares (administrator only); the earlier code stops working
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttl_seconds: {type: integer, minimum: 600, maximum: 604800, description: Default 7200}
      responses:
        '200': {description: The new code, content: {application/json: {schema: {$ref: '#/components/schemas/IssuedNodeAdmission'}}}}
        '400': {description: Invalid request}
        '404': {description: Cluster or admission not found}
        '409': {description: The admission changed meanwhile}
        '502': {description: Management API or Station API request failed}
  /api/v1/station/node-admissions/{name}/revoke:
    post:
      tags: [Station]
      summary: Withdraw an admission's code before a machine redeems it (administrator only); its expiry becomes now
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: The code no longer works
          content:
            application/json:
              schema:
                type: object
                properties:
                  admission: {$ref: '#/components/schemas/NodeAdmission'}
        '404': {description: Cluster or admission not found}
        '409': {description: A machine has redeemed the code}
        '502': {description: Management API request failed}
  /api/v1/station/node-joins:
    post:
      tags: [Station]
      summary: Join a machine by logging in to it with SSH, in stages (administrator only); the password is used by this join only
      description: >-
        For a scanned Machine, the Gateway first dials its discovered SSH address directly and uses its pinned
        fingerprint and host-key algorithm. Only a network-unreachable or timeout failure falls back through the
        Machine's site Hub, using the site's relay token from the management Secret. The relay receives only the
        token and target address; SSH credentials remain in the encrypted SSH session to the target. Authentication,
        host-key and sudo failures do not retry through the relay. A manual NodeJoin without machine_name remains a
        direct SSH connection. The Gateway logs in with the account given (password, also as keyboard-interactive
        answers), checks the account may use sudo with the supplied sudo_password or login password, reads the node name from the machine's host
        name unless one is given, and records the join as a NodeJoin (<cluster>.<node>, label rlark.io/cluster). It
        then runs the stages in the background from that login and writes each one's state, message and readback
        into status.stages: precheck (the machine, and whether it reaches Station API at the address the code's line
        will use), bundle (the installer, unless the machine holds the one of Station API's sha256, and its tunnel
        key), declare (the machine as a hub of its site by that key), tunnel (until Station API answers through the
        machine's own tunnel; the peers' reports say how far its key has gone), install (a code, and its line run with
        sudo as the unit rlark-join, followed to its end; its lines are the stage's message), node-ready, station
        (NetworkEnrollment Enrolled, admission Joined) and gpu. The three tunnel stages are Skipped for a machine that
        reaches Station API. Login and sudo passwords are request-memory only and are never stored on an object,
        Secret, log or event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id, address, user, password]
              additionalProperties: false
              properties:
                cluster_id: {type: string}
                machine_name: {type: string, description: Scanned Machine name; binds this NodeJoin to the candidate and enables its site's relay fallback}
                host_key: {type: string, description: Pinned SSH fingerprint read during discovery}
                host_key_algorithm: {type: string, description: Pinned SSH host-key algorithm read during discovery}
                machine_type: {type: string, enum: [Server]}
                machine_model: {type: string, description: Optional server model hint}
                labels: {type: object, additionalProperties: {type: string}}
                address: {type: string, description: The machine's IP address or host name}
                port: {type: integer, minimum: 1, maximum: 65535, description: Default 22}
                user: {type: string, maxLength: 64}
                password: {type: string, format: password, maxLength: 4096, description: The login password; sudo is given the same}
                sudo_password: {type: string, format: password, maxLength: 4096, description: Optional separate sudo password; request memory only, never stored}
                node_name: {type: string, description: "Default: the machine's host name, in lower case"}
                tunnel_endpoint: {type: string, description: "The IPv4 ip:port other sites dial for the machine's tunnel, when it joins through one; default the address at port 51820"}
      responses:
        '201': {description: "The join is recorded and runs (data: the NodeJoin)"}
        '400': {description: "Invalid request; reason NodeName (the host name is no node name)"}
        '403': {description: "reason NoSudo or SudoPasswordRejected: the account may not use sudo with its password"}
        '404': {description: Cluster not found}
        '409': {description: "A join of the node is left (retry or clear it), or another runs on the machine"}
        '422': {description: "reason LoginRejected: the machine did not accept the user with this password"}
        '502': {description: "reason Unreachable, RelayUnavailable or RelayRejected; scanned candidates try the site relay only after direct network failure"}
    get:
      tags: [Station]
      summary: List a cluster's SSH joins, running ones first, then the newest (administrator only)
      description: A join that succeeded is listed for 7 days; one that stopped until it is retried to its end or cleared.
      parameters:
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: "items: the NodeJoins"}
        '400': {description: cluster_id is required}
  /api/v1/station/node-joins/{name}:
    get:
      tags: [Station]
      summary: Read one SSH join (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "data: the NodeJoin"}
        '404': {description: No such join}
  /api/v1/station/node-joins/{name}/retry:
    post:
      tags: [Station]
      summary: Go on from the stage a join stopped at (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: {type: string, format: password, description: "Required when the stage logs in to the machine (precheck, bundle, declare, tunnel, install)"}
                sudo_password: {type: string, format: password, description: Optional separate sudo password; request memory only}
                user: {type: string, description: "The account to log in to the machine with from now on"}
                machine_gone: {type: boolean, description: Not used by a retry}
      responses:
        '202': {description: Going on}
        '400': {description: The stage logs in to the machine and no password was given}
        '409': {description: The join runs, or has finished}
  /api/v1/station/node-joins/{name}/clear:
    post:
      tags: [Station]
      summary: Take away a join that is not running, with what it left (administrator only)
      description: >-
        Before its code's line ran: the tunnel it started on the machine (with the password; the key and the installer
        stay) and its declaration of the machine as a hub. After: the node's name is removed as a removal by name does
        (a NodeOperation Remove). Then the record goes. Answers what it did, a line a step.
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: {type: string, format: password}
                sudo_password: {type: string, format: password, description: Optional separate sudo password; request memory only}
                user: {type: string}
                machine_gone: {type: boolean, description: The machine is not there to be put back}
      responses:
        '200': {description: "steps: what was done"}
        '409': {description: The join runs}
        '502': {description: "A step failed; steps: what was done before it"}
  /api/v1/station/machines:
    get:
      tags: [Station]
      summary: List the machines RLark knows of, nodes or not (administrator only); nothing of any account
      description: >-
        A machine comes into the list by being seen on its site's network by a hub of a site that declares
        discovery (source Discovery). The list is what an administrator admits machines from.
      parameters:
        - {name: site, in: query, required: false, schema: {type: string}}
        - {name: phase, in: query, required: false, schema: {type: string, enum: [Discovered, Admitted, Joined]}}
      responses:
        '200':
          description: Machines, newest sighting first, and the labels of their classes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        site: {type: string}
                        node_class: {type: string}
                        machine_type: {type: string, enum: [Robot, Server, Unknown]}
                        machine_model: {type: string}
                        source: {type: string, enum: [Discovery, Registration]}
                        phase: {type: string, enum: [Discovered, Admitted, Joined]}
                        problem: {type: string, description: "What is wrong with the machine, as CredentialRejected; absent when nothing is"}
                        message: {type: string}
                        serial: {type: string}
                        inspected_at: {type: string, format: date-time, description: "When RLark last logged in to the machine's entry device and reached the computer behind it; absent until it has, and again when the machine shows up changed"}
                        node_host_key_fingerprint: {type: string, description: The host key of the computer behind the entry device, read through it}
                        host_key: {type: string, description: SSH fingerprint of the scanned entry candidate}
                        host_key_algorithm: {type: string}
                        port: {type: integer}
                        banner: {type: string}
                        address: {type: string}
                        mac: {type: string, description: The hardware address of the entry device the machine was last seen through}
                        last_seen: {type: string, format: date-time}
                        discovery_scan_id: {type: string, format: uuid, description: ID of the manual scan that observed the entry}
                        cluster_id: {type: string}
                        node_name: {type: string}
                        admissible: {type: boolean, description: "Whether the machine can be admitted now: one that is not a node, was read (serial, inspected_at, node_host_key_fingerprint) and has no problem, or one whose join stopped; never one that is joining"}
                        joining: {type: boolean, description: "An administrator's request for the machine is being acted on, from when it is written until the join it starts succeeds or stops; it is not admitted again meanwhile"}
                        requested_by: {type: string}
                        requested_at: {type: string, format: date-time}
                        admit_cluster_id: {type: string, description: The cluster the machine was admitted to}
                        join:
                          type: object
                          description: Where the NodeOperation of the present request stands; why it stopped, when it did, is the message. Succeeded while the machine is Discovered again means its node was removed since and the request is spent
                          properties:
                            phase: {type: string, enum: [Pending, Running, Blocked, Succeeded, Failed]}
                            stage: {type: string, description: The last stage it completed}
                        node_join: {type: object, properties: {phase: {type: string}, stage: {type: string}, reason: {type: string}}}
                        observed_identity: {type: object, properties: {category: {type: string}, model: {type: string}, source: {type: string}}}
                        identity_verified: {type: string, enum: [True, False, Unknown]}
                        identity_reason: {type: string}
                  classes:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        kind: {type: string, enum: [Robot, Server]}
                        model: {type: string}
                        labels: {type: object, additionalProperties: {type: string}}
                        taints: {type: array, items: {type: string}}
                        naming: {type: object, additionalProperties: true}
                        hasDiscovery: {type: boolean}
                        hostKeyFingerprints: {type: array, items: {type: string}}
                        entryPort: {type: integer}
                        access: {type: object, description: Configured booleans only; never includes credential values}
        '502': {description: Management API request failed}
  /api/v1/station/site-network:
    get:
      tags: [Station]
      summary: Read SiteNetwork discovery settings and public network status (administrator only)
      description: SiteNetwork status.declared.config is removed. NodeClass responses contain discovery port and host-key fingerprints, never access credentials.
      responses:
        '200': {description: Site network view, content: {application/json: {schema: {$ref: '#/components/schemas/SiteNetworkView'}}}}
        '404': {description: SiteNetwork is not initialized}
        '502': {description: Management API request failed}
  /api/v1/station/robot-models:
    get:
      tags: [Station]
      summary: List configured robot models and their reference counts (administrator only)
      description: The directory is control-plane managed. The console can list and delete models, but cannot create or edit them.
      responses:
        '200': {description: Robot models and references from NodeClasses, site nodes, Machines, NodeAdmissions and NodeJoins. Supported models also include a versioned capabilities profile with variants, camera slot IDs, joint group dimensions and units, and endpoint IDs.}
        '502': {description: Management API request failed}
  /api/v1/station/robot-models/{name}:
    delete:
      tags: [Station]
      summary: Delete an unreferenced robot model (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Deleted}
        '404': {description: RobotModel not found}
        '409': {description: The model is referenced by a NodeClass or node record}
        '502': {description: Management API request failed}
  /api/v1/station/site-network/sites/{site}/discovery:
    put:
      tags: [Station]
      summary: Replace one site's discovery settings (administrator only)
      description: Requires the current resourceVersion. The update changes only the named site's discovery field. A concurrent update returns 409 and is not retried.
      parameters:
        - {name: site, in: path, required: true, schema: {type: string, maxLength: 63}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceVersion, discovery]
              additionalProperties: false
              properties:
                resourceVersion: {type: string, minLength: 1}
                discovery:
                  nullable: true
                  oneOf:
                    - {$ref: '#/components/schemas/SiteDiscoveryInput'}
      responses:
        '200': {description: Updated SiteNetwork view, content: {application/json: {schema: {$ref: '#/components/schemas/SiteNetworkView'}}}}
        '400': {description: Invalid request or discovery settings}
        '404': {description: SiteNetwork or site not found}
        '409': {description: SiteNetwork changed since it was read}
        '502': {description: Management API request failed}
  /api/v1/station/site-network/sites/{site}/scan:
    get:
      tags: [Station]
      summary: Read a site's latest manual discovery scan (administrator only)
      parameters:
        - {name: site, in: path, required: true, schema: {type: string, maxLength: 63}}
      responses:
        '200': {description: Latest scan or JSON null before any scan, content: {application/json: {schema: {$ref: '#/components/schemas/DiscoveryScan'}}}}
        '403': {description: Administrator access required}
        '404': {description: SiteNetwork or site not found}
    post:
      tags: [Station]
      summary: Start a single discovery scan on the configured Hubs of a site (administrator only)
      parameters:
        - {name: site, in: path, required: true, schema: {type: string, maxLength: 63}}
      description: Concurrent requests share the active scan. Retrying the latest scan ID returns its current state. A scan expires after five minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id: {type: string, format: uuid, description: Canonical version-4 UUID generated by the caller}
      responses:
        '200': {description: Latest terminal scan with the requested ID, content: {application/json: {schema: {$ref: '#/components/schemas/DiscoveryScan'}}}}
        '202': {description: Accepted or already running, content: {application/json: {schema: {$ref: '#/components/schemas/DiscoveryScan'}}}}
        '400': {description: Invalid site or request ID}
        '403': {description: Administrator access required}
        '404': {description: SiteNetwork or site not found}
        '409': {description: Discovery settings or an enrolled Hub are unavailable}
  /api/v1/station/machines/admit:
    post:
      tags: [Station]
      summary: Admit machines of the list as nodes of a cluster (administrator only)
      description: >-
        Writes the decision on each Machine with who made it and when. station-controller gives each machine
        the next name of its class, a NodeAdmission and the NodeOperation that joins it over SSH; nobody types
        anything at the machine. Each machine is answered for by itself; one that is being joined already (joining in
        the list) is refused, with the cluster, who asked and when.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id, machines]
              additionalProperties: false
              properties:
                cluster_id: {type: string}
                machines: {type: array, minItems: 1, maxItems: 500, items: {type: string}}
                node_class: {type: string, description: Robot NodeClass profile}
                machine_type: {type: string, enum: [Robot], description: Server machines must use NodeJoin}
                machine_model: {type: string, description: RobotModel for the selected Robot profile}
                model: {type: string, description: Compatibility alias for machine_model}
                labels: {type: object, additionalProperties: {type: string}, description: "Replace, for these machines, the values of labels their class declares"}
      responses:
        '200':
          description: What became of each machine
          content:
            application/json:
              schema:
                type: object
                properties:
                  machines:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        admitted: {type: boolean}
                        error: {type: string}
        '400': {description: Invalid request}
        '404': {description: Cluster not found}
        '502': {description: Management API request failed}
  /api/v1/station/node-classes/{name}/access:
    get:
      tags: [Station]
      summary: Which passwords of a NodeClass have been entered (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}, description: The NodeClass}
      description: >-
        The passwords every machine of a class has are values of job secrets the class names
        (access.entry.password, access.node.password, access.node.sudoPassword). The answer says for each
        which secret and key it is, whether a value is there, and for the node's passwords who entered them
        and when. No value is ever answered.
      responses:
        '200':
          description: The passwords of the class
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeClassAccess'}
        '404': {description: NodeClass not found}
        '409': {description: The NodeClass declares no access}
        '502': {description: Management API request failed}
    put:
      tags: [Station]
      summary: Enter the node's passwords of a NodeClass (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}, description: The NodeClass}
      description: >-
        Writes the password of the computers of the class and, where sudo asks for another, that one, as the
        values the class names in a job secret that exists; the secret's other values stay. The machines of
        the class are then looked at anew. Who entered them is recorded on the NodeClass and in the audit log.
        Until the node's password has been entered nobody logs in to the machines of the class and none can
        be admitted (Machine problem AccessUnconfigured).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_password]
              additionalProperties: false
              properties:
                node_password: {type: string, maxLength: 256, writeOnly: true}
                sudo_password: {type: string, maxLength: 256, writeOnly: true, description: "Only where sudo asks for another password than node_password"}
      responses:
        '200':
          description: The passwords of the class, as GET answers them
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeClassAccess'}
        '400': {description: Invalid request}
        '404': {description: NodeClass not found}
        '409': {description: The NodeClass declares no access, or the secret it names does not exist}
        '502': {description: Management API request failed}
  /api/v1/secrets:
    get:
      tags: [Secrets]
      summary: List job secrets without their values (administrator only)
      responses:
        '200': {description: "Name, description, clusters and keys of every job secret"}
    post:
      tags: [Secrets]
      summary: Create a job secret and deliver it to the Job namespace of the selected clusters (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, clusters, data]
              properties:
                name: {type: string, description: "Name of the delivered Kubernetes Secret; a Job refers to it by this name"}
                description: {type: string}
                clusters: {type: array, items: {type: string}}
                data: {type: object, additionalProperties: {type: string}}
      responses:
        '201': {description: "Declared; each cluster's agent applies it"}
        '400': {description: "Invalid or reserved name, no cluster, no data"}
        '409': {description: "A secret of this name exists"}
  /api/v1/secrets/{name}:
    put:
      tags: [Secrets]
      summary: Replace the clusters and all values of a job secret (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Replaced"}
        '404': {description: "Secret not found"}
    delete:
      tags: [Secrets]
      summary: Delete a job secret from the management plane and its clusters (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Deleted"}
        '404': {description: "Secret not found"}
  /api/v1/service-accounts:
    get:
      tags: [Service accounts]
      summary: List service accounts (administrator only); tokens are never returned
      responses:
        '200': {description: "Name, role, tenants and delivery of every service account"}
    post:
      tags: [Service accounts]
      summary: Create a service account and return its token once (administrator only)
      description: >-
        A service account is how a program calls this API. Its token is sent as a Bearer token, does not expire,
        and stops working when it is rotated or the account is deleted. With deliver, the token is kept as a job
        secret (keys token and service-account) on the given clusters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
                role: {type: string, enum: [user, operator, admin], default: user}
                tenant_ids: {type: array, items: {type: string}}
                deliver:
                  type: object
                  properties:
                    clusters: {type: array, items: {type: string}}
                    secret_name: {type: string}
      responses:
        '201': {description: "Created; the response carries the token"}
        '400': {description: "Invalid name, role or delivery"}
        '409': {description: "A service account of this name exists"}
  /api/v1/service-accounts/{name}/token:
    post:
      tags: [Service accounts]
      summary: Replace a service account's token; the previous one stops working at once (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "The new token"}
        '404': {description: "Service account not found"}
  /api/v1/service-accounts/{name}:
    delete:
      tags: [Service accounts]
      summary: Delete a service account, revoking its token and removing its delivered secret (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Deleted"}
        '404': {description: "Service account not found"}
  /api/v1/station/stations:
    get:
      tags: [Station]
      summary: List site node records (administrator only)
      parameters:
        - {name: cluster_id, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
        - {name: continue, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: >-
            The NetworkEnrollment of each node (spec; status with phase and the network answer, observation and node),
            without status.config
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object}}
                  continue: {type: string}
        '400': {description: Invalid list limit}
        '403': {description: Administrator role required}
        '502': {description: Management Kubernetes API unavailable}
  /api/v1/station/stations/{name}:
    get:
      tags: [Station]
      summary: Get a site node record by Node name and registered Cluster (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: The node's NetworkEnrollment, without status.config}
        '400': {description: Cluster ID required}
        '403': {description: Administrator role required}
        '404': {description: Cluster or site node not found}
        '409': {description: Invalid cluster namespace mapping}
        '502': {description: Management Kubernetes API unavailable}
    delete:
      tags: [Station]
      summary: Delete a site node record (administrator only)
      description: >-
        The record (the node's NetworkEnrollment) is deleted when its node was removed (spec.retired), when another
        Node reports under its name (status.node.state Conflict), or when its node does not report (is not Bound) and
        RLark has no Node of the name. A node that comes back registers again with its next report, as a new machine.
        A record that is gone already answers 200: the request can be made again.
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: The record is gone}
        '400': {description: Cluster ID required}
        '404': {description: Cluster not found}
        '409': {description: The node is in the cluster (remove it first), or the record changed while it was being deleted}
        '502': {description: Management Kubernetes API unavailable}
  /api/v1/station/stations/{name}/running-images:
    get:
      tags: [Station]
      summary: List observed running container images for a site node (administrator only)
      description: >-
        Reads Kubernetes Pod container statuses through the member cluster agent. The registered node UID
        must match the member Node UID. The snapshot includes only containers in the Running state.
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
        - {name: node_uid, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Running container image snapshot
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [namespace, pod, container, image]
                      properties:
                        namespace: {type: string}
                        pod: {type: string}
                        container: {type: string}
                        image: {type: string}
                        imageID: {type: string, description: Runtime-reported image ID when available}
        '400': {description: Invalid node name or cluster ID, or missing node UID}
        '403': {description: Administrator role required}
        '404': {description: Cluster, site node record, or member Node not found}
        '409': {description: Cluster namespace ownership or node identity could not be verified}
        '502': {description: Management or member Kubernetes API unavailable}
  /api/v1/station/stations/{name}/body-state:
    get:
      tags: [Station]
      summary: Read the latest robot body state (administrator only, preview)
      description: >-
        Reads the collector attached to the verified member Node instance. Returns the model capability profile and
        body variant when supported, and a snapshot only when the collector is reachable. Samples are aged independently
        and the collector omits values once stale. Driver timestamps and frame IDs are optional.
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
        - {name: node_uid, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Collector and model support status
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string, enum: [available, unavailable, unsupported]}
                  body: {type: string}
                  capabilities: {type: object, description: Versioned model capability profile}
                  snapshot:
                    type: object
                    required: [version, nodeUID, body, joints, endpoints]
                    properties:
                      version: {type: integer, enum: [1]}
                      nodeUID: {type: string}
                      body: {type: string}
                      joints: {type: array, items: {$ref: '#/components/schemas/RobotBodySample'}}
                      endpoints: {type: array, items: {$ref: '#/components/schemas/RobotBodySample'}}
        '400': {description: Missing or invalid node selection}
        '403': {description: Administrator access required}
        '404': {description: Station record or member Node was not found}
        '409': {description: Cluster ownership or node instance could not be verified}
        '502': {description: Upstream connection or collector response failed}
  /api/v1/station/node-operations:
    post:
      tags: [Station]
      summary: Remove a node (administrator only)
      description: Requires a registered Cluster and an installed NodeOperation CRD/controller. Only Remove is asked for here; the Joins in the list are station-controller's, for the machines an administrator admits (POST /api/v1/station/machines/admit), and a machine joined by SSH runs its code's line (POST /api/v1/station/node-joins). Remove takes only the node name and its UID and logs in nowhere. A robot (a Node with rlark.io/power-state) is first powered off its own way, its wanted power set to off so that its driver stops before its motors; one a Run or a session uses (rlark.io/in-use) stops the removal, and one whose node no longer reports is not powered off (the operation says so in its station.rlark.io/power-off annotation). It drains with PDBs (a node whose kubelet no longer reports has its pods deleted), takes the node out of the network DaemonSet, retires the node's site node record and takes the machine's key off its admission (it leaves the tunnel and its name is free), resets a node whose kubelet still reports from a pod on that node (kubeadm reset; a node that no longer reports is reset when its machine joins again), deletes the Node and then its site node record; a node the SiteNetwork declares with a key blocks before drain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id, request_id, action, node_name, node_uid]
              additionalProperties: false
              properties:
                cluster_id: {type: string, maxLength: 128}
                request_id: {type: string, maxLength: 128}
                action: {type: string, enum: [Remove]}
                node_name: {type: string, maxLength: 253}
                node_uid: {type: string, maxLength: 128}
      responses:
        '202': {description: Operation accepted or identical request returned; inspect its status before retrying}
        '400': {description: Invalid or unsupported request}
        '401': {description: Authentication required}
        '403': {description: Administrator role required}
        '404': {description: Cluster not found}
        '409': {description: Request ID conflict}
        '502': {description: Management Kubernetes API failure}
        '503': {description: Station API unavailable}
    get:
      tags: [Station]
      summary: List node lifecycle operations for a registered Cluster (administrator only)
      parameters:
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: continue, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Current operation status without credential references}
        '400': {description: Cluster ID required}
        '403': {description: Administrator role required}
        '404': {description: Cluster not found}
        '502': {description: Management Kubernetes API failure}
        '503': {description: Station API unavailable}
  /api/v1/station/node-operations/{name}:
    get:
      tags: [Station]
      summary: Get a node lifecycle operation (administrator only)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cluster_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Current operation status without credential references}
        '400': {description: Cluster ID required}
        '403': {description: Administrator role required}
        '404': {description: Cluster or operation not found}
        '409': {description: Invalid cluster namespace mapping}
        '502': {description: Management Kubernetes API failure}
        '503': {description: Station API unavailable}
  /api/v1/image-registries/{id}/repositories:
    get:
      tags: [Image]
      summary: List a registry's repositories (administrator only)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: last, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of repository names and an optional next cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: string}}
                  next: {type: string}
        '400': {description: Invalid parameter}
        '403': {description: Administrator role required}
        '404': {description: Registry not found}
        '502': {description: Registry unavailable, unsupported, or not allowlisted}

  /api/v1/image-registries/{id}/tags:
    get:
      tags: [Image]
      summary: List registry repository tags (administrator only)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: repository, in: query, required: true, schema: {type: string}}
        - {name: last, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of tags and an optional next cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: string}}
                  next: {type: string}
        '400': {description: Invalid parameter}
        '403': {description: Administrator role required}
        '404': {description: Registry not found}
        '502': {description: Registry unavailable, unsupported, or not allowlisted}

  /api/v1/image-registries/{id}/tag-details:
    get:
      tags: [Image]
      summary: List tags with image build time, size and platforms (administrator only)
      description: >-
        Reads one tag page, then each tag's manifest and image config. Metadata is
        cached in Gateway memory by manifest digest; tags are resolved on every call.
        A tag whose metadata cannot be read (unsupported media type, redirect,
        oversized document or digest mismatch) is returned with error "unavailable"
        and without metadata.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: repository, in: query, required: true, schema: {type: string}}
        - {name: last, in: query, schema: {type: string}}
      responses:
        '200':
          description: A page of tag details in registry order and an optional next cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [tag]
                      properties:
                        tag: {type: string}
                        digest:
                          type: string
                          description: Manifest digest the tag currently points to
                        created:
                          type: string
                          format: date-time
                          description: Image config created time; linux/amd64 for multi-platform images
                        size:
                          type: integer
                          format: int64
                          description: Config plus compressed layer bytes
                        platforms:
                          type: array
                          items: {type: string}
                          description: "Platforms as os/architecture or os/architecture/variant"
                        error: {type: string, enum: [unavailable]}
                  next: {type: string}
        '400': {description: Invalid parameter}
        '403': {description: Administrator role required}
        '404': {description: Registry not found}
        '502': {description: Registry unavailable, unsupported, not allowlisted, or request canceled}

  /api/v1/image-registries/{id}/manifest:
    get:
      tags: [Image]
      summary: Read the manifest digest for a tag (administrator only)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: repository, in: query, required: true, schema: {type: string}}
        - {name: tag, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Manifest digest
          content:
            application/json:
              schema:
                type: object
                properties:
                  digest: {type: string}
        '400': {description: Invalid parameter}
        '403': {description: Administrator role required}
        '404': {description: Registry not found}
        '502': {description: Registry unavailable, unsupported, or not allowlisted}

  /api/v1/clusters/{cluster_id}/node-agents:
    put:
      tags: [Cluster]
      summary: Declare a cluster's node Agents
      description: >-
        Administrator-only. Replaces the Cluster's spec.nodeAgents. While enabled, the cluster Agent keeps one
        node Agent DaemonSet (rlark-agent-node) on the Kubernetes Nodes matching nodeSelector, so a Node that
        joins later gets its node Agent without further action; enabled false makes it delete that DaemonSet.
      operationId: setClusterNodeAgents
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterNodeAgents'
            example: {enabled: true}
      responses:
        '200':
          description: Declaration stored; the response is the updated cluster
          content:
            application/json:
              schema:
                type: object
                required: [data, success]
                properties:
                  data: {$ref: '#/components/schemas/ClusterInfo'}
                  success: {type: boolean}
        '400': {description: enabled missing, empty nodeSelector, or an invalid label key or value}
        '404': {description: Cluster not found}

  /api/v1/clusters/{cluster_id}/cluster-type:
    put:
      tags: [Cluster]
      summary: Set a cluster's type (administrator only; audited with its actor)
      description: >-
        Sets the Cluster's label rlark.io/cluster-type: gpu (GPU 集群) or robot (机器人集群). A cluster made with POST
        /api/v1/cluster-provisions has it from its making. A Node's kind stays the official
        rlark.io/node-category-{cloud,edge,robot} label.
      operationId: setClusterType
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clusterType]
              properties:
                clusterType: {type: string, enum: [gpu, robot]}
      responses:
        '200':
          description: Type stored; the response is the updated cluster
          content:
            application/json:
              schema:
                type: object
                required: [data, success]
                properties:
                  data: {$ref: '#/components/schemas/ClusterInfo'}
                  success: {type: boolean}
        '400': {description: clusterType is not gpu or robot}
        '404': {description: Cluster not found}

  /api/v1/clusters/{cluster_id}/display-name:
    put:
      tags: [Cluster]
      summary: Set or clear a cluster's display name (administrator only; audited with its actor)
      description: >-
        Sets the Cluster's spec.displayName, trimmed; an empty name clears it and the cluster is shown by its ID.
        The name is unique among the Clusters' display names and IDs. The cluster ID (metadata.name) never changes.
      operationId: setClusterDisplayName
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: {type: string, maxLength: 64, description: 'Letters, digits, Chinese characters, ".", "_" and "-"; empty clears it.'}
            example: {displayName: 金山云宁夏}
      responses:
        '200':
          description: Display name stored; the response is the updated cluster
          content:
            application/json:
              schema:
                type: object
                required: [data, success]
                properties:
                  data: {$ref: '#/components/schemas/ClusterInfo'}
                  success: {type: boolean}
        '400': {description: displayName longer than 64 characters or with a character outside the class}
        '404': {description: Cluster not found}
        '409': {description: 'Another cluster already uses the name as its display name or ID ("display name already used by <id>")'}

  /api/v1/rlinf.io/v1alpha1/nodes/{name}/station-mark:
    put:
      tags: [Node]
      summary: Mark a robot Station for repair or disable it, or clear its mark (administrator or operator)
      description: >-
        Stores the mark as rlark.io/station-mark and records mark, reason, actor and time in
        rlark.io/station-mark-set. Setting a mark atomically releases the existing robot claim.
        New claims and renewals are rejected while the mark remains. An empty mark clears it.
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mark]
              properties:
                mark: {type: string, enum: [repair, disabled, '']}
                reason: {type: string, description: Required for repair and disabled}
                holder: {type: string, description: When given, an existing claim must belong to this Run}
      responses:
        '200':
          description: The updated node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400': {description: Invalid mark or reason, or the node is not a robot}
        '403': {description: Operator access is required}
        '404': {description: Node not found}
  /api/v1/rlinf.io/v1alpha1/nodes/{name}/robot-restart:
    post:
      tags: [Node]
      summary: Restart a robot's driver, or its motors and driver, for the Run that holds it (audited with its actor)
      description: >-
        Only for the caller that made the robot's claim, or an administrator or operator. The Node's PATCH and PUT
        refuse a body that would write the annotation. Writes the annotation rlark.io/robot-restart {id, level,
        holder, by, at} on the Node; the agents carry it to
        the member cluster's Node, where the robot's power service (s1u-robot Addon) runs each new id once: the
        driver stopped and the arms let sink (the node profile's S1U_DRIVER_STOP_SECONDS), for level power the motors
        off for the vendor's 10 s, then powered and the driver started until ready. It runs only while the claim on
        the robot names the holder and every in-use mark on the robot names the holder's Run ("... Run <holder> ...")
        and no maintenance holds it; otherwise it fails with the reason. The desired power (rlark.io/robot-power)
        stays as it is. Progress is the Node's annotation rlark.io/power.restart and "restart" in rlark.io/power:
        {id, level, holder, phase: lowering | raising | done | failed, error, at (unix seconds)}.
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, holder, request_id]
              properties:
                level: {type: string, enum: [driver, power]}
                holder: {type: string, description: "The Run that holds the robot (its claim's holder)"}
                request_id: {type: string, maxLength: 63, description: "A label value; the same id asked again is the same request"}
      responses:
        '200': {description: "The request recorded: id, level, holder, by, at"}
        '400': {description: level, holder or request_id is invalid}
        '404': {description: Not Found}
        '409': {description: "ROBOT_CLAIM_BUSY: the robot is not held by holder for the caller (details.current: its claim, null: none), or its station is marked (details.mark)"}
  /api/v1/rlinf.io/v1alpha1/nodes/{name}/station:
    put:
      tags: [Node]
      summary: Set the robot Station a robot stands at (administrator or operator; audited with its actor)
      description: >-
        The label rlark.io/station (S01, S02, …), unique among the cluster's robots. station-controller gives a robot
        the first free one when it admits the machine; this changes it. The node's NodeAdmission takes it as one of
        the machine's own labels (station.rlark.io/machine-labels), so that its NodeClass keeps it and the machine
        joined again stands at the same Station, and the RLark Node carries it at once. The Node's PATCH and PUT
        refuse a body that would change the label.
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [station]
              properties:
                station: {type: string, pattern: '^S[0-9]{2,3}$'}
            example: {station: S01}
      responses:
        '200':
          description: The Node with its new label
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400': {description: station is not S and two or three digits, or the node is not a robot}
        '403': {description: Neither administrator nor operator}
        '404': {description: Not Found}
        '409': {description: Another robot of the cluster stands at that Station, the robot has no NodeAdmission, or the admission changed meanwhile}
  /api/v1/rlinf.io/v1alpha1/nodes/{name}/robot-power:
    put:
      tags: [Node]
      summary: Set the power a robot is wanted to have (administrator or operator; audited with its actor)
      description: >-
        Writes the Node's label rlark.io/robot-power (the state and the time it was set) and the annotation
        rlark.io/robot-power-set (desired, by, at). The robot's model Addon converges on the label. This is the
        only way the label changes: the Node's PATCH and PUT refuse a body that would change it.
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desired]
              properties:
                desired: {type: string, enum: [off, powered, ready]}
      responses:
        '200':
          description: The Node with its new label
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400': {description: desired is not off, powered or ready}
        '404': {description: Not Found}
  /api/v1/rlinf.io/v1alpha1/nodes/{name}/robot-pose:
    post:
      tags: [Node]
      summary: Hold-to-move a robot to a pose (administrator or operator; a movement's start and end and every refusal audited with its actor)
      description: >-
        The vendor page's 初始姿势 (Home Pose), a momentary command and no desired state. Send hold while the button is
        held, about every 200 ms, and stop when it is let go. The robot's power service (s1u-robot Addon) moves the
        robot from the first hold (the vendor's pose_running) and stops it (pose_stop) on stop or 0.5 s after the last
        hold. It refuses a robot not powered, without its driver, held by a Run, in use or in maintenance; a hold
        refused while the robot moves stops it. The vendor checks the robot's state, control source and permission
        itself. The request reaches the service on the robot's Unix socket through the server and that node's own
        Agent (/api/nodeproxy/{agent}/{node}/api/astribot/services/s1u-power/pose).
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pose, action]
              properties:
                pose: {type: string, enum: [home]}
                action: {type: string, enum: [hold, stop]}
      responses:
        '200':
          description: "{pose, moving, started: this hold started the movement, vendor: the vendor's reply to pose_running or pose_stop (null when none was sent)}"
        '400': {description: pose or action is invalid, or the Node is not a robot with a power service (no rlark.io/power-state)}
        '403': {description: Neither administrator nor operator}
        '404': {description: Not Found}
        '409':
          description: >-
            Refused, {reason, state}: reason is estop, fault, not_powered, driver_not_running, claimed, in_use, "maintenance: <why>"
            or vendor_monitor_down; state is the robot's state as GET /power on the node reads it
        '502': {description: "UPSTREAM_UNAVAILABLE: the vendor's web server failed, or the node, its Agent or the power service is not reached"}
  /api/v1/rlinf.io/v1alpha1/nodes/{name}/robot-claim:
    put:
      tags: [Node]
      summary: Claim a robot for a Run, or renew the claim (any caller; audited with its actor)
      description: >-
        Writes the Node's label rlark.io/robot-claim (the holder) and the annotation rlark.io/robot-claim-set
        (holder, job, by, grantedAt, until). A free robot is granted; the same holder applying again from the same
        caller renews (until moves forward, grantedAt stays). A claim lasts until it is released or the sweeper ends
        it, its lease over, on the management plane only (every 10 s; a minute after the Gateway starts, and after
        its upstream comes back, nothing is ended, so that after an outage longer than a lease the holders renew
        first); until then nobody else is granted the robot. This is the only way the label changes: the Node's PATCH and PUT refuse a body that
        would change it.
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
        - name: renew
          in: query
          schema: {type: boolean}
          description: >-
            Only renew: the robot must carry this holder's claim from the same caller (its lease over or not, while
            the sweeper has not ended it), whose grantedAt stays; otherwise 409 and nothing is granted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder]
              properties:
                holder: {type: string, maxLength: 40, description: "A label value: letters, digits, _ - ."}
                job: {type: string}
                leaseSeconds: {type: integer, minimum: 5, maximum: 600, default: 60}
      responses:
        '200': {description: "The claim: holder, job, by, grantedAt, until"}
        '400': {description: holder or leaseSeconds is invalid, or renew is not a boolean}
        '404': {description: Not Found}
        '409': {description: "ROBOT_CLAIM_BUSY: held by another, or with renew not this claim; details.current is the robot's claim (null: none)"}
    delete:
      tags: [Node]
      summary: Release a robot's claim (its holder; or forced, administrator or operator with a reason)
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
        - {name: holder, in: query, schema: {type: string}}
        - {name: force, in: query, schema: {type: boolean}}
        - {name: reason, in: query, schema: {type: string}}
      responses:
        '200': {description: "The claim released (holder, job, by, grantedAt, until), or {} when the robot had none"}
        '400': {description: A forced release without a reason}
        '403': {description: A forced release by neither administrator nor operator}
        '404': {description: Not Found}
        '409': {description: "ROBOT_CLAIM_BUSY: held by another; details.current is its claim"}
  /api/v1/rlinf.io/v1alpha1/nodes/{name}/station-logs:
    get:
      tags: [Nodes]
      summary: The active Station container's latest 200 lines (operator or administrator)
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
        - name: namespace
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Station log tail
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs: {type: string}
        '403': {description: Operator access required}
        '404': {description: Node or running robot Addon missing}
        '502': {description: Member cluster could not serve the logs}
  /api/v1/rlinf.io/v1alpha1/nodes/{name}/cameras:
    get:
      tags: [Node]
      summary: A robot's cameras and their state (anyone signed in)
      description: >-
        What the camera service of the robot's model Addon (s1u-robot's video container, port 18891 on the node)
        answers, reached through the member cluster's API server as a proxy of the node's running s1u-robot Pod. The
        Node annotation rlark.io/cameras stores the report when a state changes (label rlark.io/camera-state).
        This live endpoint reports current rates and ages plus an optional clock sample.
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: The cameras of the robot's body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotCameras'
        '400': {description: namespace is not a cluster's (rlark-<cluster>)}
        '404': {description: No such Node, or no s1u-robot Pod runs on it}
        '502': {description: The cluster or the robot did not answer}
        '503': {description: The API server does not reach the robot's Pod}
  /api/v1/rlinf.io/v1alpha1/nodes/{name}/cameras/{camera}:
    get:
      tags: [Node]
      summary: A robot camera's newest JPEG, or the camera wall (anyone signed in)
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
        - name: camera
          in: path
          required: true
          schema: {type: string, enum: [head.jpg, torso.jpg, wrist_left.jpg, wrist_right.jpg, wall.jpg]}
          description: >-
            <view>.jpg: the camera's own newest JPEG; wall.jpg: the body's views as one 256 x 144 image of 2 x 2
            cells of 128 x 72 (head, torso / wrist_left, wrist_right), a view without a fresh frame (or that the body
            lacks) black.
      responses:
        '200':
          description: The JPEG; a view's carries X-Age-Seconds, the seconds since the robot received it
          headers:
            X-Age-Seconds: {schema: {type: number}}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '404': {description: No such Node, no s1u-robot Pod on it, a view the robot's body lacks, or no such camera}
        '502': {description: The cluster or the robot did not answer}
        '503': {description: The camera has sent no frame yet, or the API server does not reach the robot's Pod}
  /api/v1/rlinf.io/v1alpha1/nodes/{name}/cameras/{camera}/stream:
    get:
      tags: [Node]
      summary: A robot camera's stream, or the camera wall's (anyone signed in)
      description: >-
        multipart/x-mixed-replace of JPEGs, each part as the robot sends it (a view's parts are the camera's own
        JPEGs with X-Age-Seconds and X-Camera-Capture-Ms when the ROS capture timestamp is valid). A camera
        that stopped sends its last frame again each second. Passed on part by part, never buffered; usable as an <img> source (the console's session cookie
        authenticates it). The robot serves at most 16 streams at a time.
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
        - name: camera
          in: path
          required: true
          schema: {type: string, enum: [head, torso, wrist_left, wrist_right, wall]}
        - name: fps
          in: query
          schema: {type: integer, minimum: 1}
          description: Parts a second at most, 1 to 30 for a view (default 10), 1 to 10 for the wall (default 5)
      responses:
        '200':
          description: The stream, until the viewer leaves
          content:
            multipart/x-mixed-replace:
              schema: {type: string, format: binary}
        '400': {description: fps is out of range, or namespace is not a cluster's}
        '404': {description: No such Node, no s1u-robot Pod on it, a view the robot's body lacks, or no such camera}
        '502': {description: The cluster or the robot did not answer}
        '503': {description: The camera has sent no frame yet, the robot serves 16 streams already, or the API server does not reach the robot's Pod}
  /api/v1/rlinf.io/v1alpha1/nodes/{name}/display-name:
    put:
      tags: [Node]
      summary: Set or clear a Node's display name (administrator only; audited with its actor)
      description: >-
        Sets the Node's spec.displayName, trimmed; an empty name takes it away and the Node is shown by its name.
        The name is unique among all Nodes' display names and names in every namespace. metadata.name, the
        Kubernetes Node name that Jobs, Stations and SiteNetwork key on, never changes. This is the only way
        spec.displayName changes: the Node's PATCH and PUT refuse a body that would change it.
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: {type: string, maxLength: 64, description: 'Letters, digits, Chinese characters, ".", "_" and "-"; empty clears it.'}
      responses:
        '200':
          description: The Node with its new display name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400': {description: displayName longer than 64 characters or with a character outside the class}
        '404': {description: Not Found}
        '409': {description: 'Another Node already uses the name as its display name or name ("display name already used by <namespace>/<name>")'}

components:
  schemas:
    RobotBodySample:
      type: object
      required: [id, state]
      properties:
        id: {type: string}
        state: {type: string, enum: [waiting, live, stale]}
        ageSeconds: {type: number, minimum: 0}
        sourceUnixSeconds: {type: number}
        frame: {type: string}
        position: {type: array, items: {type: number}, description: Joint positions or the endpoint XYZ}
        velocity: {type: array, items: {type: number}, description: Joint velocities}
        quaternion: {type: array, minItems: 4, maxItems: 4, items: {type: number}, description: Endpoint orientation in XYZW order}
    Node:
      description: >-
        What a robot's Node carries for its users besides the official fields. Labels: rlark.io/robot-id,
        rlark.io/robot-body, rlark.io/robot-model; rlark.io/station, the Station it stands at (S01, …; PUT
        nodes/{name}/station); rlark.io/robot-claim; rlark.io/station-mark; rlark.io/robot-power (desired),
        rlark.io/power-state; rlark.io/clock-state (the clock container: locked within 50 ms of the site's time source, slewing, no_source, unreachable, no_hardware_clock).
        Annotations: rlark.io/power ({desired, used_by_a_run, state, waiting, recovered, errors, restart}),
        rlark.io/power.restart (the last restart asked for, POST nodes/{name}/robot-restart), rlark.io/robot-claim-set,
        rlark.io/station-mark-set, rlark.io/cameras, rlark.io/self-check, rlark.io/clock-report ({offset_ms: the robot
        ahead of the source, frequency_ppm, source, device, at}). status.addresses: the address of type InternalIP is the one the node reaches its cluster at,
        for a robot its WireGuard tunnel address (10.254.240.x), at which its device layer and vendor page answer.
    SiteNetworkView:
      type: object
      required: [resourceVersion, generation, sites, members, nodeClasses, status]
      properties:
        resourceVersion: {type: string}
        generation: {type: integer, format: int64}
        sites:
          type: array
          items:
            type: object
            required: [name, clusters]
            properties:
              name: {type: string}
              clusters: {type: array, items: {type: string}}
              discovery: {allOf: [{$ref: '#/components/schemas/SiteDiscovery'}], nullable: true}
        members:
          type: array
          items:
            type: object
            properties:
              clusterID: {type: string}
              nodeName: {type: string}
              role: {type: string}
              site: {type: string}
              address: {type: string}
        nodeClasses:
          type: array
          items:
            type: object
            required: [name, hasAccess, hasDiscovery, hostKeyFingerprints]
            properties:
              name: {type: string}
              hasAccess: {type: boolean}
              hasDiscovery: {type: boolean}
              entryPort: {type: integer}
              hostKeyFingerprints: {type: array, items: {type: string}}
        status: {type: object, description: 'SiteNetwork status with status.declared[].config removed'}
    DiscoveryScan:
      type: object
      nullable: true
      required: [id, startedAt, phase, total, completed, failed]
      properties:
        id: {type: string, format: uuid}
        startedAt: {type: string, format: date-time}
        phase: {type: string, enum: [Running, Succeeded, Failed, TimedOut]}
        total: {type: integer, minimum: 1}
        completed: {type: integer, minimum: 0, description: Number of completed Hub results including failures}
        failed: {type: integer, minimum: 0}
    SiteDiscovery:
      type: object
      required: [enabled, ranges, intervalSeconds, from]
      properties:
        enabled: {type: boolean}
        ranges: {type: array, minItems: 1, maxItems: 8, items: {type: string, format: cidr}}
        intervalSeconds: {type: integer, minimum: 10, maximum: 3600, description: Legacy cadence for older Hubs}
        from: {$ref: '#/components/schemas/SiteDiscoveryFrom'}
        includeUnclassified: {type: boolean, description: Enables credential-free SSH candidate discovery only}
        sshPorts: {type: array, maxItems: 4, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535}}
    SiteDiscoveryInput:
      type: object
      required: [enabled, ranges, from]
      description: The legacy cadence field defaults to 30 when omitted and is used by older Hubs.
      properties:
        enabled: {type: boolean}
        ranges: {type: array, minItems: 1, maxItems: 8, items: {type: string, format: cidr}}
        intervalSeconds: {type: integer, minimum: 10, maximum: 3600, description: Legacy cadence for older Hubs}
        from: {$ref: '#/components/schemas/SiteDiscoveryFrom'}
        includeUnclassified: {type: boolean, description: Enables credential-free SSH candidate discovery only}
        sshPorts: {type: array, maxItems: 4, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535}}
    SiteDiscoveryFrom:
      type: object
      required: [clusterID, nodeName]
      additionalProperties: false
      properties:
        clusterID: {type: string, minLength: 1, maxLength: 128}
        nodeName: {type: string, minLength: 1, maxLength: 253}
    RobotCamera:
      type: object
      properties:
        state: {type: string, enum: [ok, slow, stale, absent], description: 'slow: under 10 frames a second for 30 s; stale: no frame for 5 s; absent: none since the camera service started'}
        fps: {type: number, description: Frames a second over the last 5 s}
        age_seconds: {type: number, nullable: true, description: Seconds since the newest frame; null before the first}
        step: {type: integer, enum: [0, 1, 2, 3], description: 'Where its recovery is: 0 none, 1 driver restarts, 2 USB reset, 3 stuck (out of the ladder until it has sent for 5 minutes again or moved to another USB port; its driver restarted once an hour while the robot is not in use)'}
        attempts: {type: integer, description: Driver restarts done in this round of the recovery}
        next_attempt_at: {type: integer, nullable: true, description: When the recovery acts next (Unix seconds)}
        last_action: {type: string, nullable: true, enum: [driver_restart, usb_reset, stuck]}
        last_result: {type: string, nullable: true, description: 'Stuck: why (相机需要断电或 USB 复位; 疑似硬件 when it stalled again within 5 minutes of its USB reset; Orin 的 USB 上没有这路相机 when the reset found no device). At step 2: the USB reset''s result, or why it did not run'}
        diagnosis: {type: string, nullable: true, description: 'Stuck: what the Orin showed of it (on the USB or not and where, the vendor camera process, the Orbbec SDK colour and depth streams)'}
        usb:
          type: object
          nullable: true
          description: Where it is on the Orin's USB; null before the Orin is read or while it is not on the bus
          properties:
            path: {type: string, description: 'sysfs path, e.g. 2-3.3.3 (bus 2, root port 3, then hub ports)'}
            device: {type: integer}
            speed: {type: integer, description: Mbit/s}
            hubs: {type: array, items: {type: string}, description: 'vendor:product of each hub from the root port down'}
        usb_advice: {type: string, nullable: true, description: 'When its hub holds fewer cameras than another hub on its USB root port: move it to a root port of its own (advice, no state)'}
    RobotCameras:
      type: object
      properties:
        state: {type: string, enum: [ok, recovering, degraded, stuck], description: 'recovering: a camera has no frames; degraded: only slow cameras; stuck: 相机需要断电或 USB 复位'}
        cameras:
          type: object
          description: The views of the robot's body (s1u head, torso, wrist_left, wrist_right; s1u_observer head, torso)
          additionalProperties: {$ref: '#/components/schemas/RobotCamera'}
        updated_at: {type: number, description: Unix seconds}
        clock:
          type: object
          description: Optional live clock sample, omitted from the Node annotation
          required: [received_ms, sent_ms]
          properties:
            received_ms: {type: number, description: Request received in Unix milliseconds}
            sent_ms: {type: number, description: Response serialization started in Unix milliseconds}
    NodeClassPassword:
      type: object
      required: [secret, key, configured]
      properties:
        secret: {type: string, description: The job secret the class names}
        key: {type: string}
        configured: {type: boolean, description: Whether a value is there}
        set_by: {type: string}
        set_at: {type: string, format: date-time}
    NodeClassAccess:
      type: object
      required: [entry, node]
      properties:
        entry: {$ref: '#/components/schemas/NodeClassPassword'}
        node: {$ref: '#/components/schemas/NodeClassPassword'}
        sudo: {$ref: '#/components/schemas/NodeClassPassword'}
    NodeAdmission:
      type: object
      required: [cluster_id, node_name, state, expires_at]
      properties:
        cluster_id: {type: string}
        node_name: {type: string}
        state: {type: string, enum: [Pending, Redeemed, Joined, Expired], description: 'Pending: the code is open; Redeemed: a machine took it and is joining; Expired: also a code withdrawn before it was used'}
        reason: {type: string, description: "station-controller's reason, when it holds the node back; for a machine joined by SSH, where its installer stopped"}
        site: {type: string}
        address: {type: string, description: The pinned tunnel address}
        uplink: {type: string}
        labels: {type: object, additionalProperties: {type: string}}
        taints: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}
        issued_by: {type: string, description: The authenticated identity that gave out the current code}
        issued_at: {type: string, format: date-time}
        redeemed_at: {type: string, format: date-time}
        public_key: {type: string, description: The WireGuard public key of the machine that redeemed the code}
        tunnel_address: {type: string, description: The tunnel address station-controller gave the machine}
        ssh_login: {type: string, description: "user@host:port, for a machine joined by SSH from the console"}
        ssh_host_key: {type: string, description: The SHA256 fingerprint of the host key such a machine showed when it was logged in to}
    IssuedNodeAdmission:
      type: object
      required: [admission, code, command]
      properties:
        admission: {$ref: '#/components/schemas/NodeAdmission'}
        code: {type: string, description: The one-time code; answered here only}
        command: {type: string, description: The one line to run as root on the machine}
    ClusterNodeAgents:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean, description: Keep (true) or remove (false) the node Agent DaemonSet.}
        nodeSelector:
          type: object
          additionalProperties: {type: string}
          minProperties: 1
          description: Kubernetes Node labels that select the Nodes running a node Agent. Defaults to rlark.io/enabled=true.
    ClusterInfo:
      properties:
        id: {type: string, description: Stable Cluster resource name used in API paths and references.}
        name: {type: string, description: Trimmed spec.displayName or the Cluster resource name when unset.}
        displayName: {type: string, description: Trimmed spec.displayName; absent when unset.}
        nodeAgents:
          $ref: '#/components/schemas/ClusterNodeAgents'
        clusterType: {type: string, enum: [gpu, robot], description: "The Cluster's label rlark.io/cluster-type; absent when never set."}
    NodeSpec:
      properties:
        displayName:
          type: string
          maxLength: 64
          description: The operator's name; metadata.name stays the Kubernetes Node name. Set with PUT .../nodes/{name}/display-name.
