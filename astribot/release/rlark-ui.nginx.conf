map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 重定向只写路径：访问地址（IP、端口、反向代理）由浏览器自己补全。
    absolute_redirect off;

    client_max_body_size 500m;   # 对象存储：允许最大 500MB 的请求体

    # 压缩配置
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024; # 单位是字节，约为 1KB[reference:4]
    gzip_comp_level 6;
    # 启用 Vary: Accept-Encoding 响应头
    gzip_vary on;
    # （重要）配置对代理请求的压缩行为
    # 当 Nginx 作为反向代理时，此指令控制是否压缩后端返回的响应[reference:8]
    # 下面配置表示：仅当响应包含 no-cache/no-store/private/expired/auth 头时才压缩[reference:9]
    gzip_proxied no-cache no-store private expired auth;

    # 登录页：Astribot IAM 的人类入口（静态页，提交 /api/iam/login 后写 sessionStorage 并回跳 next）。
    location = /login {
        # 离开控制台时，即使 IAM 未确认撤销，浏览器也要结束本地会话；HTTPS 部署需加 Secure。
        add_header Set-Cookie "astribot_session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax" always;
        # 这条 Set-Cookie 只在页面真的从服务器取回时才生效：浏览器重放缓存里的副本不会处理它。
        add_header Cache-Control "no-store" always;
        try_files /login.html =404;
    }

    # 登录页自身的静态资源保持公开（不受下面的全站会话门控影响）。
    location ~ ^/(login-hero\.jpg|astribot-logo-light\.png|rlark-logo-(zh|en)-light\.(png|svg)|favicon[^/]*)$ {
        try_files $uri =404;
    }

    # 原生登录接口：凭据交换本身必须匿名可达（IAM 会话之外的第二道真实鉴权在网关）。
    location = /api/v1/auth/login {
        proxy_pass ${RLARK_GATEWAY_URL};
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # nginx 按归一化地址选 location，而 $request_uri 保留原始写法；由 location 选择页面或 API 授权入口。
    # 页面只验证会话，业务 API 另行按原始方法和路径判角色权限。
    location / {
        auth_request /_iam_page;
        error_page 401 = @iam_login;
        try_files $uri $uri/ /index.html;
    }

    # 控制台外壳每次都向服务器确认：换一版镜像后，浏览器里旧的外壳不会再去要已经不存在的脚本。
    location = /index.html {
        auth_request /_iam_page;
        error_page 401 = @iam_login;
        add_header Cache-Control "no-cache";
    }

    # 没有会话时的去向：/login?next=<原来的地址>。next 取浏览器发来的原始地址（已是编码形式），
    # 登录页原样读回；next 必须是查询串里最后一个参数（它后面的内容整个算作地址）。
    location @iam_login {
        return 302 /login?next=$request_uri;
    }

    # IAM 自己的接口：自带会话令牌（cookie + Bearer），不经 auth_request、不注入上游 token。
    location /api/iam/ {
        proxy_pass ${ASTRIBOT_IAM_URL};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Length $content_length;
    }

    # 业务接口：先由 IAM 判定（cookie/Bearer → 角色），通过后由 nginx 注入该角色的
    # 上游 service-account token；浏览器令牌在服务端被覆盖，不承担业务授权。
    location /api/ {
        auth_request /_iam_api;
        auth_request_set $iam_upstream $upstream_http_x_iam_upstream;
        auth_request_set $iam_submitter $upstream_http_x_rlark_submitter;
        proxy_pass ${RLARK_GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer $iam_upstream";
        proxy_set_header X-RLark-Submitter $iam_submitter;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Keep the public port in Host so Gorilla's same-origin WebSocket
        # check can match Origin when RLark is exposed on a non-default port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 页面和 API 分别走各自的内部入口；原始 URI 只供对应入口读取，不用于 nginx 的 location 分类。
    location = /_iam_page {
        internal;
        proxy_pass ${ASTRIBOT_IAM_URL}/internal/admit;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    location = /_iam_api {
        internal;
        proxy_pass ${ASTRIBOT_IAM_URL}/internal/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }
}
