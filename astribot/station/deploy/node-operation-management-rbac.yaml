# Apply only when the experimental node operation controller is explicitly enabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: station-node-operation-management
rules:
- apiGroups: ["station.rlark.io"]
  resources: ["nodeoperations"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["station.rlark.io"]
  resources: ["nodeoperations/status"]
  verbs: ["get", "patch"]
# A removal powers a robot off on its management plane's Node and deletes
# that Node once the member Node is gone.
- apiGroups: ["rlinf.io"]
  resources: ["nodes"]
  verbs: ["get", "patch", "delete"]
# A removed node's record (retired with station-controller's own patch) is deleted once the node is gone.
- apiGroups: ["station.rlark.io"]
  resources: ["networkenrollments"]
  verbs: ["delete"]
# With --installer-bundle: a Machine an administrator admitted gets its
# NodeAdmission and the NodeOperation that joins it; the join gives the
# admission its code and writes down the entry device's new host key.
- apiGroups: ["station.rlark.io"]
  resources: ["machines"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["station.rlark.io"]
  resources: ["machines/status"]
  verbs: ["get", "patch"]
- apiGroups: ["station.rlark.io"]
  resources: ["nodeoperations"]
  verbs: ["create", "delete"]
- apiGroups: ["station.rlark.io"]
  resources: ["nodeadmissions"]
  # delete: removing a name whose join never made a node clears its admission.
  verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: station-node-operation-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: station-node-operation-management
subjects:
- kind: ServiceAccount
  name: station-controller
  namespace: station-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: station-operation-member-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: station-node-operation-member-credentials
  namespace: station-operation-member-credentials
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: station-node-operation-member-credentials
  namespace: station-operation-member-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: station-node-operation-member-credentials
subjects:
- kind: ServiceAccount
  name: station-controller
  namespace: station-system
---
# The passwords of the NodeClasses (NodeClass, access.entry.password and
# access.node.password): values of secrets kept in RLark, whose declarations
# are Secrets of RLark's namespace of the management plane
# (--rlark-secrets-namespace). Read for every login and never written.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: station-node-class-accounts
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: station-node-class-accounts
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: station-node-class-accounts
subjects:
- kind: ServiceAccount
  name: station-controller
  namespace: station-system
