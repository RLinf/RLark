---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: machines.station.rlark.io
spec:
  group: station.rlark.io
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    singular: machine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeClass
      name: Class
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.problem
      name: Problem
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .status.entry.address
      name: Address
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Machine is a machine RLark knows of, a node or not: the list an
          administrator picks from to add nodes. A machine comes into it by being
          seen on its site's network (source Discovery) or by registering itself
          (source Registration). Its identity is its serial, which its class says
          where to read; the address it was seen at is an observation. Its name is its site and the hardware address of the
          device it was first seen through.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              admit:
                description: |-
                  Admit is the administrator's decision that the machine is to be a
                  node. Without it the machine is not joined.
                properties:
                  clusterID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      Labels replace the values of labels the machine's class declares, for
                      this machine: the body of a robot that is not the usual one.
                    maxProperties: 8
                    type: object
                  requestedAt:
                    description: |-
                      RequestedAt is when; asking again for a machine whose join stopped
                      is a new request, and starts a new join.
                    format: date-time
                    type: string
                  requestedBy:
                    description: RequestedBy is the authenticated identity at the
                      Gateway.
                    maxLength: 256
                    minLength: 1
                    type: string
                required:
                - clusterID
                - requestedAt
                - requestedBy
                type: object
              nodeClass:
                maxLength: 63
                minLength: 1
                type: string
              site:
                maxLength: 63
                minLength: 1
                type: string
              source:
                enum:
                - Discovery
                - Registration
                type: string
            required:
            - nodeClass
            - site
            - source
            type: object
          status:
            properties:
              clusterID:
                description: ClusterID and NodeName are the node the machine is or
                  is becoming.
                maxLength: 128
                type: string
              entry:
                description: Entry is the device the machine was last seen through.
                properties:
                  address:
                    maxLength: 15
                    type: string
                  hostKeyFingerprint:
                    maxLength: 50
                    type: string
                  lastSeen:
                    format: date-time
                    type: string
                  mac:
                    maxLength: 17
                    type: string
                  via:
                    description: |-
                      Via is the relay of the hub that saw the device, "tunnel-address:port":
                      where the management plane reaches Address from.
                    maxLength: 21
                    type: string
                type: object
              inspectedAt:
                description: |-
                  InspectedAt is when RLark last logged in to the machine to read what
                  it is. Station API clears it when the machine shows up changed.
                format: date-time
                type: string
              message:
                maxLength: 512
                type: string
              nodeHostKeyFingerprint:
                description: |-
                  NodeHostKeyFingerprint is the SSH host key of the computer behind the
                  entry device, as it was first read through the verified entry device.
                maxLength: 50
                type: string
              nodeName:
                maxLength: 253
                type: string
              operation:
                description: Operation is the NodeOperation that joins the machine.
                maxLength: 253
                type: string
              phase:
                enum:
                - Discovered
                - Admitted
                - Joined
                type: string
              problem:
                maxLength: 64
                type: string
              serial:
                description: Serial is the machine's serial, read on its entry device.
                maxLength: 128
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
