---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: networkenrollments.station.rlark.io
spec:
  group: station.rlark.io
  names:
    kind: NetworkEnrollment
    listKind: NetworkEnrollmentList
    plural: networkenrollments
    shortNames:
    - netenroll
    singular: networkenrollment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.site
      name: Site
      type: string
    - jsonPath: .status.role
      name: Role
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.node.state
      name: State
      type: string
    - jsonPath: .status.observation.reportedAt
      name: Reported
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetworkEnrollment is the record of one node: its identity, its latest
          report and its place in the SiteNetwork. Its name is the Node name in the
          namespace mapped to the cluster. station-api writes spec and
          status.observation; station-controller writes the rest of status, and
          spec.nodeUID, systemUUID and retired when the name passes to another Node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              addresses:
                description: |-
                  Addresses are the node's own addresses as it reported them, the first
                  being the source it uses towards station-api.
                items:
                  maxLength: 15
                  type: string
                maxItems: 8
                type: array
              clusterID:
                maxLength: 128
                minLength: 1
                type: string
              nodeUID:
                maxLength: 128
                minLength: 1
                type: string
              observedSource:
                description: |-
                  ObservedSource is the address station-api saw the request arrive from.
                  It differs from Addresses when the node is behind NAT.
                maxLength: 45
                type: string
              publicKey:
                description: |-
                  PublicKey is the node's WireGuard public key; the private key never
                  leaves the node. Empty for a node that is not in the tunnel.
                maxLength: 44
                type: string
              retired:
                description: |-
                  Retired marks the record of a node that was removed. It has no place
                  in the tunnel until a machine is admitted under the name again.
                type: boolean
              systemUUID:
                description: 'SystemUUID is evidence only: it tells a reinstalled
                  machine from another one.'
                maxLength: 128
                type: string
            required:
            - clusterID
            - nodeUID
            type: object
          status:
            properties:
              address:
                description: Address is the one address every other member reaches
                  this node at.
                type: string
              config:
                description: Config is the document station-gateway reconciles, for
                  PublicKey.
                maxLength: 262144
                type: string
              configHash:
                description: ConfigHash is the SHA-256 of Config in hex.
                type: string
              linkSummary:
                description: |-
                  LinkSummary is Links in one line a page shows as it is. It is empty
                  while every link is Connected.
                maxLength: 1024
                type: string
              links:
                description: |-
                  Links says, for a Leaf, what each Hub it dials sees of it. A Leaf that
                  has dropped off cannot report anything, so this is the Hubs' account.
                items:
                  properties:
                    hub:
                      description: Hub is the member the Leaf dials, "<clusterID>/<nodeName>".
                      maxLength: 256
                      minLength: 1
                      type: string
                    latestHandshake:
                      description: |-
                        LatestHandshake is the last handshake the Hub completed with the Leaf,
                        kept while the link is Unanswered or Silent. A Connected link has a new
                        one every two minutes, in the Hub's status.observation.
                      format: date-time
                      type: string
                    observedAt:
                      format: date-time
                      type: string
                    receivedBytes:
                      description: |-
                        ReceivedBytes is what the Hub had received from the Leaf at ObservedAt,
                        the Hub's report the next one is compared with: a counter that grows
                        without a handshake is Unanswered. Both are kept only while the
                        handshake is stale, and here so that they outlive the controller.
                      format: int64
                      minimum: 0
                      type: integer
                    since:
                      description: Since is when State last changed.
                      format: date-time
                      type: string
                    state:
                      enum:
                      - Connected
                      - Unanswered
                      - Silent
                      - Unknown
                      type: string
                  required:
                  - hub
                  - since
                  - state
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - hub
                x-kubernetes-list-type: map
              node:
                description: Node is the node reconciler's alone.
                properties:
                  bootTime:
                    description: BootTime is the node's latest reported boot time.
                    format: date-time
                    type: string
                  conditions:
                    items:
                      description: Condition contains details for one aspect of the
                        current state of this API Resource.
                      properties:
                        lastTransitionTime:
                          description: |-
                            lastTransitionTime is the last time the condition transitioned from one status to another.
                            This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                          format: date-time
                          type: string
                        message:
                          description: |-
                            message is a human readable message indicating details about the transition.
                            This may be an empty string.
                          maxLength: 32768
                          type: string
                        observedGeneration:
                          description: |-
                            observedGeneration represents the .metadata.generation that the condition was set based upon.
                            For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                            with respect to the current state of the instance.
                          format: int64
                          minimum: 0
                          type: integer
                        reason:
                          description: |-
                            reason contains a programmatic identifier indicating the reason for the condition's last transition.
                            Producers of specific condition types may define expected values and meanings for this field,
                            and whether the values are considered a guaranteed API.
                            The value should be a CamelCase string.
                            This field may not be empty.
                          maxLength: 1024
                          minLength: 1
                          pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                          type: string
                        status:
                          description: status of the condition, one of True, False,
                            Unknown.
                          enum:
                          - "True"
                          - "False"
                          - Unknown
                          type: string
                        type:
                          description: type of condition in CamelCase or in foo.example.com/CamelCase.
                          maxLength: 316
                          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                          type: string
                      required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - type
                    x-kubernetes-list-type: map
                  lastSeenTime:
                    format: date-time
                    type: string
                  reboots:
                    description: Reboots counts the boots seen since the record was
                      made or taken over by another Node.
                    format: int64
                    minimum: 0
                    type: integer
                  state:
                    enum:
                    - Bound
                    - Offline
                    - Conflict
                    - Retired
                    type: string
                type: object
              observation:
                description: 'Observation is station-api''s alone: it patches this
                  block and nothing else of status.'
                properties:
                  agent:
                    description: Agent is the station-agent that sent this report.
                    properties:
                      digest:
                        description: Digest is the sha256 of the program's file.
                        pattern: ^[0-9a-f]{64}$
                        type: string
                    required:
                    - digest
                    type: object
                  bootTime:
                    format: date-time
                    type: string
                  gateway:
                    description: |-
                      Gateway is the station-gateway of the node, as that program states it
                      with every good pass. A node without it runs a gateway that is not
                      reconciling.
                    properties:
                      digest:
                        description: Digest is the sha256 of the program's file.
                        pattern: ^[0-9a-f]{64}$
                        type: string
                      documentLevel:
                        description: |-
                          DocumentLevel is the newest configuration document the program
                          understands; it understands every one before it.
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - digest
                    - documentLevel
                    type: object
                  hardware:
                    properties:
                      architecture:
                        maxLength: 64
                        type: string
                      kernelVersion:
                        maxLength: 256
                        type: string
                      osImage:
                        maxLength: 256
                        type: string
                      productName:
                        maxLength: 256
                        type: string
                      systemVendor:
                        maxLength: 256
                        type: string
                    type: object
                  identity:
                    description: |-
                      Identity is derived by Station API from the Node it authenticated, not
                      accepted as an arbitrary client assertion.
                    properties:
                      category:
                        enum:
                        - Robot
                        - Server
                        type: string
                      model:
                        maxLength: 63
                        type: string
                      reportedAt:
                        description: ReportedAt is Station API receipt time.
                        format: date-time
                        type: string
                      source:
                        enum:
                        - node-labels
                        - node-info
                        type: string
                    required:
                    - reportedAt
                    type: object
                  nodeUID:
                    maxLength: 128
                    minLength: 1
                    type: string
                  pressures:
                    description: |-
                      Pressures are the DiskPressure, MemoryPressure and PIDPressure
                      conditions that are True on the member Node, read by station-api when
                      it verified the report. The list is written with every report, so an
                      empty one says the Node is under none and a missing one that the report
                      was stored by a station-api from before the field.
                    items:
                      enum:
                      - DiskPressure
                      - MemoryPressure
                      - PIDPressure
                      type: string
                    maxItems: 3
                    type: array
                    x-kubernetes-list-type: set
                  probes:
                    items:
                      properties:
                        ok:
                          type: boolean
                        rttMs:
                          format: int64
                          maximum: 600000
                          minimum: 0
                          type: integer
                        target:
                          description: Target is a configured probe label or host:port,
                            bounded by API policy.
                          maxLength: 256
                          minLength: 1
                          type: string
                        via:
                          description: Via identifies the observed route label.
                          maxLength: 256
                          type: string
                      required:
                      - ok
                      - target
                      type: object
                    maxItems: 256
                    type: array
                  reportedAt:
                    description: ReportedAt is server receipt time, never a client-provided
                      timestamp.
                    format: date-time
                    type: string
                  systemUUID:
                    description: SystemUUID is evidence only and must not be used
                      to authorize a binding.
                    type: string
                  wireguard:
                    properties:
                      addresses:
                        items:
                          maxLength: 64
                          type: string
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: set
                      interface:
                        description: Interface is the observed interface name, not
                          a desired configuration.
                        maxLength: 15
                        minLength: 1
                        type: string
                      peers:
                        description: |-
                          Peers are the node's WireGuard peers that are enrolled members, as the
                          node's kernel counts them. A Hub's entry for a Leaf is the only account
                          of a Leaf that has dropped off.
                        items:
                          properties:
                            latestHandshake:
                              format: date-time
                              type: string
                            name:
                              description: |-
                                Name is the peer's member id, "<clusterID>/<nodeName>". station-api
                                assigns it from the public key the node reported: it is that of the
                                Enrolled NetworkEnrollment with this key.
                              maxLength: 128
                              minLength: 1
                              type: string
                            receivedBytes:
                              format: int64
                              minimum: 0
                              type: integer
                            sentBytes:
                              format: int64
                              minimum: 0
                              type: integer
                          required:
                          - name
                          type: object
                        maxItems: 1024
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      publicKey:
                        description: PublicKey is the public key of the observed interface;
                          private keys are never reported.
                        maxLength: 64
                        type: string
                    required:
                    - interface
                    type: object
                required:
                - agent
                - nodeUID
                - reportedAt
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Enrolled
                - Rejected
                type: string
              problems:
                items:
                  type: string
                maxItems: 16
                type: array
              publicKey:
                description: PublicKey is the key Config was computed for.
                type: string
              reason:
                description: Reason explains Pending and Rejected in one line.
                maxLength: 512
                type: string
              relay:
                description: Relay is the hub that relays for this Leaf, "<clusterID>/<nodeName>".
                type: string
              role:
                type: string
              site:
                type: string
              tunnelAddress:
                description: TunnelAddress is the node's address inside the tunnel,
                  when it has one.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
