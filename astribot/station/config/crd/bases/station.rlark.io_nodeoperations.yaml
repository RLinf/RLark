---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: nodeoperations.station.rlark.io
spec:
  group: station.rlark.io
  names:
    kind: NodeOperation
    listKind: NodeOperationList
    plural: nodeoperations
    singular: nodeoperation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeOperation records a single node lifecycle operation: the join of a
          machine an administrator admitted, or the removal of a node. It holds no
          credential: a join logs in with the accounts of the machine's NodeClass, a
          removal logs in nowhere.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              action:
                enum:
                - Join
                - Remove
                type: string
              admission:
                description: |-
                  Admission names the NodeAdmission, in the operation's namespace, this
                  Join redeems: the machine is installed by the installer an operator's
                  typed command runs, and comes out the same node.
                maxLength: 253
                type: string
              clusterID:
                maxLength: 128
                minLength: 1
                type: string
              nodeClass:
                description: NodeClass names the NodeClass whose standing accounts
                  a Join logs in with.
                maxLength: 63
                type: string
              nodeName:
                maxLength: 253
                minLength: 1
                type: string
              nodeUID:
                description: |-
                  NodeUID is the Node instance a removal is of. A removal without it is
                  of whatever is under the name: the Node its cluster has when the
                  removal starts (status.nodeUID), or, when its cluster has none, what
                  RLark keeps of the name (a join that never finished, a node reset by
                  hand).
                maxLength: 128
                type: string
              requestID:
                maxLength: 128
                minLength: 1
                type: string
              requestedBy:
                maxLength: 256
                minLength: 1
                type: string
              ssh:
                properties:
                  address:
                    maxLength: 253
                    minLength: 1
                    type: string
                  hostKeyFingerprint:
                    description: HostKeyFingerprint is the administrator-confirmed
                      SHA256 fingerprint.
                    pattern: ^SHA256:[A-Za-z0-9+/]{43}$
                    type: string
                  jump:
                    description: |-
                      Jump is dialed first, and Address through it: the device a machine
                      stands behind. Nothing is sent to either to authenticate with
                      before it has shown its key.
                    properties:
                      address:
                        maxLength: 253
                        minLength: 1
                        type: string
                      hostKeyFingerprint:
                        pattern: ^SHA256:[A-Za-z0-9+/]{43}$
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      user:
                        maxLength: 128
                        minLength: 1
                        type: string
                      via:
                        description: |-
                          Via is the relay of the hub of the site Address is in, as
                          "tunnel-address:port": Address is an address of that site's own
                          network, which the management plane reaches through its hub.
                        maxLength: 21
                        type: string
                    required:
                    - address
                    - hostKeyFingerprint
                    - port
                    - user
                    type: object
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  user:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - address
                - hostKeyFingerprint
                - port
                - user
                type: object
            required:
            - action
            - clusterID
            - nodeName
            - requestID
            - requestedBy
            type: object
            x-kubernetes-validations:
            - message: operation spec is immutable
              rule: self == oldSelf
            - message: a join redeems an admission and logs in with the accounts of
                a node class
              rule: self.action != 'Join' || (has(self.ssh) && has(self.nodeClass)
                && has(self.admission))
            - message: 'a removal logs in nowhere: the node is reset from inside its
                cluster'
              rule: self.action != 'Remove' || (!has(self.ssh) && !has(self.nodeClass)
                && !has(self.admission))
          status:
            properties:
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodeUID:
                description: NodeUID identifies the actual member Node instance established
                  by a join.
                maxLength: 128
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Running
                - Blocked
                - Succeeded
                - Failed
                type: string
              stage:
                description: Stage names the last verified step, not an instruction
                  to replay an effect.
                maxLength: 128
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
