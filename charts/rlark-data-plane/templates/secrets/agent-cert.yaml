{{- if not (and .Values.certs.caCert .Values.certs.agentCert .Values.certs.agentKey) }}
{{- fail "certs.caCert, certs.agentCert, and certs.agentKey are all required" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: rlark-agent-cert
  namespace: {{ .Release.Namespace }}
  labels:
    app: rlark-agent
type: Opaque
data:
  ca.crt: {{ .Values.certs.caCert | b64enc | quote }}
  tls.crt: {{ .Values.certs.agentCert | b64enc | quote }}
  tls.key: {{ .Values.certs.agentKey | b64enc | quote }}
