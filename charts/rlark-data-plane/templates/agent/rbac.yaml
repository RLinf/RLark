apiVersion: v1
kind: ServiceAccount
metadata:
  name: rlark-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: rlark-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rlark-agent
  labels:
    app: rlark-agent
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rlark-agent
  labels:
    app: rlark-agent
subjects:
  - kind: ServiceAccount
    name: rlark-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: rlark-agent
  apiGroup: rbac.authorization.k8s.io
