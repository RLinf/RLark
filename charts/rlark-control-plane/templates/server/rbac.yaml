{{- if eq .Values.managementApi "kubernetes" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rlark-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: rlark-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rlark-server
  labels:
    app: rlark-server
rules:
  {{- include "rlark-control-plane.managementRBACRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rlark-server
  labels:
    app: rlark-server
subjects:
  - kind: ServiceAccount
    name: rlark-server
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: rlark-server
  apiGroup: rbac.authorization.k8s.io
{{- end }}
