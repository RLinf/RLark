apiVersion: v1
kind: Service
metadata:
  name: rlark-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: rlark-server
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"
spec:
  selector:
    app: rlark-server
  ports:
    - name: client
      port: 8443
      targetPort: 8443
    - name: ssh
      port: 2222
      targetPort: 2222
    - name: metrics
      port: 8888
      targetPort: 8888
