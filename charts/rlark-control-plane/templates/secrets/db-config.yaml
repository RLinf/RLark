{{- if .Values.db }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: rlark-db-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: rlark-db-config
data:
  db.yaml: |
    host: {{ .Values.db.host | quote }}
    port: {{ .Values.db.port }}
    database: {{ .Values.db.database | quote }}
    user: {{ .Values.db.user | quote }}
    password: {{ .Values.db.password | quote }}
{{- end }}
