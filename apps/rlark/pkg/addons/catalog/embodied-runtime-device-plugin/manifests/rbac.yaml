apiVersion: v1
kind: ServiceAccount
metadata:
  name: embodied-runtime-device-plugin
  namespace: rlark-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: embodied-runtime-device-plugin
  namespace: rlark-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: embodied-runtime-device-plugin
  namespace: rlark-system
subjects:
  - kind: ServiceAccount
    name: embodied-runtime-device-plugin
    namespace: rlark-system
roleRef:
  kind: Role
  name: embodied-runtime-device-plugin
  apiGroup: rbac.authorization.k8s.io