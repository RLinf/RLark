name: csi-driver-rclone
displayName: RClone CSI 驱动
category: storage
version: v0.2.0
description: |
  RClone CSI 驱动，支持通过 RClone 挂载远程存储（S3、GCS、Azure Blob 等）到 Pod。
  包含 controller 与 node DaemonSet，提供动态 PV 配置能力。
icon: hard-drive

parameters:
  - name: rcloneImage
    displayName: RClone 驱动镜像
    description: CSI RClone 驱动容器镜像地址
    type: string
    default: rlinf/csi-rclone/csi-driver-rclone:v0.2.0
    required: true

  - name: csiProvisionerImage
    displayName: CSI Provisioner 镜像
    description: csi-provisioner 容器镜像地址
    type: string
    default: rlinf/csi-rclone/csi-provisioner:v6.2.0
    required: true

  - name: livenessProbeImage
    displayName: Liveness Probe 镜像
    description: livenessprobe 容器镜像地址
    type: string
    default: rlinf/csi-rclone/livenessprobe:v2.18.0
    required: true

  - name: nodeDriverRegistrarImage
    displayName: Node Driver Registrar 镜像
    description: csi-node-driver-registrar 容器镜像地址
    type: string
    default: rlinf/csi-rclone/csi-node-driver-registrar:v2.16.0
    required: true

  - name: driverName
    displayName: CSI 驱动名称
    description: CSI 驱动注册名称
    type: string
    default: rclone.csi.veloxpack.io
    required: true

  - name: controllerReplicas
    displayName: Controller 副本数
    description: Controller Deployment 副本数量
    type: int
    default: "1"
    required: true

  - name: controllerLogLevel
    displayName: Controller 日志级别
    description: Controller 日志级别 (0-10)
    type: string
    default: "5"
    required: true

  - name: nodeLogLevel
    displayName: Node 日志级别
    description: Node DaemonSet 日志级别 (0-10)
    type: string
    default: "5"
    required: true