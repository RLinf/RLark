# The S1U robot x86's model configuration (extensions/s1u): the node tuner, the Orin, the power, the video, the clock,
# the robot's device layer and its Station, one Pod on every S1U robot. Privileged in the host's PID namespace (tuner,
# clock): it writes the host's /etc, /boot/grub and sysfs.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: s1u-robot
  namespace: rlark-system
  labels:
    app.kubernetes.io/name: s1u-robot
  # How a new version reaches the robots is RLark's own rollout of what it places (the cluster agent's): one robot
  # first, then a tenth of the Ready robots at a time, and only robots nobody uses (the Node's rlark.io/in-use: a
  # Station that serves a Run, a session on the device layer). A robot that is away has no place in it and gets the
  # version when it is back (11-14: s1u_02 cut off kept the old version from s1u_01 under Kubernetes' own rollout).
  # Replacing the Pod changes nothing of the robot's power: its desired state is on its Node and on the host.
  annotations:
    rlark.io/rollout: '{"whenIdle":true}'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: s1u-robot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s1u-robot
    spec:
      nodeSelector:
        {{ index (splitList "=" .Values.nodeSelector) 0 }}: "{{ index (splitList "=" .Values.nodeSelector) 1 }}"
      # The robot's own layer stays through what keeps other Pods off a node: its category's taints, a cordon, the
      # node's pressure, a node not ready or cut off from the API server. Not out-of-service: a robot declared gone is
      # gone.
      tolerations:
        - {key: rlark.io/node-category, operator: Exists}
        - {key: node-role.kubernetes.io/control-plane, operator: Exists}
        - {key: node.kubernetes.io/unschedulable, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/disk-pressure, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/memory-pressure, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/pid-pressure, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute}
      priorityClassName: system-node-critical
      serviceAccountName: s1u-robot
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      hostPID: true
      hostNetwork: true
      # The Station's Run gets its time to leave: its Ray node and launcher 15 s each, then what is left of them.
      terminationGracePeriodSeconds: 60
      {{- if or .Values.orinPayloads .Values.deviceImage }}
      initContainers:
        {{- if .Values.deviceImage }}
        # The device layer's data directory is root's, all of it, and open to read, whoever made it: kubelet makes
        # it so, one that was on the robot before this Addon may be anybody's with what is in it (a robot set up by
        # hand; s1u-01: its run, captures and cache directories were the vendor account's, and the device layer
        # could not write its socket's directory). The device layer runs as root without DAC_OVERRIDE and writes
        # there only as the owner. What is root's and the owner's to write already is not touched; other
        # filesystems mounted below are not entered.
        - name: device-data
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              find /device-data -xdev ! \( -user 0 -group 0 \) -exec chown -h 0:0 {} +
              find /device-data -xdev -type d ! -perm -u+rwx -exec chmod u+rwx {} +
              find /device-data -xdev -type f ! -perm -u+rw -exec chmod u+rw {} +
              chmod 0755 /device-data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: device-data, mountPath: /device-data}
        {{- end }}
        {{- if .Values.orinPayloads }}
        # Each payload's /payload into this Pod, for the orin container to place on the Orin.
        {{- range $i, $payload := splitList "," .Values.orinPayloads }}
        - name: payload-{{ $i }}
          image: {{ index (splitList "=" $payload) 1 }}
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec, 'rm -rf /payloads/{{ index (splitList "=" $payload) 0 }} && mkdir -p /payloads/{{ index (splitList "=" $payload) 0 }} && cp -a /payload/. /payloads/{{ index (splitList "=" $payload) 0 }}/']
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: payloads, mountPath: /payloads}
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: tuner
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          workingDir: /s1u/tuner
          command: [/usr/bin/python3, /s1u/tuner/node_tuner.py]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: S1U_IMAGE, value: "{{ .Values.image }}"}
            - {name: S1U_NODE_WANTED, value: "{{ .Values.profile }}"}
            - {name: S1U_NODE_REBOOT, value: "{{ .Values.reboot }}"}
            - {name: S1U_SITE_TIME_SOURCE, value: "{{ .Values.timeSource }}"}
            - {name: S1U_NODE_ROLLOUT, value: "{{ .Values.rollout }}"}
            - {name: S1U_NODE_ROLLOUT_SECONDS, value: "{{ .Values.rolloutSeconds }}"}
            - {name: S1U_NODE_ROLLOUT_PARALLEL, value: "{{ .Values.rolloutParallel }}"}
            - {name: S1U_NODE_POWER_OFF, value: "{{ .Values.powerOff }}"}
          securityContext:
            privileged: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: host, mountPath: /host}
        # The robot's Orin (orin/orin.py) over the robot's internal network. Its login is mounted in memory, never on
        # disk; it has no capability and writes only to directories of root's.
        - name: orin
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/python3, /s1u/orin/orin.py]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: S1U_NODE_PROFILE, value: /s1u/tuner/node_profile.env}
            - {name: S1U_NODE_WANTED, value: "{{ .Values.profile }}"}
            - {name: S1U_ORIN_RETIRED_UNITS, value: "{{ .Values.orinRetiredUnits }}"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: orin-access, mountPath: /orin-access, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
            - {name: host, mountPath: /host}
            - {name: state, mountPath: /state}
            - {name: in-use, mountPath: /in-use, readOnly: true}
            - {name: payloads, mountPath: /payloads, readOnly: true}
        # The robot's power, driver start and restart (device/power.py): the vendor's buttons through its ROS master,
        # on a Unix socket only, which RLark reaches on the node. No capability: ROS over the host's network.
        - name: power
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -c, "source /opt/ros/noetic/setup.bash && exec python3 /s1u/device/power.py"]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: S1U_NODE_PROFILE, value: /s1u/tuner/node_profile.env}
            - {name: S1U_SERVICE_SOCKET, value: /services/s1u-power.sock}
            # The robot's desired state as last read from its Node, for while the API server is away.
            - {name: S1U_POWER_STATE, value: /state/power.json}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: services, mountPath: /services}
            - {name: in-use, mountPath: /in-use, readOnly: true}
            # The node tuner's maintenance lease (/run/rlark/s1u/maintenance), and the Run that holds the robot, which
            # this container writes (/run/rlark/s1u/claim).
            - {name: host, mountPath: /host}
            - {name: state, mountPath: /state}
        # The robot's camera video (device/video_server.py): the body's cameras from the vendor's ROS topics to MediaMTX
        # (WebRTC :18889, a viewing session's token checked on a loopback port), the camera wall's strip from the device
        # layer's thumbnails (/run/rlark/s1u/preview.bin); its control a Unix socket only, which RLark reaches on the node.
        - name: video
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -c, "source /opt/ros/noetic/setup.bash && exec python3 /s1u/device/video_server.py"]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: S1U_NODE_ADDRESS
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - {name: S1U_NODE_PROFILE, value: /s1u/tuner/node_profile.env}
            - {name: S1U_BODIES, value: /s1u/tuner/bodies.json}
            - {name: S1U_SERVICE_SOCKET, value: /services/s1u-video.sock}
            - {name: S1U_VIDEO_DIRECTORY, value: /video}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {cpu: "2", memory: 512Mi}
          volumeMounts:
            - {name: services, mountPath: /services}
            - {name: host, mountPath: /host, readOnly: true}
            - {name: video, mountPath: /video}
        # The robot's clock held to the site's time (clock/clock.py): it trims the frequency of the NIC hardware clock
        # at the root of the vendor's own time chain. Privileged for that clock's device (/dev/ptpN).
        - name: clock
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/python3, /s1u/clock/clock.py]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: S1U_NODE_PROFILE, value: /s1u/tuner/node_profile.env}
            - {name: S1U_NODE_WANTED, value: "{{ .Values.profile }}"}
            - {name: S1U_SITE_TIME_SOURCE, value: "{{ .Values.timeSource }}"}
          securityContext:
            privileged: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: host, mountPath: /host}
        {{- if .Values.deviceImage }}
        # The robot's device layer (the Addon's deviceImage, whose /device/start it runs): the program that holds the
        # robot's SDK connection for the sessions of the site's application, which attach to it on the host
        # (/run/fleet). It starts once the tuner has written which robot this x86 is (/run/rlark/s1u/robot.json, the
        # Node's labels rlark.io/robot-id and rlark.io/robot-body), reads the node profile and the bodies' cameras
        # read-only, powers an unpowered robot for a session through the power service's socket (and never off),
        # marks the robot in use, asks for a camera's USB reset and leaves the robot's self-check under
        # /run/rlark/s1u. Its command thread runs alone at SCHED_FIFO on the profile's SDK core
        # (SYS_NICE for that, and nothing else); its other threads keep to the device layer's CPUs by themselves.
        - name: device
          image: {{ .Values.deviceImage }}
          imagePullPolicy: IfNotPresent
          command: [/device/start]
          # Ready once its control endpoint answers: from its start on, whether or not the robot is powered.
          readinessProbe:
            tcpSocket: {port: 33334}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [SYS_NICE]
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "8", memory: 2Gi}
          volumeMounts:
            - {name: device-data, mountPath: /var/lib/fleet}
            - {name: device-run, mountPath: /run/fleet}
            - {name: device-token, mountPath: /site-token, readOnly: true}
            - {name: device-shm, mountPath: /dev/shm}
            - {name: profile, mountPath: /etc/rlark/s1u, readOnly: true}
            - {name: host, mountPath: /run/rlark/s1u}
            - {name: services, mountPath: /run/rlark/services}
            - {name: in-use, mountPath: /run/rlark/in-use}
        # The device layer's own camera service for the application's pages (/device/start --video), which reads the
        # device layer's frames from the shared memory the two have in common. It goes once the application's pages
        # reach this Addon's video through RLark.
        - name: device-video
          image: {{ .Values.deviceImage }}
          imagePullPolicy: IfNotPresent
          command: [/device/start, --video]
          env:
            # Where a viewer's media reaches this robot: its node's address (the site tunnel's).
            - name: S1U_NODE_ADDRESS
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - {name: S1U_DEVICE_ORIGINS, value: "{{ .Values.deviceOrigins }}"}
          readinessProbe:
            tcpSocket: {port: 8890}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 512Mi}
          volumeMounts:
            - {name: device-data, mountPath: /var/lib/fleet}
            - {name: device-token, mountPath: /site-token, readOnly: true}
            - {name: device-shm, mountPath: /dev/shm}
            - {name: profile, mountPath: /etc/rlark/s1u, readOnly: true}
            - {name: host, mountPath: /run/rlark/s1u, readOnly: true}
        # The robot's standing Station (/device/start --station, the device layer's image: the two change together):
        # while a Run holds the robot (the claim the power container keeps in /run/rlark/s1u/claim) it asks the site's
        # application at stationControlURL, with the site token, how to join that Run, and runs a Ray node and the
        # Run's env worker, which attaches to the device layer (/run/fleet); it marks the robot in use meanwhile. Its
        # own memory limit, so that an env worker that runs away ends this container alone: this Pod's limits together
        # stay within what the node profile leaves the Pods (S1U_KUBERNETES_MEMORY_MIB, kubepods.slice's memory.max),
        # else the kernel ends an arbitrary one of its node-critical containers first; its own /dev/shm for Ray's
        # object store (256 MiB, counted in this container's memory).
        - name: station
          image: {{ .Values.deviceImage }}
          imagePullPolicy: IfNotPresent
          command: [/device/start, --station]
          env:
            - {name: STATION_CONTROL_URL, value: "{{ .Values.stationControlURL }}"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {memory: 2Gi}
            limits: {memory: 2304Mi}
          volumeMounts:
            - {name: device-data, mountPath: /var/lib/fleet}
            - {name: device-run, mountPath: /run/fleet}
            - {name: device-token, mountPath: /site-token, readOnly: true}
            - {name: station-shm, mountPath: /dev/shm}
            - {name: profile, mountPath: /etc/rlark/s1u, readOnly: true}
            - {name: host, mountPath: /run/rlark/s1u, readOnly: true}
            - {name: in-use, mountPath: /run/rlark/in-use}
        {{- end }}
      volumes:
        - name: orin-access
          secret:
            secretName: {{ .Values.orinAccessSecret }}
            defaultMode: 0400
            # The node profile does not wait for the Orin's login to exist.
            optional: true
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        - name: payloads
          emptyDir: {sizeLimit: 256Mi}
        - name: video
          emptyDir: {sizeLimit: 64Mi}
        - name: host
          hostPath: {path: /run/rlark/s1u, type: DirectoryOrCreate}
        # What must outlast a boot and is root's (the Orin's record).
        - name: state
          hostPath: {path: /var/lib/rlark/s1u, type: DirectoryOrCreate}
        # The node-local services RLark reaches on this node (their Unix sockets).
        - name: services
          hostPath: {path: /run/rlark/services, type: DirectoryOrCreate}
        # What each component that uses the robot marks (a session attached to the device layer, a Station with a Run).
        - name: in-use
          hostPath: {path: /run/rlark/in-use, type: DirectoryOrCreate}
        {{- if .Values.deviceImage }}
        # The node profile and the bodies as the tuner installs them on the host. Created empty on a robot that just
        # joined: the device layer waits for the tuner.
        - name: profile
          hostPath: {path: /etc/rlark/s1u, type: DirectoryOrCreate}
        # The device layer's data on the host (what its sessions record before it is uploaded) and its run directory,
        # where the application's Station on the same robot finds its socket.
        - name: device-data
          hostPath: {path: {{ .Values.deviceData }}, type: DirectoryOrCreate}
        - name: device-run
          hostPath: {path: {{ .Values.deviceData }}/run, type: DirectoryOrCreate}
        - name: device-token
          secret:
            secretName: {{ .Values.deviceTokenSecret }}
            defaultMode: 0400
        - name: device-shm
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
        - name: station-shm
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
        {{- end }}
