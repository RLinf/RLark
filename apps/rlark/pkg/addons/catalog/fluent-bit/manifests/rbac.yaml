apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: fluent-bit
    {{- range $k, $v := .AddonLabels }}
    {{ $k }}: "{{ $v }}"
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
  labels:
    app.kubernetes.io/name: fluent-bit
    {{- range $k, $v := .AddonLabels }}
    {{ $k }}: "{{ $v }}"
    {{- end }}
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
  labels:
    app.kubernetes.io/name: fluent-bit
    {{- range $k, $v := .AddonLabels }}
    {{ $k }}: "{{ $v }}"
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: {{ .Namespace }}