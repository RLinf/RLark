components:
  parameters:
    name:
      name: name
      in: path
      required: true
      description: Name of the resource
      schema:
        type: string

    namespace:
      name: namespace
      in: query
      description: Namespace of the resource (required for namespaced resources)
      schema:
        type: string

    pretty:
      name: pretty
      in: query
      description: If 'true', then the output is pretty printed.
      schema:
        type: string

    continue:
      name: continue
      in: query
      description: The continue option should be set when retrieving more results from the server.
      schema:
        type: string

    limit:
      name: limit
      in: query
      description: Limit is a maximum number of responses to return for a list call.
      schema:
        type: integer
        format: int32

    fieldSelector:
      name: fieldSelector
      in: query
      description: A selector to restrict the list of returned objects by their fields.
      schema:
        type: string

    labelSelector:
      name: labelSelector
      in: query
      description: A selector to restrict the list of returned objects by their labels.
      schema:
        type: string

    dryRun:
      name: dryRun
      in: query
      description: When present, indicates that modifications should not be persisted.
      schema:
        type: string
        enum:
          - All

    fieldManager:
      name: fieldManager
      in: query
      description: fieldManager is a name associated with the actor or entity that is making these changes.
      schema:
        type: string

    fieldValidation:
      name: fieldValidation
      in: query
      description: fieldValidation instructs the server on how to handle objects in the request that contain unknown or duplicate fields.
      schema:
        type: string
        enum:
          - Ignore
          - Warn
          - Strict

    force:
      name: force
      in: query
      description: Force is going to force the apply requests through.
      schema:
        type: boolean

  schemas:
    # ─── Common Kubernetes Schemas ──────────────────────────────────
    ObjectMeta:
      type: object
      properties:
        name:
          type: string
          description: Name of the resource.
        generateName:
          type: string
          description: GenerateName is an optional prefix used to generate a unique name.
        namespace:
          type: string
          description: Namespace of the resource.
        selfLink:
          type: string
        uid:
          type: string
          description: UID is the unique in time and space value for this object.
        resourceVersion:
          type: string
          description: An opaque value that represents the internal version of this object.
        generation:
          type: integer
          format: int64
          description: A sequence number representing a specific generation of the desired state.
        creationTimestamp:
          type: string
          format: date-time
          description: CreationTimestamp is a timestamp representing the server time when this object was created.
        deletionTimestamp:
          type: string
          format: date-time
        deletionGracePeriodSeconds:
          type: integer
          format: int64
        labels:
          type: object
          additionalProperties:
            type: string
          description: Map of string keys and values that can be used to organize and categorize objects.
        annotations:
          type: object
          additionalProperties:
            type: string
          description: Annotations is an unstructured key value map stored with a resource.
        ownerReferences:
          type: array
          items:
            $ref: '#/components/schemas/OwnerReference'
        finalizers:
          type: array
          items:
            type: string
        managedFields:
          type: array
          items:
            type: object

    OwnerReference:
      type: object
      required:
        - apiVersion
        - kind
        - name
        - uid
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        name:
          type: string
        uid:
          type: string
        controller:
          type: boolean
        blockOwnerDeletion:
          type: boolean

    TypeMeta:
      type: object
      properties:
        apiVersion:
          type: string
          description: APIVersion defines the versioned schema of this representation of an object.
        kind:
          type: string
          description: Kind is a string value representing the REST resource this object represents.

    ListMeta:
      type: object
      properties:
        selfLink:
          type: string
        resourceVersion:
          type: string
        continue:
          type: string
          description: continue may be set if the resource set ran out of items.
        remainingItemCount:
          type: integer
          format: int64

    Condition:
      type: object
      description: Condition contains details for one aspect of the current state of this API Resource.
      required:
        - lastTransitionTime
        - message
        - reason
        - status
        - type
      properties:
        lastTransitionTime:
          type: string
          format: date-time
          description: The last time the condition transitioned from one status to another.
        message:
          type: string
          description: A human readable message indicating details about the transition.
        observedGeneration:
          type: integer
          format: int64
          description: The .metadata.generation that the condition was set based upon.
        reason:
          type: string
          description: A programmatic identifier indicating the reason for the condition's last transition.
        status:
          type: string
          enum:
            - "True"
            - "False"
            - Unknown
          description: Status of the condition, one of True, False, Unknown.
        type:
          type: string
          description: Type of condition in CamelCase or in foo.example.com/CamelCase.

    Status:
      type: object
      description: Status is a return value for calls that don't return other objects.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/ListMeta'
        status:
          type: string
        message:
          type: string
        reason:
          type: string
        details:
          type: object
          properties:
            name:
              type: string
            group:
              type: string
            kind:
              type: string
            uid:
              type: string
            causes:
              type: array
              items:
                type: object
                properties:
                  reason:
                    type: string
                  message:
                    type: string
                  field:
                    type: string
            retryAfterSeconds:
              type: integer
              format: int32
        code:
          type: integer
          format: int32

    ResourceList:
      type: object
      description: ResourceList is a set of (resource name, quantity) pairs.
      additionalProperties:
        type: string

    JSONPatch:
      type: array
      description: A JSON Patch document as defined by RFC 6902.
      items:
        type: object
        required:
          - op
          - path
        properties:
          op:
            type: string
            enum:
              - add
              - remove
              - replace
              - move
              - copy
              - test
          path:
            type: string
          from:
            type: string
          value: {}

    # ─── Job Schemas ────────────────────────────────────────────────
    Job:
      type: object
      required:
        - apiVersion
        - kind
      properties:
        apiVersion:
          type: string
          enum:
