  # ─── Task Named ──────────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/tasks/{name}:
    get:
      tags: [Task]
      summary: Get a Task
      description: Get a Task resource.
      operationId: readTask
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
      responses:
