openapi: 3.0.3
info:
  title: RLark Gateway CRD API Subset
  description: >-
    A maintained subset of routes registered by the RLark Gateway, focused on CRD operations and selected supporting endpoints; this is not a complete Gateway specification. The Gateway login endpoint
    does not issue a token or establish a session, and these routes currently
    do not enforce the UI login result. Deploy the Gateway only on a trusted
    network or behind an authenticated access-control layer. Domain resources
    group virtual addresses and scope cross-cluster forwarding; they do not
    isolate underlying infrastructure or ordinary Kubernetes networking. The
    registered Gateway certificate-revocation route is not implemented and is
    intentionally omitted from this specification.
  version: v1alpha1

servers:
  - url: http://localhost:8080
    description: Standalone Gateway default

externalDocs:
  description: API Reference and usage examples
  url: ./reference/

tags:
  - name: Job
    description: Cluster-scoped Job resources
  - name: Node
    description: Namespaced Node resources
  - name: Task
    description: Namespaced Task resources
  - name: Image
    description: Images referenced by Jobs and Tasks
  - name: Observability
    description: Gateway Prometheus metrics

paths:
  /api/v1/images:
    get:
      tags: [Image]
      summary: List used images
      description: Returns images referenced by current Jobs and Tasks, with usage counts and last-used timestamps.
      operationId: listImages
      responses:
        '200':
          description: Image usage records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUsageList'

  /metrics:
    get:
      tags: [Observability]
      summary: Get Gateway metrics
      description: Returns Gateway metrics in the Prometheus text exposition format.
      operationId: readGatewayMetrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  # ─── Job Collection ───────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/jobs:
    get:
      tags: [Job]
      summary: List jobs
      description: List jobs resources.
      operationId: listJob
      parameters:
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/continue'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/fieldSelector'
        - $ref: '#/components/parameters/labelSelector'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'

    post:
      tags: [Job]
      summary: Create a Job
      description: Create a Job resource.
      operationId: createJob
      parameters:
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/fieldManager'
        - $ref: '#/components/parameters/fieldValidation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'

  # ─── Job Named ────────────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/jobs/{name}:
    get:
      tags: [Job]
      summary: Get a Job
      description: Get a Job resource.
      operationId: readJob
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Not Found

    put:
      tags: [Job]
      summary: Replace a Job
      description: Replace a Job resource.
      operationId: replaceJob
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/fieldManager'
        - $ref: '#/components/parameters/fieldValidation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Not Found

    patch:
      tags: [Job]
      summary: Patch a Job
      description: Patch a Job resource.
      operationId: patchJob
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/fieldManager'
        - $ref: '#/components/parameters/fieldValidation'
        - $ref: '#/components/parameters/force'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/strategic-merge-patch+json:
            schema:
              $ref: '#/components/schemas/Job'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Job'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Not Found

    delete:
      tags: [Job]
      summary: Delete a Job
      description: Delete a Job resource.
      operationId: deleteJob
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Not Found

  # ─── Job Logs ────────────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/jobs/{name}/logs:
    get:
      tags: [Job]
      summary: Get Job logs
      description: >-
        Queries the configured backend when from is supplied. If no backend is
        configured, no from value is supplied, or the backend query fails, the
        handler falls back to current Pod logs.
      operationId: readJobLogs
      parameters:
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/logFrom'
        - $ref: '#/components/parameters/logTo'
        - $ref: '#/components/parameters/logTask'
        - $ref: '#/components/parameters/logPod'
        - name: query
          in: query
          description: Raw backend-specific log query.
          schema: {type: string}
        - name: cursor
          in: query
          description: Backend pagination cursor returned as nextCursor.
          schema: {type: string}
        - name: order
          in: query
          description: Use asc for ascending backend results; all other values are descending.
          schema: {type: string, default: desc}
      responses:
        '200':
          description: Backend log entries or Pod-log fallback
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BackendLogResponse'
                  - $ref: '#/components/schemas/PodLogResponse'
        '500':
          description: Failed to list Tasks for the Pod fallback

  /api/v1/rlinf.io/v1alpha1/jobs/{name}/logs/label-values:
    get:
      tags: [Job]
      summary: List Job log label values
      description: Returns unique values for a backend log label; label defaults to pod. Returns an empty values array when no backend is configured.
      operationId: listJobLogLabelValues
      parameters:
        - $ref: '#/components/parameters/name'
        - name: label
          in: query
          schema: {type: string, default: pod}
        - $ref: '#/components/parameters/logFrom'
        - $ref: '#/components/parameters/logTo'
        - $ref: '#/components/parameters/logTask'
        - $ref: '#/components/parameters/logPod'
      responses:
        '200':
          description: Unique label values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLabelValuesResponse'
        '500':
          description: Log backend query failed

  # ─── Job Metrics (not yet implemented) ───────────────────────────
  /api/v1/rlinf.io/v1alpha1/jobs/{name}/metrics:
    get:
      tags: [Job]
      summary: Get Job metrics
      description: This registered route is not implemented and always returns HTTP 501.
      operationId: readJobMetrics
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '501':
          description: Not Implemented

  # ─── Node Collection ─────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/nodes:
    get:
      tags: [Node]
      summary: List nodes
      description: List nodes resources.
      operationId: listNode
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/continue'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/fieldSelector'
        - $ref: '#/components/parameters/labelSelector'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'

    post:
      tags: [Node]
      summary: Create a Node
      description: Create a Node resource.
      operationId: createNode
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/dryRun'
        - $ref: '#/components/parameters/fieldManager'
        - $ref: '#/components/parameters/fieldValidation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'

  # ─── Node Named ──────────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/nodes/{name}:
    get:
      tags: [Node]
      summary: Get a Node
      description: Get a Node resource.
      operationId: readNode
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          description: Not Found

    put:
      tags: [Node]
      summary: Replace a Node
      description: Replace a Node resource.
      operationId: replaceNode
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/fieldManager'
        - $ref: '#/components/parameters/fieldValidation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          description: Not Found

    patch:
      tags: [Node]
      summary: Patch a Node
      description: Patch a Node resource.
      operationId: patchNode
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/fieldManager'
        - $ref: '#/components/parameters/fieldValidation'
        - $ref: '#/components/parameters/force'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
          application/strategic-merge-patch+json:
            schema:
              $ref: '#/components/schemas/Node'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Node'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          description: Not Found

    delete:
      tags: [Node]
      summary: Delete a Node
      description: Delete a Node resource.
      operationId: deleteNode
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/pretty'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '404':
          description: Not Found

  # ─── Task Collection ─────────────────────────────────────────────
  /api/v1/rlinf.io/v1alpha1/tasks:
    get:
      tags: [Task]
      summary: List tasks
      description: List tasks resources.
      operationId: listTask
      parameters:
        - $ref: '#/components/parameters/namespace'
        - $ref: '#/components/parameters/pretty'
        - $ref: '#/components/parameters/continue'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/fieldSelector'
