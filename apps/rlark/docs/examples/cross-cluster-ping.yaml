# Cross-cluster network test Jobs.
#
# The Kubernetes runtime only supports the "rlinf.io/ray" workload, and the Job
# controller always rewrites workload.parameters so that the main container runs
# "rlark-tools ray-launcher" as its primary process. A user "command" in the Pod
# template is therefore replaced, and the image must ship the Ray CLI, bash and
# python. Put the workload command in workload.parameters.run.inline instead;
# the Ray head runs it after the cluster is ready.
#
# Only the Ray head executes run.inline, and a head waits for
# parameters.totalNodes nodes to join its own Ray cluster. Two single-task Jobs
# are therefore used so each side is an independent single-node Ray head: this
# test exercises cross-cluster Pod networking, not Ray cluster formation.
#
# The controller-manager creates one Task per Job task, named {jobName}-{taskName}.
# The Task namespace is resolved from placement.nodeSelector "rlark.io/cluster-id".
apiVersion: rlinf.io/v1alpha1
kind: Job
metadata:
  name: cross-cluster-server
spec:
  domain: cross-cluster-net-test
  tasks:
  - name: app
    head: true
    role: Actor
    placement:
      nodeSelector:
        rlark.io/cluster-id: rlark-agent-my-cluster-1
    runtime:
      kind: Kubernetes
    workload:
      kind: rlinf.io/ray
      version: v1
      parameters:
        run:
          inline: |
            mkdir -p /tmp/www
            echo 'hello from server' > /tmp/www/index.html
            cd /tmp/www
            exec python -m http.server 8000
      carrier:
        type: rlinf.io/kubernetes-deployment
        version: v1
        parameters:
          replicas: 1
      template:
        spec:
          hostPID: true
          restartPolicy: Always
          containers:
          - name: main
            image: localhost:5555/ray:quickstart
            imagePullPolicy: IfNotPresent
            ports:
            - containerPort: 8000
---
apiVersion: rlinf.io/v1alpha1
kind: Job
metadata:
  name: cross-cluster-client
spec:
  domain: cross-cluster-net-test
  tasks:
  - name: app
    head: true
    role: Actor
    placement:
      nodeSelector:
        rlark.io/cluster-id: rlark-agent-my-cluster-2
    runtime:
      kind: Kubernetes
    workload:
      kind: rlinf.io/ray
      version: v1
      carrier:
        type: rlinf.io/kubernetes-deployment
        version: v1
        parameters:
          replicas: 1
      template:
        spec:
          hostPID: true
          restartPolicy: Always
          containers:
          - name: main
            image: localhost:5555/ray:quickstart
            imagePullPolicy: IfNotPresent
