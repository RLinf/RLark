# 控制面部署示例
# rlarkadm install -f deploy-control-plane.yaml

apiVersion: rlark.io/v1alpha1
kind: DeployConfig
plane: control

#db:
#  host: 192.168.1.10
#  port: 5432
#  database: rlark
#  user: rlark
#  password: rlark123

# --- 三选一 ---

kubernetes:
  kubeconfig: ~/.kube/config # kubeconfig for the target cluster
  gateway-image: rlark:latest
  controller-manager-image: rlark:latest
  server-image: rlark:latest
  kcp-image: kcp:v0.30.0
  # etcd-image: etcd:3.5.15-0
  postgresql-image: postgres:15
  ui-image: rlark-ui:latest

  # 全局默认，所有有状态组件继承（可被组件级覆盖）
  #replicas: 1
  storage:
    type: pvc   # emptyDir | hostPath | pvc
    # host-path: /data/rlark
    storage-class: ""  # 空表示用集群默认 StorageClass
    size: 10Gi
    node-selector:
      kubernetes.io/hostname: dev-worker

  # 组件级配置（覆盖全局默认）
