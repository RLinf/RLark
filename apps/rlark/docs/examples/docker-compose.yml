services:
  # kcp - Kubernetes-like control plane
  kcp:
    image: ghcr.io/kcp-dev/kcp:v0.30.0
    container_name: kcp
    ports:
      - "6443:6443"
    volumes:
      - kcp-data:/.kcp
    environment:
      - KCP_LOG_LEVEL=2
    command: start
    healthcheck:
      test: ["CMD", "test", "-f", "/.kcp/admin.kubeconfig"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - rlark-network

  # PostgreSQL - Database
  postgresql:
    image: postgres:15
    container_name: postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rlark
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rlark-network

  # rlark-server - Agent WebSocket tunnel, cert signing, SSH, K8s API proxy
  rlark-server:
    image: ${IMAGE:-rlark/rlark:latest}
    container_name: rlark-server
    command:
      - "/rlark-server"
      - "--kubeconfig=/etc/rlark/kubeconfig.yaml"
      - "--https-port=8443"
      - "--ssh-port=2222"
      - "--auto-sign-tls-ca-cert"
      - "--tls-domains=localhost,rlark-server"
      - "--db-config=/etc/rlark/db-config.yaml"
    ports:
      - "8443:8443"
      - "2222:2222"
    volumes:
      - ${KCP_KUBECONFIG:-./kcp-kubeconfig.yaml}:/etc/rlark/kubeconfig.yaml:ro
      - ${DB_CONFIG:-./db-config.yaml}:/etc/rlark/db-config.yaml:ro
    depends_on:
      kcp:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    networks:
      - rlark-network

  # rlark-gateway - User-facing REST API
  rlark-gateway:
    image: ${IMAGE:-rlark/rlark:latest}
    container_name: rlark-gateway
    command:
      - "/rlark-gateway"
      - "--kubeconfig=/etc/rlark/kubeconfig.yaml"
      - "--addr=:8080"
      - "--server-address=https://rlark-server:8443"
      - "--db-config=/etc/rlark/db-config.yaml"
    ports:
      - "9000:8080"
    volumes:
      - ${KCP_KUBECONFIG:-./kcp-kubeconfig.yaml}:/etc/rlark/kubeconfig.yaml:ro
      - ${DB_CONFIG:-./db-config.yaml}:/etc/rlark/db-config.yaml:ro
    depends_on:
      - rlark-server
    networks:
      - rlark-network

  # rlark-controller-manager - Job→Task, Domain→DomainPeer, IP allocation
  rlark-controller-manager:
    image: ${IMAGE:-rlark/rlark:latest}
    container_name: rlark-controller-manager
    command:
      - "/rlark-controller-manager"
      - "--kubeconfig=/etc/rlark/kubeconfig.yaml"
      - "--server-address=https://rlark-server:8443"
      - "--leader-elect=false"
      - "--metrics-bind-address=:0"
      - "--health-probe-bind-address=:0"
      - "--db-config=/etc/rlark/db-config.yaml"
    volumes:
      - ${KCP_KUBECONFIG:-./kcp-kubeconfig.yaml}:/etc/rlark/kubeconfig.yaml:ro
      - ${DB_CONFIG:-./db-config.yaml}:/etc/rlark/db-config.yaml:ro
    depends_on:
      - rlark-server
    networks:
      - rlark-network

volumes:
  kcp-data:
  postgres-data:

networks:
  rlark-network:
    driver: bridge