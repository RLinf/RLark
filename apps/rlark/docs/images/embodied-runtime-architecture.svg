<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-lg" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <style>
      .font { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .section-title { font-size: 13px; font-weight: 700; fill: #334155; }
      .card-title { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .card-title-sm { font-size: 12px; font-weight: 700; fill: #1E293B; }
      .card-desc { font-size: 10.5px; font-weight: 400; fill: #475569; }
      .card-sub { font-size: 10.5px; font-weight: 600; fill: #475569; }
      .badge { font-size: 10px; font-weight: 600; }
      .badge-xs { font-size: 9px; font-weight: 600; }
      .legend { font-size: 10px; font-weight: 500; fill: #475569; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 10px; }
      .code-sm { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 9.5px; }
    </style>
  </defs>

  <rect width="900" height="620" fill="#FAFBFC"/>

  <!-- ==================== K8s Node ==================== -->
  <g transform="translate(30, 15)">
    <rect width="840" height="590" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow-lg)"/>
    <rect x="0" y="0" width="840" height="38" rx="18" fill="#F1F5F9"/>
    <rect x="0" y="18" width="840" height="20" fill="#F1F5F9"/>
    <text x="24" y="25" class="font section-title">Kubernetes Node</text>

    <!-- ==================== Layer 1: Device Plugin ==================== -->
    <g transform="translate(24, 56)">
      <rect width="792" height="180" rx="14" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="792" height="34" rx="14" fill="#EFF6FF"/>
      <rect x="0" y="14" width="792" height="20" fill="#EFF6FF"/>
      <text x="18" y="23" class="font card-title">Device Plugin</text>
      <rect x="130" y="9" width="80" height="18" rx="9" fill="#DBEAFE" stroke="#93C5FD"/>
      <text x="170" y="22" text-anchor="middle" class="font badge" fill="#2563EB">DaemonSet</text>

      <!-- Row 1: Registration + Injection -->
      <g transform="translate(18, 44)">
        <rect width="370" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#3B82F6"/>
        <text x="18" y="24" class="font card-title-sm">Registration</text>
        <text x="18" y="42" class="font card-desc">Registers rlinf.io/device with kubelet</text>
      </g>
      <g transform="translate(408, 44)">
        <rect width="366" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#EC4899"/>
        <text x="18" y="24" class="font card-title-sm">Injection</text>
        <text x="18" y="42" class="font card-desc">Injects sockets, CLI binaries, and env vars on Allocate</text>
      </g>

      <!-- Row 2: Detection &amp; Lifecycle (full width, richer) -->
      <g transform="translate(18, 104)">
        <rect width="756" height="68" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="4" height="68" rx="2" fill="#06B6D4"/>
        <text x="18" y="24" class="font card-title-sm">Detection &amp; Lifecycle</text>
        <text x="18" y="44" class="font card-desc">Detects node-local hardware and generates controller configs</text>
        <text x="18" y="58" class="font card-desc">Starts and supervises ros-controller and camera-controller</text>
      </g>
    </g>
  </g>

  <!-- ==================== Layer 2: Controllers + CLI ==================== -->
  <g transform="translate(30, 15)">
    <g transform="translate(24, 252)">
      <rect width="792" height="138" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="792" height="34" rx="14" fill="#ECFDF5"/>
      <rect x="0" y="14" width="792" height="20" fill="#ECFDF5"/>
      <text x="18" y="23" class="font card-title">Controllers &amp; CLI</text>

      <!-- ros-controller -->
      <g transform="translate(18, 44)">
        <rect width="250" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="4" height="86" rx="2" fill="#10B981"/>
        <text x="14" y="22" class="font card-title-sm">ros-controller</text>
        <rect x="114" y="10" width="58" height="14" rx="7" fill="#F3E8FF" stroke="#C4B5FD"/>
        <text x="143" y="20" text-anchor="middle" class="font badge-xs" fill="#7C3AED">subprocess</text>
        <rect x="178" y="10" width="38" height="14" rx="7" fill="#F3E8FF" stroke="#C4B5FD"/>
        <text x="197" y="20" text-anchor="middle" class="font badge-xs" fill="#7C3AED">Pod</text>

        <text x="14" y="46" class="font card-desc">roscore :11311</text>
        <text x="14" y="60" class="font card-desc">roslaunch · MACVLAN</text>
        <rect x="14" y="66" width="222" height="16" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="125" y="78" text-anchor="middle" class="font legend" fill="#64748B">ros-ctrl.sock</text>
      </g>

      <!-- camera-controller -->
      <g transform="translate(284, 44)">
        <rect width="250" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="4" height="86" rx="2" fill="#F59E0B"/>
        <text x="14" y="22" class="font card-title-sm">camera-controller</text>
        <rect x="128" y="10" width="58" height="14" rx="7" fill="#F3E8FF" stroke="#C4B5FD"/>
        <text x="157" y="20" text-anchor="middle" class="font badge-xs" fill="#7C3AED">subprocess</text>
        <rect x="192" y="10" width="38" height="14" rx="7" fill="#F3E8FF" stroke="#C4B5FD"/>
        <text x="211" y="20" text-anchor="middle" class="font badge-xs" fill="#7C3AED">Pod</text>

        <text x="14" y="46" class="font card-desc">V4L2 / RTSP / RealSense</text>
        <text x="14" y="60" class="font card-desc">ffmpeg · transcoding</text>
        <rect x="14" y="66" width="222" height="16" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="125" y="78" text-anchor="middle" class="font legend" fill="#64748B">camera-ctrl.sock</text>
      </g>

      <!-- CLI binaries -->
      <g transform="translate(558, 44)">
        <rect width="216" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
        <rect x="0" y="0" width="4" height="86" rx="2" fill="#6366F1"/>
        <text x="14" y="24" class="font card-title-sm">CLI binaries</text>
        <rect x="14" y="34" width="188" height="18" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="108" y="46" text-anchor="middle" class="font legend" fill="#64748B">/opt/rlinf/bin/</text>
        <rect x="22" y="60" width="62" height="18" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
        <text x="53" y="73" text-anchor="middle" class="font badge" fill="#2563EB">rosctr</text>
        <rect x="96" y="60" width="62" height="18" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
        <text x="127" y="73" text-anchor="middle" class="font badge" fill="#2563EB">camctr</text>
      </g>
    </g>
  </g>

  <!-- ==================== Arrows: Controllers & CLI → Task Pod ==================== -->
  <!-- ros-controller → Task Pod -->
  <path d="M198 405 L198 435" stroke="#3B82F6" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
  <rect x="148" y="418" width="100" height="16" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="198" y="429" text-anchor="middle" class="font legend" fill="#2563EB">gRPC via socket</text>

  <!-- camera-controller → Task Pod -->
  <path d="M464 405 L464 435" stroke="#3B82F6" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
  <rect x="414" y="418" width="100" height="16" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="464" y="429" text-anchor="middle" class="font legend" fill="#2563EB">gRPC via socket</text>

  <!-- CLI → Task Pod -->
  <path d="M721 405 L721 435" stroke="#94A3B8" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <rect x="686" y="418" width="70" height="16" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="721" y="429" text-anchor="middle" class="font legend" fill="#64748B">mount</text>

  <!-- ==================== Layer 3: Task Pod ==================== -->
  <g transform="translate(30, 15)">
    <g transform="translate(24, 440)">
      <rect width="792" height="118" rx="14" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="792" height="34" rx="14" fill="#FEF3C7"/>
      <rect x="0" y="14" width="792" height="20" fill="#FEF3C7"/>
      <text x="18" y="23" class="font card-title">Task Pod</text>
      <rect x="100" y="9" width="120" height="18" rx="9" fill="#FEF3C7" stroke="#FCD34D"/>
      <text x="160" y="22" text-anchor="middle" class="font badge" fill="#B45309">requests rlinf.io/device</text>

      <!-- Environment -->
      <text x="26" y="56" class="font card-sub">Environment</text>
      <rect x="130" y="44" width="218" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="138" y="58" class="font code-sm" fill="#64748B">RLINF_EMBODIED_RUNTIME_ENABLED=1</text>
      <rect x="358" y="44" width="178" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="366" y="58" class="font code-sm" fill="#64748B">RLINF_EMBODIED_ROS_ENABLED=1</text>
      <rect x="546" y="44" width="196" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="554" y="58" class="font code-sm" fill="#64748B">RLINF_EMBODIED_CAMERA_ENABLED=1</text>

      <!-- Mounts -->
      <text x="26" y="80" class="font card-sub">Mounts</text>
      <rect x="130" y="68" width="280" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="138" y="82" class="font code-sm" fill="#64748B">/var/run/rlark → controller sockets (ro)</text>
      <rect x="420" y="68" width="260" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="428" y="82" class="font code-sm" fill="#64748B">/opt/rlinf/bin → rosctr / camctr CLIs (ro)</text>

      <!-- Usage -->
      <text x="26" y="104" class="font card-sub">Usage</text>
      <rect x="130" y="92" width="300" height="20" rx="5" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="138" y="106" class="font code-sm" fill="#334155">rosctr start franka-0 impedance</text>
      <rect x="440" y="92" width="300" height="20" rx="5" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="448" y="106" class="font code-sm" fill="#334155">camctr open camera0 --encoding h264</text>
    </g>
  </g>
</svg>