# The stages of a release, in the order `rlarkctl release apply` walks them.
# The order is data kept with the code: whoever changes what a component
# needs of another changes a line here in the same commit. A run that goes
# back (--back) walks the stages marked back in the reverse order.
#
# A stage has:
#   name           unique; the command knows what each name changes.
#   requires       stages that are complete before this one starts.
#   changes        what the stage touches, as text.
#   gate           what holds before the stage starts.
#   check          what holds once the stage is done; the command reads
#                  until it holds or the stage times out, and stops there.
#   recreates      the owners ("<namespace>/<owner>", path patterns) whose
#                  Pods the stage replaces; any other Pod made anew stops it.
#   back           the stage is walked when a run goes back too.
#   timeoutFactor  how many times the run's timeout the stage may take.
#   note           why the stage is where it is.
#
# An entry of gate or check is one of:
#   <check>           compares the management plane with a baseline taken
#                     before the run.
#   <check>: <level>  reads the plane as it is, for what this build needs of
#                     it. gateways-understand: N holds when the gateway of
#                     every member with a document states document level N or
#                     more; one that states none does not understand.
stages:
  - name: images
    changes:
      - the site's own registry (environment registry.site), where its clusters pull from, gets every image of the release it lacks, copied by digest from the registry the release is kept in (registry.source); each is read back there
    note: The office's and the robots' clusters pull from the site's registry, whose store is its own disk; an image the release brings is there before anything of the release pulls it. A site without registry.site pulls from the source itself and has nothing done here.

  - name: prewarm
    requires: [images]
    changes:
      - the control plane's images, pulled onto its machine by the names it pulls them by
    check:
      - nodes-unpressured
    note: An image the machine cannot pull stops the run before anything changes. A member cluster's Pod pulls what it lacks when it starts.

  - name: crds-rbac
    requires: [prewarm]
    changes:
      - CustomResourceDefinitions of rlinf.io and station.rlark.io, as the release's tree has them
      - management RBAC of station-api and station-controller
      - in every member cluster, what Station API and Station's node operations may do there (astribot/station/deploy/member-rbac.yaml, node-operation-member-rbac.yaml)
    note: A new station-api lists objects the old RBAC forbids, so the RBAC is there before it starts. The tree is the release's own commit (git archive), so its definitions are not an older tree's. Going back leaves them. A field or value a release's definitions dropped is then no longer accepted from the older build (pruned, or refused where it is an enum value), so a run does not go back past such a release with objects of that kind in flight.

  - name: station-placement
    requires: [crds-rbac]
    changes:
      - in every member cluster, the node affinity of Station's DaemonSets as the release's tree states it (astribot/station/deploy/station-agent.yaml), the Pods on nodes a DaemonSet no longer takes removed and the others replaced by the cluster agent
    check:
      - gateways-understand: 2
    recreates: [station-system/station-agent*]
    note: A node runs the one Station agent its station.rlark.io/network label calls for. Two agents on one node write the node's one observation by turns, and the controller's gate reads the gateway's level from it (ci-2a9ea9b on the live office, 11-17, where station-agent, made before station-agent-host existed and placed on every node not enabled, ran beside it on nb260706069, labelled host, and the gate read no level). A release only set images on a DaemonSet the cluster had; it places them now, before the controller, and the check is the controller's gate. Going back leaves the placement, which was never right before.

  - name: gateway
    requires: [crds-rbac]
    back: true
    changes:
      - the RLark gateway container
    check: [clusters-online, addons-ready]
    note: The catalog the Gateway reads holds the versions the site runs.

  - name: station-api
    requires: [gateway]
    back: true
    changes:
      - Deployment station-api
      - the installer (the environment's installer) laid down on Station API's machine, which both Station API and station-controller then read (their bundle flags, annotation rlark.io/installer)
    check: [enrollments-enrolled, observations-fresh]
    recreates: [station-system/station-api, station-system/station-controller]
    note: The installer holds the site registry's CA, so it is the environment's, not the release's. Read back by what Station API serves (its SHA-256); the earlier installer's file stays beside it.

  - name: controller
    requires: [station-api, station-placement]
    back: true
    changes:
      - Deployment station-controller
    gate:
      - gateways-understand: 2
    check: [documents-unchanged, enrollments-enrolled, network-connected]
    recreates: [station-system/station-controller]
    note: A gateway refuses a document with a field it does not know. The level is that of the document this build's controller writes, DocumentLevel in astribot/station/network, and the commit that raises that raises it here.

  - name: cluster-agents
    requires: [controller]
    back: true
    changes:
      - every cluster's RLark agent, one cluster at a time, each ready before the next
    check: [clusters-online, addons-ready, nodes-ready, nodes-unpressured]
    recreates: [rlark-system/rlark-agent-node]
    note: The agent renders the Addons from their packages and replaces nothing of them that did not change. The agent is the Deployment of rlark-system that runs it with --mode=cluster, whatever it was named when it was installed; its own Pods are the ones this stage replaces. It renders the node agents' DaemonSet too, and a new agent may render it otherwise with the same image (ci-ce132d1 on the live office cluster, 11-17 21:33Z, the Server's address it resolves in its node's network, cee0766), which replaces the node agents' Pods in this stage.

  - name: node-agents
    requires: [cluster-agents]
    back: true
    timeoutFactor: 3
    changes:
      - every cluster's node agents (Cluster spec.nodeAgents.image; a node first, then a tenth of the ready nodes at a time)
    check: [clusters-online, nodes-ready, nodes-unpressured]
    recreates: [rlark-system/rlark-agent-node]
    note: The cluster agent rolls them; a node that is off keeps its own until it is back and holds nobody up.

  - name: station-agents
    requires: [node-agents]
    back: true
    timeoutFactor: 3
    changes:
      - DaemonSets station-agent, station-agent-network, station-agent-host of every cluster (station-agent, station-wireguard)
    check: [observations-fresh, enrollments-enrolled, links-connected, documents-unchanged, network-connected, nodes-unpressured]
    recreates: [station-system/station-agent*]
    note: The cluster agent replaces their Pods (OnDelete, rlark.io/rollout), a node at a time, a robot only when it is idle; a gateway that is a host service is replaced by the keeper.

  - name: server
    requires: [station-agents]
    back: true
    changes:
      - the RLark server container
      - the RLark controller-manager container
    check: [clusters-online, nodes-ready]
    note: The server keeps the heartbeat only of an agent whose tunnel says it is ready. An agent of a build before that says nothing and would read Offline, so every cluster's agent and node agents come first, and a run that goes back takes the server back first.

  - name: console
    requires: [server]
    back: true
    changes:
      - the console

  - name: addons
    requires: [console]
    back: true
    timeoutFactor: 6
    changes:
      - every Addon whose version or values differ from the release's and the environment's, in the order the release states (after)
    check: [clusters-online, nodes-ready]
    recreates: ["*/*"]
