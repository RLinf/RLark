apiVersion: v1
kind: ConfigMap
metadata:
  name: ros-controller-config
  namespace: default
  labels:
    app: ros-controller
data:
  ros-controller.yaml: |
    # ros-controller configuration — macvlans, robot types, and robots.
    # This file is mounted into the pod at /etc/rlinf/ros-controller.yaml.

    macvlans:
      - host_nic: eno1
        name: robot1-macvlan
        ip: 172.16.0.101/24
        # gateway: 172.16.0.1

    types:
      - type: franka
        modes:
          impedance:
            package: serl_franka_controllers
            launch_file: impedance.launch
            passthrough_robot_args: true
          joint:
            package: serl_franka_controllers
            launch_file: joint.launch
            passthrough_robot_args: true

    robots:
      - id: franka-robot-1
        type: franka
        params:
          robot_ip: 172.16.0.2
        web_service: https://172.16.0.2/

    allowed_launch_packages:
      - serl_franka_controllers
---
apiVersion: v1
kind: Pod
metadata:
  name: ros-controller-franka
  namespace: default
  labels:
    app: ros-controller
  annotations:
    description: "ROS Controller for Franka robot — manages roscore + roslaunch lifecycle"
spec:
  hostPID: true

  priorityClassName: system-cluster-critical

  initContainers:
    # Copies binaries from embodied-runtime image into a shared emptyDir and
    # to the host (for operator use).
    - name: binary-init
      image: rlinf/embodied-runtime:v0.1.0
      imagePullPolicy: Always
      command:
        - sh
        - -c
        - |
          set -e
          cp /usr/local/bin/ros-controller /opt/rlinf/bin/ros-controller
          cp /usr/local/bin/rosctr /opt/rlinf/bin/rosctr
          cp /usr/local/bin/rosctr /host-bin/rosctr
          echo "binaries deployed"
      volumeMounts:
        - name: ros-bin
          mountPath: /opt/rlinf/bin
        - name: rosctr-host-bin
          mountPath: /host-bin

  containers:
    - name: ros-controller
      # franka-workspace image has ROS + compiled workspace built in.
      # The ros-controller binary is provided via the binary-init emptyDir.
      image: rlinf/serl_franka_controllers:v0.1.0-libfranka-0.19.0-frankaros-0.10.2
      imagePullPolicy: Always

      command:
        - bash
        - -c
      args:
        - |
          source /opt/ros/noetic/setup.bash
          source /catkin_ws/devel_isolated/setup.bash
          /opt/rlinf/bin/ros-controller \
            --config=/etc/rlinf/ros-controller.yaml \
            --http-addr=:8080
      env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        - name: ROS_PACKAGE_PATH
          value: /catkin_ws/devel_isolated/share
        - name: CMAKE_PREFIX_PATH
          value: /catkin_ws/devel_isolated

      securityContext:
        privileged: true

      volumeMounts:
        - name: config
          mountPath: /etc/rlinf
          readOnly: true

        - name: ros-bin
          mountPath: /opt/rlinf/bin

        - name: socket-dir
          mountPath: /var/run/rlark

      # resources:
      #   requests:
      #     cpu: 500m
      #     memory: 512Mi
      #   limits:
      #     cpu: 2
      #     memory: 2Gi

      livenessProbe:
        exec:
          command: ["/opt/rlinf/bin/rosctr", "--socket-path=/var/run/rlark/ros-ctrl.sock", "list"]
        initialDelaySeconds: 10
        periodSeconds: 15

      readinessProbe:
        exec:
          command: ["/opt/rlinf/bin/rosctr", "--socket-path=/var/run/rlark/ros-ctrl.sock", "list"]
        initialDelaySeconds: 5
        periodSeconds: 10

  volumes:
    - name: config
      configMap:
        name: ros-controller-config

    - name: ros-bin
      emptyDir: {}

    - name: rosctr-host-bin
      hostPath:
        path: /opt/rlinf/bin
        type: DirectoryOrCreate

    - name: socket-dir
      hostPath:
        path: /var/run/rlark
        type: DirectoryOrCreate

  nodeSelector:
    kubernetes.io/hostname: your-node-name

  tolerations:
    - key: "rlinf.io/robot"
      operator: "Exists"
      effect: "NoSchedule"
