<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>RLark · 场站节点</title>
<style>
    :root {
      color-scheme: light;
      --ink: #171b25;
      --muted: #7c8492;
      --soft: #a9b0bd;
      --line: #e7ebf0;
      --line-strong: #dce2ea;
      --panel: #fff;
      --canvas: #f4f6f9;
      --hover: #f5f0fe;
      --blue: #7c3aed;
      --blue-2: #a78bfa;
      --blue-bg: #efe9fd;
      --green: #36c98f;
      --green-soft: #e7f8f1;
      --red: #ef5a7a;
      --orange: #f59e35;
      --shadow-soft: 0 8px 24px rgba(28,39,58,.055);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0;  }
    body { background: var(--canvas); color: var(--ink); font: 13px/1.45 Inter, "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button, select { color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    :focus-visible { outline: 3px solid var(--blue-2); outline-offset: 2px; }
    .theme-dark {
      color-scheme: dark;
      --ink: #f5f7fb;
      --muted: #9ca8ba;
      --line: #273348;
      --line-strong: #34435a;
      --panel: #151d2b;
      --canvas: #0f1623;
      --blue: #a78bfa;
      --blue-bg: rgba(167,139,250,.18);
      --hover: rgba(167,139,250,.08);
    }
    .shell-sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; width: 256px; display: flex; flex-direction: column; padding: 19px 16px 14px; border-right: 1px solid var(--line); background: var(--panel); }
    .brand { display: flex; align-items: center; gap: 10px; min-height: 45px; margin: 0 10px 24px; color: var(--blue); font-size: 25px; font-weight: 800; letter-spacing: -.7px; }
    .brand-mark { width: 35px; height: 35px; display: grid; place-items: center; border: 2px solid var(--blue); border-radius: 50%; }
    .brand-mark svg { width: 22px; }
    .nav-caption { margin: 0 10px 8px; color: var(--soft); font-size: 10px; font-weight: 800; }
    .nav-list { display: grid; gap: 4px; }
    .nav-item { display: flex; align-items: center; gap: 12px; min-height: 43px; padding: 0 11px; border-radius: 12px; color: #596579; font-weight: 650; text-decoration: none; white-space: nowrap; }
    .nav-item svg { width: 17px; height: 17px; flex: none; }
    .nav-item:hover { background: var(--hover); color: var(--ink); }
    .nav-item.active { background: var(--blue-bg); color: var(--blue); }
    .nav-item.active::before { position: absolute; left: 0; width: 4px; height: 28px; border-radius: 0 4px 4px 0; background: var(--blue); content: ""; }
    .sidebar-bottom { margin-top: auto; }
    .sidebar-bottom button.nav-item { width: 100%; border: 0; background: transparent; font: inherit; text-align: left; }
    body.sidebar-collapsed .shell-sidebar { width: 80px; align-items: center; padding-right: 8px; padding-left: 8px; }
    body.sidebar-collapsed .brand { width: 42px; justify-content: center; margin-right: 0; margin-left: 0; font-size: 0; }
    body.sidebar-collapsed .brand-word, body.sidebar-collapsed .nav-caption, body.sidebar-collapsed .nav-item span { display: none; }
    body.sidebar-collapsed .nav-item { justify-content: center; width: 46px; margin-right: auto; margin-left: auto; padding: 0; }
    body.sidebar-collapsed .nav-item.active::before { left: -8px; }
    body.sidebar-collapsed .shell-main { width: calc(100% - 80px); margin-left: 80px; }
    .shell-main { width: calc(100% - 256px); min-height: 100vh; margin-left: 256px; }
    .topbar { position: sticky; z-index: 20; top: 0; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 28px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .topbar-current { display: grid; gap: 2px; }
    .topbar-current small { color: var(--soft); font-size: 10px; font-weight: 700; }
    .topbar-current strong { font-size: 14px; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .topbar-toggle { display: inline-flex; align-items: center; gap: 4px; padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
    .topbar-toggle button { min-height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; }
    .topbar-toggle button.active { background: var(--blue-bg); color: var(--blue); }
    .topbar-icon { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--panel); border-radius: 50%; background: #f6d8c5; color: #604632; font-size: 11px; font-weight: 800; }
    .page-content { display: grid; align-content: start; gap: 18px; min-width: 0; padding: 28px; padding-bottom: 52px; }
    @media (max-width: 760px) {
      .shell-sidebar { width: 72px; align-items: center; padding: 14px 8px; }
      body.sidebar-collapsed .shell-sidebar { width: 72px; }
      .brand { width: 42px; height: 42px; justify-content: center; margin: 0 0 22px; font-size: 0; }
      .brand-mark { width: 35px; height: 35px; }
      .brand-word, .nav-caption, .nav-item span { display: none; }
      .nav-list { width: 100%; }
      .nav-item { position: relative; justify-content: center; width: 46px; min-height: 46px; margin: 0 auto; padding: 0; }
      .nav-item svg { width: 19px; height: 19px; }
      .nav-item.active::before { left: -8px; }
      .sidebar-bottom .nav-item { margin-top: 0; }
      .shell-main { width: calc(100% - 72px); margin-left: 72px; }
      body.sidebar-collapsed .shell-main { width: calc(100% - 72px); margin-left: 72px; }
      .topbar { height: 72px; padding: 0 16px; }
      .topbar-actions { gap: 5px; }
      .topbar-toggle button { padding: 0 7px; }
      .topbar-icon, .avatar { display: none; }
      .page-content { gap: 13px; padding: 18px 16px 74px; }
    }


.theme-dark .nav-item { color: var(--muted); }
.theme-dark .nav-item.active { color: var(--blue); }

body {overflow-anchor:none;font-variant-numeric:tabular-nums}
[hidden] {display:none!important}
button,input,select {font:inherit;color:inherit}
h1,h2,h3,p,dl,dd {margin:0}
h1 {font-size:20px} h2 {font-size:15px} h3 {font-size:15px}
small,.muted,dt {color:var(--muted);font-size:12px}
code {overflow-wrap:anywhere}
.page-content {gap:16px}
.heading,.toolbar,.section-head,.identity,.actions,.batch,.tabs {
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0
}
.heading,.section-head {justify-content:space-between}
.toolbar {padding-bottom:16px;border-bottom:1px solid var(--line)}
.toolbar input[type=search] {flex:1 1 180px}
.toolbar input,.toolbar select,.review-grid select {
  min-width:0;max-width:100%;min-height:40px;padding:0 10px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel)
}
.secondary-button,.primary-button,.icon-button {
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 12px;border:1px solid var(--line-strong);
  border-radius:10px;background:var(--panel);font-size:13px;font-weight:600
}
.primary-button {height:42px;background:var(--ink);color:var(--panel);border-color:var(--ink)}
.icon-button {width:38px;height:38px;padding:0}
.secondary-button:hover,.icon-button:hover {background:var(--hover)}
.status {
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);
  border-radius:999px;font-size:12px;font-weight:600;background:var(--canvas);white-space:nowrap
}
.status i {width:6px;height:6px;border-radius:50%;background:var(--green)}
.status.bad i {background:var(--red)} .status.quiet i {background:var(--muted)}
.groups,.group,.card-list {display:grid;gap:12px;min-width:0}
.groups {gap:24px}
.group-heading {display:grid;gap:3px}
.group-heading .muted {overflow-wrap:anywhere}
.batch {padding:8px 0}
.batch label {display:inline-flex;align-items:center;gap:8px;min-height:40px}
.batch-tools {padding:6px 8px;border-radius:10px;background:var(--blue-bg)}
input[type=checkbox] {accent-color:var(--blue);width:16px;height:16px;margin:0}
.card-row {display:grid;gap:12px;align-items:stretch}
.card-row.feature-row {grid-template-columns:repeat(var(--columns),minmax(0,460px))}
.card-row.stock-row {grid-template-columns:repeat(var(--columns),minmax(0,350px))}
.card,.detail,.ledger,.empty {
  min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--panel)
}
.card {display:flex;flex-direction:column;padding:14px;gap:12px}
.feature {box-shadow:var(--shadow-soft)}
.card.selected,.card.open {border-color:var(--blue-2)}
.identity {align-items:flex-start;flex-wrap:nowrap}
.identity input {margin-top:6px;flex:none}
.node-title {flex:1;min-width:0;overflow-wrap:anywhere}
.node-title small {display:block;margin-top:2px}
.control-plane {display:flex;align-items:center;flex-wrap:wrap;gap:10px;max-width:920px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.control-plane .node-title {min-width:140px}
.facts {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts dd {font-weight:600;font-size:12px;overflow-wrap:anywhere}
.robot-state {display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12px}
.robot-state strong {font-weight:650}
.warning {color:color-mix(in srgb,var(--red) 72%,var(--ink))}
.footer {display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.stock .footer {justify-content:flex-end}
.cameras {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.cameras.square {grid-template-columns:repeat(2,minmax(0,1fr))}
.frame {position:relative;display:block;min-width:0;width:100%;aspect-ratio:16/9;padding:0;
  border:0;border-radius:9px;overflow:hidden;background:var(--canvas);text-align:left}
.cameras:not(.square) .frame:first-child {grid-column:1/-1}
.frame img {display:block;width:100%;height:100%;object-fit:cover}
.frame img.stale {filter:grayscale(.55)}
.frame.placeholder {border:1px dashed var(--line-strong);color:var(--muted)}
.frame-caption {position:absolute;inset:auto 0 0;padding:4px 6px;font-size:11px;font-weight:650;
  color:#fff;background:linear-gradient(transparent,rgba(12,16,27,.9));line-height:1.25}
.placeholder .frame-caption {position:static;display:grid;place-items:center;height:100%;text-align:center;color:var(--muted);background:none}
.frame-note {font-size:11px;display:block;font-weight:500}
.camera-line {display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.camera-line span:last-child {text-align:right}
.detail-cameras .live {color:var(--blue);font-weight:650}
.detail {
  display:grid;gap:16px;min-width:0;padding:16px;border-top:2px solid var(--blue-2);
  scroll-margin:84px;container-type:inline-size
}
.detail-header {display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.detail-title {display:grid;gap:4px;min-width:0}
.detail-title h3 {overflow-wrap:anywhere}
.detail-actions {display:grid;gap:5px;min-width:0;justify-items:end}
.detail-actions small {text-align:right}
.detail-actions .danger:not(:disabled) {color:color-mix(in srgb,var(--red) 72%,var(--ink))}
.detail-conflict {
  display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;
  background:color-mix(in srgb,var(--red) 9%,var(--panel))
}
.detail-conflict svg,.detail-column h4 svg {flex:none}
.detail-conflict p {margin-top:2px;color:var(--ink)}
.detail-grid {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);padding-top:12px;border-top:1px solid var(--line)}
.detail-column {min-width:0;padding:0 16px;border-left:1px solid var(--line)}
.detail-column:first-child {padding-left:0;border-left:0}
.detail-column:last-child {padding-right:0}
.detail-column h4,.detail-cameras h4 {
  display:flex;align-items:center;gap:7px;margin:0 0 10px;font-size:13px
}
.detail-column dl {display:grid;gap:8px}
.detail-column dd {font-size:13px;overflow-wrap:anywhere}
.detail-column code {font-size:12px}
.detail-cameras {display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.detail-cameras h4 {margin:0}
.detail-camera-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.copy-value {display:grid;grid-template-columns:minmax(0,1fr) 38px;align-items:center;gap:8px}
.copy-value code {min-width:0;white-space:normal;overflow-wrap:anywhere}
.detail-column .network-fields {grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.field-wide {grid-column:1/-1}
.detail-column h4:not(:first-child) {margin-top:16px}
.detail-conflict > div {flex:1;min-width:0}
.detail-identifiers {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:8px}
.condition-list,.detail-list {list-style:none;padding:0;margin:0}
.condition-list li {display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.condition-list li:first-child {padding-top:0}
.condition-list li:last-child {border:0}
.condition-list li div,.detail-list li {display:grid;gap:3px;min-width:0;overflow-wrap:anywhere}
.condition-state {justify-items:end;text-align:right}
.condition-state .status[data-value="False"] {color:color-mix(in srgb,var(--red) 70%,var(--ink))}
.condition-state .status[data-value="False"] i {background:var(--red)}
.condition-state .status[data-value="Unknown"] {color:color-mix(in srgb,var(--orange) 58%,var(--ink))}
.condition-state .status[data-value="Unknown"] i {background:var(--orange)}
.condition-note {grid-column:1/-1;overflow-wrap:anywhere}
.detail-list li+li {margin-top:8px}
.detail-power {display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.detail-power h4 {margin:0}
.detail-power dl {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.feature .robot-state {display:grid;gap:5px}
.robot-meta,.robot-track {display:flex;flex-wrap:wrap;gap:4px 10px}
.robot-track {border-top:1px solid var(--line);padding-top:5px}
@container (width < 960px) {
  .detail-grid {grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);row-gap:12px}
  .detail-column:nth-child(2) {padding-right:0}
  .detail-column:last-child {grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:12px 0 0}
  .detail-camera-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container (width < 640px) {
  .detail-grid {grid-template-columns:minmax(0,1fr)}
  .detail-column,.detail-column:first-child {padding:0;border-left:0}
  .detail-column+.detail-column {padding:12px 0 0;border-top:1px solid var(--line)}
  .detail-identifiers,.detail-column .network-fields {grid-template-columns:minmax(0,1fr)}
  .detail-camera-grid,.detail-power dl {grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-actions {justify-items:start}
  .detail-actions small {text-align:left}
}
.field {min-width:0;display:grid;gap:3px}
.no-wrap {white-space:nowrap}
.empty,.ledger {padding:16px}
.ledger {display:grid;gap:10px}
.ledger summary {cursor:pointer;font-weight:650}
.ledger-row {display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.review {position:fixed;right:12px;bottom:12px;z-index:40;width:max-content;max-width:calc(100% - 24px)}
.review[open] {width:min(500px,calc(100% - 24px));padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow-soft);max-height:85vh;overflow:auto}
.review summary {cursor:pointer;width:max-content;margin-left:auto;list-style:none}
.review summary::-webkit-details-marker {display:none}
.review-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.review-grid label {display:grid;gap:3px}
.review output {display:block;padding:10px;background:var(--canvas);border-radius:10px;font-size:12px}
.review output p+p {margin-top:5px}
dialog {width:min(660px,calc(100% - 24px));border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:16px}
dialog::backdrop {background:rgba(12,16,27,.64)}
dialog img {width:100%;border-radius:10px;margin-top:12px}
#toast {position:fixed;z-index:35;left:50%;bottom:16px;transform:translateX(-50%);max-width:90vw;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-soft)}
@media(max-width:760px) {
  .page-content {padding-inline:12px}
  .card {padding:12px}
  .identity {gap:6px}
  .topbar {gap:8px;padding:0 10px}
  .topbar-toggle button {padding:0 5px}
  .review-grid {grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

const options = {

const params = new URLSearchParams(location.search);
const settings = Object.fromEntries(Object.entries(options).map(([key, values]) => [

const t = key => words[key]?.[settings.lang === "zh" ? 0 : 1] ?? key;
const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];
const icon = name => '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><use href="#i-' + name + '"/></svg>';

  {name:"edge-record-with-long-hostname-04", group:"edge", phase:"Conflict"},
  {name:"edge-worker-05", group:"edge"},
  {name:"edge-legacy-06", group:"edge", phase:"Retired", hasNode:false},
].map((node,index) => ({
  ...node, namespace:"rlark-"+node.group, uid:"31bf7721-109d-4fc1-b59e-3faa603ac"+String(810+index),

  systemUUID:"eb7fd2f6-1e94-896c-e41a-30c5994cd"+String(810+index),

const clusterGroups = {

let statusFilter = "all", clusterFilter = "", search = "", anchorShift = null;
let frameRequests = 0, reportRequests = 0, toastTimer, dialogControl;
let featureColumns = 0, stockColumns = 0;
const timers = new Map();
const groupName = key => clusterGroups[key][settings.lang === "zh" ? 0 : 1];
const nodeAt = id => fixtures.find(node => node.name === id);
const scenarioNodes = () => fixtures.filter((node,index) =>
  !deleted.has(node.name) && (settings.scenario==="dense" || (settings.scenario==="sparse" && [0,1,7,8].includes(index))));
const visibleNodes = () => scenarioNodes().filter(node =>

const action = (label,key,attrs="") => `<button type="button" class="secondary-button" data-action="${key}" ${attrs}>${t(label)}</button>`;
const status = phase => `<span class="status ${phase==="Conflict"||phase==="Offline"?"bad":phase==="Retired"?"quiet":""}"><i></i>${t(phase)}</span>`;
const field = (label,value,wide=false) => `<div class="field${wide?" field-wide":""}"><dt>${t(label)}</dt><dd>${value}</dd></div>`;

function cameraFrame(node,index) {
  const state = node.cameras[index];
  const image = index===0 || index===2 ? visualSamples[0] : visualSamples[1];
  const available = state!=="absent" && state!=="noFrame";
  const caption = `<span class="frame-caption">${t(names[index])}${state==="normal"?"":`<span class="frame-note">${t(state)}</span>`}</span>`;
  return available
    ? `<button class="frame" type="button" data-camera="${node.name}/${index}" aria-haspopup="dialog" aria-label="${t(names[index])} · ${t(state)}"><img alt="" class="${state==="normal"?"":"stale"}" src="${image}">${caption}</button>`
    : `<div class="frame placeholder">${caption}</div>`;
}

function copyValue(label,value) {
  if (!value) return "—";
  return `<span class="copy-value"><code>${value}</code><button type="button" class="icon-button"
    data-copy-value="${value}" aria-label="${t("copyValue")} · ${t(label)}" title="${t("copyValue")}">${icon("copy")}</button></span>`;
}

function conditionRows(node) {
  const online = node.phase === "Bound";
  const conflict = node.phase === "Conflict";
  const seen = node.phase !== "Offline" && node.phase !== "Retired";
  const conditions = [
    ["Observed",seen?"True":"Unknown",seen?"NodeReported":"ReportStale",seen?"observationOk":"observationMissing"],
    ["IdentityMatched",conflict?"False":seen?"True":"Unknown",conflict?"UIDMismatch":seen?"Matched":"AwaitingReport",conflict?"conflictNote":seen?"uidOk":"observationMissing"],
    ["NetworkVerified",online?"True":conflict?"False":"Unknown",online?"ProbeSucceeded":conflict?"ProbeFailed":"AwaitingProbe",online?"probeOk":"probeMissing"],
    ["RLarkLinked",online?"True":conflict?"False":"Unknown",online?"LinkEstablished":conflict?"IdentityConflict":"AwaitingReport",online?"linkedOk":conflict?"conflictNote":"observationMissing"],
    ["Rebooted",node.reboots?"True":"Unknown",node.reboots?"BootTimeChanged":"NoRecentReboot",node.reboots?"rebootOk":"rebootMissing"],
  ].sort((a,b)=>Number(a[1]==="True")-Number(b[1]==="True")||a[0].localeCompare(b[0]));
  return `<ul class="condition-list">${conditions.map(([type,value,reason,message],index)=>`<li>
    <div><strong>${t(type)}</strong><small><code>${type}</code></small></div>
    <div class="condition-state"><span class="status quiet" data-value="${value}"><i></i>${value}</span>
      <small>${settings.lang==="zh"?[23,41,58,64,78][index]+" 秒前":[23,41,58,64,78][index]+"s ago"}</small></div>
    <small class="condition-note"><code>${reason}</code> · ${t(message)}</small>
  </li>`).join("")}</ul>`;
}

function cameraDiagnostics(node) {
  const issues = node.cameras?.flatMap((state,index)=>["stale","stalled","noFrame"].includes(state)
    ? [`<li><strong>${t(names[index])} · ${t(state)}</strong><small>${t({stale:"staleFrames",stalled:"resetCamera",noFrame:"checkFrames"}[state])}</small></li>`] : []);
  return issues?.length ? `<h4>${t("cameraDiagnostics")}</h4><ul class="detail-list">${issues.join("")}</ul>` : "";
}

function powerState(node) {
  if (node.actual==="off") return "off";
  return node.driver==="on" ? "ready" : "powered";
}

function details(node) {
  const conflict = node.phase==="Conflict";
  const retired = node.phase==="Retired";
  const admission = admitted.get(node.name) ?? node.admission;
  const hasAdmission = admission!=="unused";
  const clusterKnown = Boolean(clusterGroups[node.group]);
  const canDelete = retired || conflict || (!node.hasNode && node.phase!=="Bound");
  const disabledReasons = [
    ["remove",canDelete ? "" : node.hasNode ? "removeBlocked" : "stateBlocked"],
    ["reissue",clusterKnown ? "" : "noCluster"],
    ["revoke",!clusterKnown ? "noCluster" : hasAdmission ? "" : "noAdmission"],
  ];
  const recordedUID = copyValue("boundUID",node.uid);
  const reportedUID = copyValue("reportedUID",node.uid.replace("31bf7721","6418da82"));
  const online = node.phase==="Bound";
  const diag = conflict?"fault":online?"ok":"pending";
  const key = retired ? "" : "Yp79TQ2zWbd8Qv2nG02vFV7Qx7A0Wmc42A0546jT6gk=";
  const networkFields = [
    field("NetworkVerified",t(online?"verified":conflict?"failed":"unknown")),
    field("admissionStatus",t(admission)),
    field("wire",copyValue("wire",key),true),
    field("tunnel",copyValue("tunnel",hasAdmission?node.address+" / 32":""),true),
    field("issuer",hasAdmission?"admin":"—"),
    field("expires",hasAdmission?"2026-11-27 16:30":"—"),
    field("sshLogin",hasAdmission?`<code>admin@${node.address}:22</code>`:"—",true),
    field("sshFingerprint",copyValue("sshFingerprint",hasAdmission?"SHA256:8ZOcKVCUs2rJrBF6Kf5hJzwur0A4ckhlWZDcPsQSLWw":""),true),
    field("admissionReason",hasAdmission?t(conflict?"conflictNote":admission==="expired"?"expired":"used"):"—",true),
  ].join("");
  const links = retired ? `<p class="muted">${t("noLinks")}</p>` : `<p class="muted">${t("perHub")}</p>
    <ul class="detail-list"><li><strong>hub-${node.group}-01 · ${t(online?"connected":conflict?"unanswered":"silent")}</strong>
    <small>${t("since")} 2026-11-25 10:21 ${online?" · "+t("handshake")+" 10:24":""}</small></li></ul>`;
  return `<section class="detail" id="detail-${node.name}" data-detail="${node.name}" aria-labelledby="detail-title-${node.name}">
    <header class="detail-header">
      <div class="detail-title"><small>${t("nodeDetails")}</small>
        <div class="actions"><h3 id="detail-title-${node.name}" tabindex="-1">${node.name}</h3>${status(node.phase)}</div>
        <small>${node.cp?t("control")+" · ":""}UID ${node.uid.slice(0,8)}…${node.uid.slice(-4)}</small>
      </div>
      <div class="detail-actions">
        <div class="actions" role="group" aria-label="${t("recordActions")}">${
          [["reissue","reissue"],["revoke","revoke"],["remove","remove"]].map(([label,kind])=>{
            const reason = disabledReasons.find(([key])=>key===kind)[1];
            return action(label,kind,reason?`disabled aria-describedby="${kind}-reason-${node.name}"`:"");
          }).join("")}
        </div>
        ${disabledReasons.filter(([,reason])=>reason).map(([kind,reason])=>`<small id="${kind}-reason-${node.name}">${t(kind)} · ${t(reason)}</small>`).join("")}
      </div>
    </header>
    ${conflict ? `<div class="detail-conflict warning" role="note">${icon("alert")}
      <div><strong>${t("uidChanged")}</strong><p>${t("conflictNote")}</p>
        <dl class="detail-identifiers">${field("boundUID",recordedUID)}${field("reportedUID",reportedUID)}</dl></div>
    </div>` : ""}
    <div class="detail-grid">
      <section class="detail-column"><h4>${icon("fingerprint")}${t("identity")}</h4><dl>
        ${field("record",copyValue("record",node.name))}
        ${field("clusterName",groupName(node.group))}
        ${field("clusterID",copyValue("clusterID",node.namespace))}
        ${field("Node UID",copyValue("Node UID",node.uid))}
        ${field("System UUID",copyValue("System UUID",node.systemUUID))}
      </dl>${cameraDiagnostics(node)}</section>
      <section class="detail-column"><h4>${icon("key")}${t("networkAdmission")}</h4>
        <dl class="network-fields">${networkFields}</dl><h4>${t("links")}</h4>${links}
      </section>
      <section class="detail-column"><h4>${icon("list")}${t("conditions")}</h4>${conditionRows(node)}</section>
    </div>
    ${node.cameras ? `<section class="detail-power"><h4>${t("power")}</h4><dl>
      ${field("expected",t(node.desired))}
      ${field("actual",t(powerState(node)))}
      ${field("check",t(diag))}
      ${field("maintenance",t(conflict?"maintenance":"noMaintenance"))}
      </dl><div class="actions">${
        action("powerOn","setPowerOn")+action("driverOn","driverOn")+action("driverOff","driverOff")+action("powerOff","setPowerOff")
        +action("pose","pose",!online||powerState(node)!=="ready"?`disabled aria-describedby="pose-reason-${node.name}"`:"")
      }</div>${!online||powerState(node)!=="ready"?`<small id="pose-reason-${node.name}">${t("poseBlocked")}</small>`:""}</section>
      <section class="detail-cameras" aria-labelledby="live-cameras-${node.name}">
      <div class="section-head"><h4 id="live-cameras-${node.name}">${icon("image")}${t("liveCameras")}</h4>
        <span class="muted" data-camera-mode="${node.name}" data-live>${t("live")}</span>
      </div>
      <div class="detail-camera-grid">${node.cameras.map((_,index)=>cameraFrame(node,index)).join("")}</div>
    </section>` : ""}
  </section>`;
}

function expander(node) {
  const expanded = open.has(node.name);
  return action(expanded?"fold":"expand","expand",
    `id="exp-${node.name}" data-node="${node.name}" aria-expanded="${expanded}" aria-controls="detail-${node.name}"`);
}

function card(node) {
  const expanded = open.has(node.name);
  const robot = Boolean(node.cameras);
  const network = {Bound:"verified",Offline:"unknown",Conflict:"failed",Retired:"unknown"}[node.phase];
  const admission = admitted.get(node.name) ?? node.admission;
  const diag = node.phase==="Conflict"?"fault":node.phase==="Offline"?"pending":"ok";
  return `<article class="card ${robot?"feature":"stock"} ${expanded?"open":""} ${selected.has(node.name)?"selected":""}" data-card="${node.name}">
    <header class="identity">
      ${robot?`<input type="checkbox" aria-label="${t("selected")} ${node.name}" data-pick="${node.name}" ${selected.has(node.name)?"checked":""}>`:""}
      <div class="node-title"><h3>${node.name}</h3><small>${node.cp?t("control")+" · ":""}${robot?"S1U":"x86_64"} · UID ${node.uid.slice(-8)}</small></div>
      ${status(node.phase)}
    </header>
    <div class="robot-state"><div class="robot-meta"><span class="${network==="failed"?"warning":"muted"}">${t(network)}</span><span class="muted">${t(admission)}</span></div>
      ${robot?`<div class="robot-track"><span>${t("expected")} <strong>${t(node.desired)}</strong> / ${t("actual")} <strong>${t(node.actual)}</strong></span>
        <span class="${diag==="fault"?"warning":""}">${t("check")} ${t(diag)}${diag==="fault"?" · "+t("maintenance"):""}</span></div>`:""}
    </div>
    ${robot?`<div class="cameras ${settings.cameraLayout}">${node.cameras.map((_,i)=>cameraFrame(node,i)).join("")}</div>
      <div class="camera-line"><span>${t("cameras")}</span><span data-camera-mode="${node.name}">${t("slow")}</span></div>`:""}
    <dl class="facts">${field("uptime",node.phase==="Bound"?(settings.lang==="zh"?"4 天 22 小时":"4d 22h"):"—")}
      ${field("reboots",node.reboots)}${field("seen",settings.lang==="zh"?"23 秒前":"23s ago")}</dl>
    <footer class="footer">${robot?`<div class="actions">${action(node.actual==="off"?"powerOn":"powerOff","power",`data-node="${node.name}"`)}
      ${action("pose","pose",`data-node="${node.name}"`+' '+(node.actual==="off"||node.phase!=="Bound"?`disabled title="${t(node.phase!=="Bound"?node.phase:"off")}"`:""))}</div>`:""}${expander(node)}</footer>
    ${expanded?"":`<div id="detail-${node.name}" hidden></div>`}
  </article>`;
}

function rows(nodes, robot) {
  const columns = robot ? featureColumns : stockColumns;
  let html = "";
  for (let i=0;i<nodes.length;i+=columns) {
    const row = nodes.slice(i,i+columns);
    html += `<div class="card-row ${robot?"feature-row":"stock-row"}" style="--columns:${columns}">${row.map(card).join("")}</div>`;
    html+=row.filter(node=>open.has(node.name)).map(details).join("");
  }
  return html;
}

function robotGroup(key,nodes) {
  const robots = nodes.filter(node=>node.cameras);
  const chosen = robots.filter(node=>selected.has(node.name));
  const batchAttrs = `data-group="${key}"`;
  return `<section class="group">
    <header class="section-head"><div class="group-heading"><h2>${groupName(key)}</h2><small>${t("robot")} · rlark-${key}</small></div><span class="muted">${robots.length} ${t("robots")}</span></header>
    ${nodes.filter(node=>!node.cameras).map(node=>`<div class="control-plane" data-card="${node.name}">
      <div class="node-title"><h3>${node.name}</h3><small>${t("control")} · UID ${node.uid.slice(-8)}</small></div>
      ${status(node.phase)}${expander(node)}${open.has(node.name)?"":`<div id="detail-${node.name}" hidden></div>`}</div>
      ${open.has(node.name)?details(node):""}`).join("")}
    ${robots.length?`<div class="batch"><label><input type="checkbox" data-select-group="${key}" ${chosen.length===robots.length?"checked":""}>${t("chooseAll")}</label>
      ${chosen.length?`<div class="actions batch-tools"><strong>${t("selected")} ${chosen.length}</strong>
        ${action("powerOn","batchOn",batchAttrs)}${action("powerOff","batchOff",batchAttrs)}
        ${action("pose","batchPose",batchAttrs+(chosen.some(node=>node.actual==="off"||node.phase!=="Bound")?` disabled title="${t("poseBlocked")}"`:""))}</div>`:""}</div>`:""}
    <div class="card-list">${rows(robots,true)}</div>
  </section>`;
}

function render() {
  document.documentElement.classList.toggle("theme-dark",settings.theme==="dark");
  document.documentElement.lang=settings.lang==="zh"?"zh-CN":"en";
  $$("[data-copy]").forEach(el=>el.textContent=t(el.dataset.copy));
  $$("[data-theme],[data-lang]").forEach(el=>{
    const key=el.hasAttribute("data-theme")?"theme":"lang";
    const active=settings[key]===el.dataset[key];
    el.classList.toggle("active",active);
    el.setAttribute("aria-pressed",active);
    if(key==="theme") el.textContent=t(el.dataset.theme);
  });
  $("#search").placeholder=t("search");
  $("#search").setAttribute("aria-label",t("search"));
  const data=scenarioNodes();
  const list=visibleNodes();
  $("#phase").innerHTML=["all","Bound","Offline","Conflict","Retired"].map(key=>
    `<option value="${key}">${t(key)} · ${data.filter(node=>key==="all"||node.phase===key).length}</option>`).join("");
  $("#phase").value=statusFilter;
  $("#phase").setAttribute("aria-label",t("all"));
  $("#cluster").innerHTML=`<option value="">${t("allClusters")}</option>`+Object.keys(clusterGroups).map(key=>
    `<option value="${key}">${groupName(key)}</option>`).join("");
  $("#cluster").value=clusterFilter;
  $("#cluster").setAttribute("aria-label",t("allClusters"));
  $("#count").textContent=`${list.length} ${t("records")}`;
  $("#groups").innerHTML=Object.keys(clusterGroups).map(key=>{
    const nodes=list.filter(node=>node.group===key);
    if(!nodes.length) return "";
    if(key!=="edge") return robotGroup(key,nodes);
    return `<section class="group"><header class="section-head"><div class="group-heading"><h2>${groupName(key)}</h2>
      <small>${t("stock")} · rlark-${key}</small></div><span class="muted">${nodes.length} ${t("records")}</span></header>
      <div class="card-list">${rows(nodes,false)}</div></section>`;
  }).join("") || `<div class="empty">${t("empty")}</div>`;
  $$("[data-select-group]").forEach(input=>{
    const group=list.filter(node=>node.group===input.dataset.selectGroup&&node.cameras);
    input.indeterminate=group.some(node=>selected.has(node.name))&&!input.checked;
  });
  const issued=data.filter(node=>node.cameras);
  $("#ledger-title").textContent=`${t("ledger")} · ${issued.length}`;
  $("#records").innerHTML=issued.map(node=>`<div class="ledger-row"><strong>${node.name}</strong><span>${groupName(node.group)}</span><small>${t(admitted.get(node.name)??node.admission)}</small></div>`).join("")||`<p class="muted">${t("noRecords")}</p>`;
  $("#review-controls").innerHTML=Object.entries(options).map(([key,values])=>
    `<label><small>${t(key)}</small><select data-setting="${key}">${values.map(value=>
      `<option value="${value}" ${settings[key]===value?"selected":""}>${key==="lang"?(value==="zh"?"中文":"English"):t(value==="empty"?"zero":value)}</option>`).join("")}</select></label>`).join("");
  measure();
}

function showToast(message) {
  const toast=$("#toast");
  toast.textContent=message;
  toast.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.hidden=true,1900);
}

function changeExpansion(id,collapse=false) {
  const trigger=document.getElementById("exp-"+id);
  const card=trigger.closest("[data-card]");
  const previous=card.getBoundingClientRect().top;
  if(collapse||open.has(id)) open.delete(id);
  else {
    open.clear();
    open.add(id);
  }
  render();
  const next=document.getElementById("exp-"+id);
  const nextCard=next.closest("[data-card]");
  window.scrollBy(0,nextCard.getBoundingClientRect().top-previous);
  // Escape should bring the restored focus into view, even from deep inside a panel.
  if(!open.has(id)) {
    next.focus({preventScroll:true});
    const rect=next.getBoundingClientRect();
    if(rect.top<76) window.scrollBy(0,rect.top-80);
    else if(rect.bottom>innerHeight-8) window.scrollBy(0,rect.bottom-innerHeight+12);
  }
  anchorShift=Math.round(nextCard.getBoundingClientRect().top-previous);
  if (open.has(id)) {
    const heading=document.getElementById("detail-title-"+id);
    heading.focus({preventScroll:true});
    const rect=heading.getBoundingClientRect();
    if (rect.top<84 || rect.bottom>innerHeight-24) window.scrollBy(0,rect.top-96);
  }
  measure();
}

function showCamera(button) {
  const [id,index]=button.dataset.camera.split("/");
  const node=nodeAt(id);
  const dialog=$("#camera-dialog");
  dialogControl=button;
  dialog.setAttribute("aria-labelledby","camera-title");
  dialog.innerHTML=`<div class="section-head"><h2 id="camera-title">${node.name} · ${t(names[index])}</h2>
    <button class="icon-button" aria-label="${t("close")}" data-action="close">×</button></div>
    <img alt="${t(names[index])}" src="${visualSamples[Number(index)%2]}"><p class="muted">${t(node.cameras[index])} · ${t("demo")}</p>`;
  dialog.showModal();
}
$("#camera-dialog").addEventListener("close",()=>dialogControl?.focus());

function applyDefaultExpansion() {
  open.clear();
  if (settings.defaultExpandNonRobot==="enabled") {
    scenarioNodes().filter(node=>!node.cameras).forEach(node=>open.add(node.name));
  }
}

function updateSetting(key,value) {
  settings[key]=value;
  if(key==="scenario") { open.clear();selected.clear();deleted.clear();admitted.clear();frameRequests=0;reportRequests=0;timers.clear(); }
  if(key==="scenario"||key==="defaultExpandNonRobot") applyDefaultExpansion();
  const url=new URL(location.href);
  url.searchParams.set(key,value);
  history.replaceState(null,"",url);
  render();
}

document.addEventListener("click",async event=>{
  const control=event.target.closest("button,a");
  if(!control) return;
  if(control.hasAttribute("data-demo")) {event.preventDefault();showToast(t("demo"));return;}
  if(control.dataset.theme||control.dataset.lang) {
    const key=control.dataset.theme?"theme":"lang";
    updateSetting(key,control.dataset[key]);
    return;
  }
  if (control.dataset.copyValue) {
    try {
      await navigator.clipboard.writeText(control.dataset.copyValue);
      showToast(t("copied"));
    } catch {
      showToast(t("copyFailed"));
    }
    return;
  }
  if(control.dataset.camera) {showCamera(control);return;}
  const detail=control.closest("[data-detail]");
  const id=control.dataset.node||detail?.dataset.detail;
  const node=nodeAt(id);
  switch(control.dataset.action||control.id) {
    case "expand": changeExpansion(id);break;
    case "close": $("#camera-dialog").close();break;
    case "refresh": render();showToast(t("refreshed"));break;
    case "sidebar-toggle": {
      const collapsed=document.body.classList.toggle("sidebar-collapsed");
      control.setAttribute("aria-expanded",!collapsed);
      control.setAttribute("aria-label",t(collapsed?"expandSide":"collapse"));
      break;
    }
    case "notifications": showToast(t("notifications"));break;
    case "join": showToast(t("demo"));break;
    case "setPowerOn":
    case "setPowerOff":
    case "driverOn":
    case "driverOff":
    case "power":
    case "pose":
    case "batchOn":
    case "batchOff":
    case "batchPose":
    case "reissue":
    case "revoke":
    case "remove": {
      if(!confirm(t("confirm"))) break;
      const key=control.dataset.action;
      const group=control.dataset.group;
      const targets=group?visibleNodes().filter(item=>item.group===group&&selected.has(item.name)):[node];
      if (key==="setPowerOn" || (key==="power" && node.actual==="off")) {
        node.actual="on";
        if (node.desired==="off") node.desired="powered";
        node.driver=node.desired==="ready"?"on":"off";
      }
      else if (key==="setPowerOff" || key==="power") {
        node.actual=node.desired="off";
        node.driver="off";
      }
      if (key==="driverOn") {
        node.actual="on";
        node.desired="ready";
        node.driver="on";
      }
      if (key==="driverOff") {
        node.driver="off";
        if (node.desired!=="off") node.desired="powered";
      }
      if(key==="batchOn"||key==="batchOff") targets.forEach(item=>{
        item.actual=key==="batchOn"?"on":"off";
        if (key==="batchOff") item.desired="off";
        else if (item.desired==="off") item.desired="powered";
        item.driver=item.desired==="ready"?"on":"off";
      });
      if(key==="reissue"||key==="revoke") admitted.set(id,key==="reissue"?"used":"expired");
      if(key==="remove") {deleted.add(id);open.delete(id);}
      render();
      if (key==="remove") $("#search").focus({preventScroll:true});
      if (detail && key !== "remove") {
        document.getElementById("detail-"+id)?.querySelector('[data-action="'+key+'"]')?.focus({preventScroll:true});
      }
      showToast(t("simulated"));break;
    }
  }
});

document.addEventListener("keydown",event=>{
  if($("#camera-dialog").open) return;
  const owner=event.target.closest("[data-detail],[data-card]");
  if(event.key==="Escape"&&owner) {
    const id=owner.dataset.detail||owner.dataset.card;
    if(open.has(id)) {event.preventDefault();changeExpansion(id,true);}
  }

});

document.addEventListener("change",event=>{
  const el=event.target;
  if(el.dataset.setting) {updateSetting(el.dataset.setting,el.value);$("#review-controls [data-setting="+el.dataset.setting+"]").focus();return;}
  if(el.id==="phase") {statusFilter=el.value;render();return;}
  if(el.id==="cluster") {clusterFilter=el.value;render();return;}
  const wasChecked=el.checked;
  if(el.dataset.pick) {
    const id=el.dataset.pick;
    if(wasChecked) selected.add(id);else selected.delete(id);
    render();$('[data-pick="'+id+'"]').focus({preventScroll:true});
  }
  if(el.dataset.selectGroup) {
    const key=el.dataset.selectGroup;
    visibleNodes().filter(node=>node.group===key&&node.cameras).forEach(node=>{
      if(wasChecked) selected.add(node.name);else selected.delete(node.name);
    });
    render();$('[data-select-group="'+key+'"]').focus({preventScroll:true});
  }
});
$("#search").addEventListener("input",event=>{search=event.target.value;render();});

function cameraPlan() {
  const plan = new Map();
  const surfaces = $$("[data-camera-mode]").map(label=>{
    const node = nodeAt(label.dataset.cameraMode);
    const live = label.hasAttribute("data-live");
    const wall = live ? label.parentElement.nextElementSibling : label.parentElement.previousElementSibling;
    const bounds = wall.getBoundingClientRect();
    const visible = !document.hidden && bounds.bottom > 72 && bounds.top < innerHeight;
    return {label,node,live,visible};
  });
  for (const {node,live,visible} of surfaces) {
    if (!visible || (!live && plan.has(node.name))) continue;
    const frames = node.cameras.filter(state=>state!=="noFrame" && state!=="absent").length;
    plan.set(node.name, {node,frames,live});
  }
  for (const {label,node,live,visible} of surfaces) {
    const active = visible && plan.get(node.name)?.live === live;
    const copy = t(active ? (live ? "live" : "slow") : "paused");
    if (label.textContent !== copy) label.textContent = copy;
    label.classList.toggle("live", live && active);
  }
  return [...plan.values()];
}

function measure(plan=cameraPlan()) {
  let delta=0,gap=0;
  for(const row of $$(".card-row")) {
    const footers=[...row.children].map(card=>card.querySelector(".footer").getBoundingClientRect());
    if(footers.length>1) delta=Math.max(delta,Math.max(...footers.map(f=>f.bottom))-Math.min(...footers.map(f=>f.bottom)));
    [...row.children].forEach((card,index)=>{
      const end=card.querySelector(".footer").previousElementSibling.getBoundingClientRect().bottom;
      gap=Math.max(gap,footers[index].top-end);
    });
  }
  const heights=selector=>[...new Set($$(selector).map(card=>Math.round(card.getBoundingClientRect().height)))].sort((a,b)=>a-b).join(" / ")||"—";
  const feature=heights(".feature"), compact=heights(".stock"), blank=Math.round(gap), baseline=Math.round(delta);
  const projectedFrames=plan.reduce((sum,item)=>sum+item.frames*(item.live?300:12),0);
  const projectedReports=30*plan.filter(item=>item.live).length;
  $("#metrics").innerHTML=`<p><strong>${t("heights")}</strong> · ${t("robots")} ${feature} px · ${t("compact")} ${compact} px</p>
    <p>${t("delta")} ${baseline} px · ${t("gap")} ${blank} px</p>
    <p>${t("drift")} ${anchorShift??"—"} px</p>
    <p>${t("requests")} ${frameRequests} ${t("snapshots")} / ${reportRequests} ${t("reports")}</p>
    <p>${t("perMinute")} ${projectedFrames} ${t("snapshots")} / ${projectedReports} ${t("reports")}</p>
    <p class="muted">${t("metricNote")}</p>`;
  return {feature,compact,baseline,blank,anchorShift,frameRequests,reportRequests,projectedFrames,projectedReports};
}

function dispatchSimulatedCameras() {
  const now=performance.now();
  const plan=cameraPlan();
  const active=new Set(plan.map(item=>item.node.name));
  for(const id of timers.keys()) if(!active.has(id)) timers.delete(id);
  for(const {node,frames,live} of plan) {
    const saved=timers.get(node.name);
    const due=saved?.live===live?saved:{frame:now,report:now,live};
    if(frames&&now>=due.frame) {frameRequests+=frames;due.frame=now+(live?200:5000);}
    if(live&&now>=due.report) {reportRequests++;due.report=now+2000;}
    timers.set(node.name,due);
  }
  if($("#review").open) measure(plan);
}

function resizeRows() {
  const width=$("#groups").clientWidth;
  const feature=Math.max(1,Math.floor((width+12)/372));
  const stock=Math.max(1,Math.floor((width+12)/290));
  if(feature===featureColumns&&stock===stockColumns) return;
  featureColumns=feature;
  stockColumns=stock;
  render();
}
applyDefaultExpansion();
new ResizeObserver(resizeRows).observe($("#groups"));
resizeRows();
$("#review").addEventListener("toggle",()=>{if($("#review").open) measure();});
document.addEventListener("visibilitychange",dispatchSimulatedCameras);
setInterval(dispatchSimulatedCameras,50);
</script>
</body>
