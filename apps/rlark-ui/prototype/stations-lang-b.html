function roomArt(view,robotIndex){const palette=[['#c9d4d0','#73847e','#485a56','#dbd2bb'],['#d4cdc1','#8c8172','#53534c','#c3d8d6'],['#cad0d6','#77828c','#424e59','#dbc8ad'],['#c9d4d0','#73847e','#485a56','#dbd2bb']][robotIndex];return `<svg viewBox="0 0 640 360" role="img" aria-label="${t(view)} · ${t('cameraPreview')}"><rect width="640" height="360" fill="${palette[0]}"/><path d="M0 0h640v210L320 152 0 210z" fill="${palette[1]}"/><path d="M0 210 320 152l320 58v150H0z" fill="${palette[2]}"/><path d="M0 214 320 158l320 56" fill="none" stroke="#edf0e8" stroke-opacity=".58" stroke-width="5"/><path d="M70 40h176v90H70z" fill="#e8e5d9" opacity=".82"/><path d="M80 51h156v66H80z" fill="${palette[3]}"/><path d="M360 202h174v20H360zM379 222v70m137-70v70" stroke="#d4c5a8" stroke-width="12"/><path d="M424 194v-42a35 35 0 0 1 70 0v42m-85 2h100v75H409z" fill="#d9ddd6" stroke="#313a3b" stroke-width="8"/><circle cx="459" cy="152" r="6" fill="#263638"/><path d="M430 270v56m58-56v56m-75 0h92" fill="none" stroke="#252e31" stroke-width="10" stroke-linecap="round"/><path d="M409 217h-28v34m100-34h28v34" fill="none" stroke="#303a3c" stroke-width="8"/><circle cx="382" cy="254" r="9" fill="#bf8960"/><circle cx="510" cy="254" r="9" fill="#bf8960"/><path d="M17 17h90v27H17z" fill="#17211f" fill-opacity=".66"/><text x="28" y="36" fill="#f3f3ed" font-size="15" font-family="system-ui">${t(view)}</text></svg>`}
function status(label,tone){
  return `<span class="status ${tone}">${label}</span>`;
}
function facts(pairs){
  return `<div class="row-facts">${pairs.map(([key,value])=>`<div><small>${t(key)}</small><strong>${value}</strong></div>`).join('')}</div>`;
}
function details(pairs){
  return `<dl>${pairs.map(([key,value])=>`<div><dt>${t(key)}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
}
function controls(id, actions){
  return actions.map(action=>`<button data-act="${action}" data-id="${id}">${t(action==='remove-stock'?'remove':action)}</button>`).join('');
}
function detailTrigger(id,name){
  return `<button class="row-name" data-act="expand" data-id="${id}" aria-controls="detail-${id}" aria-expanded="false" aria-label="${name} · ${t('open')}">${name} <span aria-hidden="true">⌄</span></button>`;
}
function currentSearch(){
  return document.getElementById('search').value.trim().toLowerCase();
}
function renderRobots(){
  const query=currentSearch();
  const type=document.getElementById('filter').value;
  const filtered=robotData.filter(robot=>robot.name.includes(query)&&(type==='all'||type==='robot'));
  const locale=lang==='zh'?0:1;
  document.getElementById('robotRows').innerHTML=filtered.length?filtered.map(robot=>{
    const {id,name,cameras}=robot;
    const state=[['desired',t(robot.desired)],['actual',t(robot.actual)],['selfCheck',t(robot.self)]];
    const measurements=[['runtime',robot.runtime[locale]],['restarts',robot.restarts],['lastReported',robot.reported[locale]],['uid',robot.uid]];
    const [view,cameraState]=cameras[0];
    return `<div class="robot-wrap">
      <div class="row" data-id="${id}">
        <button class="thumb" data-camera="${id}" aria-label="${name} · ${t(view)} · ${t(cameraState)}">${roomArt(view,robotData.indexOf(robot))}</button>
        <div class="row-main">
          ${detailTrigger(id,name)}
          ${status(t(robot.status),robot.tone)}
          ${cameraState==='recoveringStep'?`<p class="row-sub">${t(view)} · ${t(cameraState)}</p>`:''}
        </div>
        ${facts(measurements)}
        <div class="row-actions">${controls(id,['power','drive','home'])}</div>
      </div>
      <div class="detail" id="detail-${id}" hidden>
        <section><h3>${t('details')}</h3>${details(state)}</section>
        <section>
          <h3>${t('camera')}</h3>
          <div class="camera-list">${cameras.map(([view,state],index)=>`<button data-view="${id}:${index}" ${state==='notInstalled'?'disabled':''}>${status(t(view)+' · '+t(state),state==='normal'?'good':state==='recoveringStep'?'warn':'neutral')}</button>`).join('')}</div>
          ${id==='r1'?`<p class="row-sub">${t('homeBlocked')}</p>`:''}
        </section>
      </div>
    </div>`;
  }).join(''):`<div class="state">${t('noMatches')}</div>`;
}
function renderStocks(){
  const query=currentSearch();
  const type=document.getElementById('filter').value;
  const filtered=stockData.filter(node=>node.name.includes(query)&&(type==='all'||type==='node'&&node.kind==='ordinary'||type==='control'&&node.kind==='controlNode'));
  document.getElementById('stockRows').innerHTML=filtered.length?filtered.map(node=>{
    const {name,kind,uid}=node;
    return `<div>
      <div class="row">
        <div class="thumb"><svg viewBox="0 0 320 180" aria-hidden="true"><rect width="320" height="180" fill="#cbd1cc"/><path d="M0 128 320 78v102H0z" fill="#717a74"/><path d="M104 25h112v132H104z" fill="#303a3c"/><path d="M116 37h88v108h-88z" fill="#687579"/><path d="M124 47h72v16h-72zm0 28h72v16h-72zm0 28h72v16h-72" fill="#aab4ac"/><circle cx="184" cy="55" r="3" fill="#76c48d"/><circle cx="184" cy="83" r="3" fill="#76c48d"/><circle cx="184" cy="111" r="3" fill="#76c48d"/></svg></div>
        <div class="row-main">
          ${detailTrigger(name,name)}
          ${status(t('verified'), 'good')}
          <p class="row-sub">${t(kind)} · ${t('unusedCode')}</p>
        </div>
        ${facts([['runtime',lang==='zh'?'14 天 21 小时':'14 d 21 h'],['lastReported',lang==='zh'?'2 秒前':'2 sec ago'],['uid',uid]])}
        <div class="row-actions">${controls(name,['remove-stock'])}</div>
      </div>
      <div class="detail" id="detail-${name}" hidden><section><h3>${t('details')}</h3>${details([['nodeType',t(kind)],['state',t('verifiedUnused')]])}</section></div>
    </div>`;
  }).join(''):`<div class="state">${t('noMatches')}</div>`;
}
function renderRecords(){document.getElementById('recordRows').innerHTML=records.map(r=>`<div class="record-row"><div><span class="label">${t('node')}</span><strong>${r.name}</strong></div><div><span class="label">${t('cluster')}</span>${t('robotCluster')} · rlark-robot-s1u-01</div><div><span class="label">${t('issuer')}</span><small>operator</small></div><div><span class="label">${t('date')}</span>${r.date}</div><div><span class="label">${t('state')}</span><span class="status good">${t('used')}</span></div></div>`).join('')}
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.title=`${t('title')} · RLark`;
  document.querySelectorAll('[data-i]').forEach(element=>{element.textContent=t(element.dataset.i)});
  document.querySelector('.tabs').setAttribute('aria-label',lang==='zh'?'场站分区':'Station sections');
  document.getElementById('search').placeholder=t('search');
  document.getElementById('search').setAttribute('aria-label',t('search'));
  document.getElementById('filter').setAttribute('aria-label',t('nodeType'));
  document.getElementById('lang').textContent=lang==='zh'?'EN':'中文';
  document.getElementById('theme').setAttribute('aria-label',t('theme'));
  document.getElementById('lightbox').setAttribute('aria-label',t('cameraPreview'));
  document.getElementById('closeLightbox').setAttribute('aria-label',t('closeDialog'));
  renderRobots();
  renderStocks();
  renderRecords();
}
let toastTimer;
function toast(title,body=''){
  const element=document.getElementById('toast');
  element.innerHTML=`<strong>${title}</strong>${body?`<span>${body}</span>`:''}`;
  element.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{element.hidden=true},2600);
}
const confirmDialog=document.getElementById('confirm');
const lightbox=document.getElementById('lightbox');
const closeLightbox=document.getElementById('closeLightbox');
const cancelConfirm=document.getElementById('confirmCancel');
function setDialog(dialog,open){
  dialog.hidden=!open;
  document.getElementById('top').inert=open;
  document.getElementById('shell').inert=open;
  if(!open&&lastFocus?.isConnected)lastFocus.focus();
}
function ask(title,text,action,trigger){
  lastFocus=trigger;
  confirmAction=action;
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmText').textContent=text;
  setDialog(confirmDialog,true);
  cancelConfirm.focus();
}
function openCamera(id,index,trigger){
  const robot=robotData.find(item=>item.id===id);
  const [view,state]=robot.cameras[index];
  lastFocus=trigger;
  document.getElementById('lightboxArt').innerHTML=roomArt(view,robotData.indexOf(robot));
  document.getElementById('lightboxCaption').textContent=`${robot.name} · ${t(view)} · ${t(state)}`;
  setDialog(lightbox,true);
  closeLightbox.focus();
}
let expanded=null;
function setDetails(trigger,open){
  document.getElementById(trigger.getAttribute('aria-controls')).hidden=!open;
  trigger.setAttribute('aria-expanded',String(open));
  trigger.setAttribute('aria-label',`${trigger.textContent.trim().replace(/ ⌄$/,'')} · ${t(open?'close':'open')}`);
  expanded=open?trigger:null;
}
document.addEventListener('click',event=>{
  const camera=event.target.closest('[data-camera],[data-view]');
  if(camera){
    const [id,index='0']=(camera.dataset.camera||camera.dataset.view).split(':');
    openCamera(id,Number(index),camera);
    return;
  }
  const button=event.target.closest('[data-act]');
  if(!button)return;
  const {id,act}=button.dataset;
  const name=robotData.find(robot=>robot.id===id)?.name||id;
  if(act==='expand'){
    const open=button.getAttribute('aria-expanded')!=='true';
    if(expanded?.isConnected)setDetails(expanded,false);
    if(open)setDetails(button,true);
  }else if(act==='power'||act==='drive'){
    ask(t(act==='power'?'powerAsk':'driveAsk'),name,()=>toast(t(act==='power'?'powerDone':'driveDone')),button);
  }else if(act==='home'&&event.detail===0){
    toast(t(id==='r1'?'homeBlocked':'homeShort'));
  }else if(act==='remove-stock'){
    ask(t('remove'),name,()=>toast(t('removed')),button);
  }
});
let hold=null;
function startHold(button){
  if(hold)return;
  hold={button,sent:false};
  if(button.dataset.id==='r1')return;
  hold.timer=setTimeout(()=>{
    hold.sent=true;
    toast(t('homeDone'));
  },850);
}
function endHold(showHint){
  if(!hold)return;
  clearTimeout(hold.timer);
  if(showHint&&!hold.sent)toast(t(hold.button.dataset.id==='r1'?'homeBlocked':'homeShort'));
  hold=null;
}
document.addEventListener('pointerdown',event=>{
  const button=event.target.closest('[data-act=home]');
  if(button&&event.button===0)startHold(button);
});
document.addEventListener('pointerup',event=>endHold(hold?.button.contains(event.target)));
document.addEventListener('pointercancel',()=>endHold(false));
window.addEventListener('blur',()=>endHold(false));
document.addEventListener('focusout',event=>{if(event.target===hold?.button)endHold(false)});
document.addEventListener('keydown',event=>{
  if(event.code==='Space'&&event.target.matches('[data-act=home]')){
    event.preventDefault();
    if(!event.repeat)startHold(event.target);
  }
  if(event.key==='Escape'){
    if(!lightbox.hidden)setDialog(lightbox,false);
    else if(!confirmDialog.hidden)cancelConfirm.click();
    else if(expanded?.isConnected){
      expanded.focus();
      setDetails(expanded,false);
    }
  }
  if(event.key==='Tab'&&(!lightbox.hidden||!confirmDialog.hidden)){
    const buttons=[...(!lightbox.hidden?lightbox:confirmDialog).querySelectorAll('button')];
    const boundary=event.shiftKey?buttons[0]:buttons.at(-1);
    if(document.activeElement===boundary){
      event.preventDefault();
      (event.shiftKey?buttons.at(-1):buttons[0]).focus();
    }
  }
});
document.addEventListener('keyup',event=>{
  if(event.code==='Space'&&event.target===hold?.button){
    event.preventDefault();
    endHold(true);
  }
});
document.getElementById('confirmOk').onclick=()=>{
  const action=confirmAction;
  cancelConfirm.click();
  action?.();
};
cancelConfirm.onclick=()=>{
  confirmAction=null;
  setDialog(confirmDialog,false);
};
closeLightbox.onclick=()=>setDialog(lightbox,false);
lightbox.onclick=event=>{if(event.target===lightbox)closeLightbox.click()};
document.querySelectorAll('.tabs button').forEach((button,index)=>button.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(tab=>tab.setAttribute('aria-selected',String(tab===button)));
  document.querySelectorAll('.cluster,.records')[index].scrollIntoView({behavior:'smooth',block:'start'});
});
document.getElementById('lang').onclick=()=>{
  lang=lang==='zh'?'en':'zh';
  applyLang();
};
document.getElementById('theme').onclick=()=>{
  const root=document.documentElement;
  root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
  document.getElementById('theme').textContent=root.dataset.theme==='dark'?'☀':'☾';
};
function renderNodes(){
  renderRobots();
  renderStocks();
}
document.getElementById('search').oninput=renderNodes;
document.getElementById('filter').onchange=renderNodes;
document.getElementById('refresh').onclick=()=>toast(t('refreshed'));
document.getElementById('join').onclick=()=>toast(t('added'),t('joinHelp'));
document.getElementById('allRecords').onclick=event=>{
  event.preventDefault();
  document.getElementById('records-title').focus();
};
document.querySelector('[data-entry=conflicts]').onclick=()=>toast(t('conflicts'),t('noConflicts'));
document.querySelector('[data-entry=remove]').onclick=event=>ask(t('remove'),'alexfu',()=>toast(t('removed')),event.currentTarget);
applyLang();
</script></body></html>
