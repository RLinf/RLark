<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>场站节点 · RLark</title>
<style>
:root {
  --ink:#1d1d1f; --ink-2:#3a3a3c; --muted:#6e6e73; --soft:#a1a1a6;
  --line:#e4e4e0; --line-strong:#dadad6; --panel:#fff; --panel-2:#f0f0ee;
  --canvas:#f7f7f5; --sunken:#f2f2f0; --blue:#5b4bc4; --blue-bg:#f1eefb;
  --green:#3e9a5c; --green-soft:#e0f1e5; --green-ink:#2c6b41;
  --red:#c8463b; --danger:#a3332a; --danger-soft:#fbe2de; --orange:#d59b2d;
  --amber-bg:#fbeed2; --amber-ink:#8a5a0b; --info:#4f82b8; --info-bg:#e2ecf6;
  --info-ink:#2f5c8a; --shadow-soft:0 1px 2px rgba(29,29,31,.05);
  font:14px/1.45 Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); background:var(--canvas);
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --ink:#f2f2ef; --ink-2:#c9c9c4; --muted:#9a9a93; --soft:#6e6e68;
  --line:#34342f; --line-strong:#46463f; --panel:#1c1c1a; --panel-2:#242422;
  --canvas:#141413; --sunken:#171716; --blue:#b9a6ff; --blue-bg:#2b2540;
  --green:#6fbf8b; --green-soft:#1d3327; --green-ink:#9bd9b1;
  --red:#e0796e; --danger:#f08a80; --danger-soft:#3a211f; --orange:#e0b15a;
  --amber-bg:#332a18; --amber-ink:#f0cc8c; --info:#86addd; --info-bg:#1d2a38;
  --info-ink:#b7d0ee; --shadow-soft:0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing:border-box; }
body, h1, h2, h3, h4, p, dl, dd { margin:0; }
button, input, select { font:inherit; color:inherit; }
button, select { cursor:pointer; }
button:disabled { cursor:default; color:var(--muted); }
:focus-visible, .search:focus-within { outline:2px solid var(--blue); outline-offset:2px; }
[hidden] { display:none !important; }
svg { width:16px; height:16px; flex:none; vertical-align:middle; }
small, .muted { color:var(--muted); }
.viewport { margin:auto; container:viewport / inline-size; }
.viewport[data-width="2000"] { max-width:2000px; }
.viewport[data-width="1440"] { max-width:1440px; }
.viewport[data-width="390"] { max-width:390px; }
.viewport:not([data-width="auto"]) { box-shadow:0 0 0 1px var(--line); }
.topbar { border-bottom:1px solid var(--line); background:var(--panel); }
.topbar-inner, .page-content { padding-inline:24px; }
.topbar-row {
  max-width:1480px; min-height:68px; margin:auto; display:flex; align-items:center;
  gap:8px; justify-content:space-between;
}
.eyebrow { display:block; color:var(--muted); font-size:11px; font-weight:650; }
h1 { font-size:20px; font-weight:750; letter-spacing:-.025em; }
.preview-controls, .segments { display:flex; align-items:center; gap:4px; }
.segments { padding:3px; border:1px solid var(--line); border-radius:10px; background:var(--sunken); }
.segments button {
  min-height:28px; padding:0 8px; border:1px solid transparent; border-radius:7px;
  background:transparent; color:var(--muted); font-size:12px; white-space:nowrap;
}
.segments button[aria-pressed="true"] {
  color:var(--ink); background:var(--panel); border-color:var(--line); box-shadow:var(--shadow-soft); font-weight:650;
}
.segments button:hover:not([aria-pressed="true"]) { background:var(--panel-2); }
.page-content { padding-block:24px 32px; }
.stations-frame { max-width:1480px; margin-inline:auto; display:grid; gap:16px; }
.phase-tabs { width:max-content; max-width:100%; gap:0; }
.phase-tabs button { min-height:32px; padding-inline:12px; }
.phase-tabs b { margin-inline-start:4px; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
.phase-tabs [aria-pressed="true"] b { color:var(--blue); }
.toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.button, .search, .picker {
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-width:0;
  height:40px; padding:0 12px; background:var(--panel); border:1px solid var(--line-strong);
  border-radius:10px; font-size:13px; font-weight:600; white-space:nowrap;
}
.button:hover:not(:disabled), .picker:hover { background:var(--panel-2); }
.button.primary { color:var(--panel); background:var(--ink); border-color:var(--ink); }
.button.primary:hover { background:var(--ink-2); }
.button.compact { height:32px; padding:0 8px; font-size:12px; }
.button.icon { width:32px; height:32px; padding:0; }
.button.danger { color:var(--danger); }
.button.danger:disabled { color:var(--muted); }
.search { flex:0 1 360px; justify-content:start; color:var(--muted); }
.search input { border:0; outline:0; background:transparent; font-size:13px; font-weight:400; width:100%; min-width:0; padding:0; }
.search input::placeholder { color:var(--muted); }
.result-count { margin-inline-start:auto; color:var(--muted); font-size:12px; white-space:nowrap; }
.picker { justify-content:start; color:var(--muted); }
.picker select { border:0; background:var(--panel); color:var(--ink); max-width:176px; min-width:0; padding:0 4px; }
.preview-controls .picker { height:32px; gap:4px; padding-inline:4px; }
.groups { display:grid; gap:16px; }
.group, .records, .state, .operations {
  min-width:0; background:var(--panel); outline:1px solid var(--line); outline-offset:-1px;
  border-radius:16px; padding:16px; box-shadow:var(--shadow-soft);
}
.group { display:grid; gap:12px; padding:12px; container:cluster / inline-size; }
.section-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.section-head h2 { font-size:15px; line-height:20px; font-weight:750; }
.section-head small { display:block; margin-top:4px; font-size:11px; overflow-wrap:anywhere; }
.count, .chip {
  display:inline-flex; align-items:center; width:max-content; gap:4px; border-radius:999px;
  white-space:nowrap; font-size:11px; line-height:16px; padding:2px 8px;
  font-weight:600; color:var(--muted); background:var(--panel-2);
}
.count { border:1px solid var(--line); }
.chip.good { color:var(--green-ink); background:var(--green-soft); }
.chip.warn { color:var(--amber-ink); background:var(--amber-bg); }
.chip.bad { color:var(--danger); background:var(--danger-soft); }
.chip.info { color:var(--info-ink); background:var(--info-bg); }
.dot::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; flex:none; }
.grid { display:grid; gap:12px; min-width:0; align-items:stretch; }
.robot-grid { grid-template-columns:repeat(3,minmax(0,460px)); justify-content:space-between; }
.stock-grid { grid-template-columns:repeat(4,minmax(0,360px)); gap:4px; }
.station-card, .control-row {
  border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; background:var(--panel);
}
.station-card { display:flex; flex-direction:column; gap:8px; }
.control-row { border-radius:10px; background:var(--sunken); padding:8px 12px; }
.station-card:has([aria-expanded="true"]), .station-card:has(input:checked), .control-row:has([aria-expanded="true"]) {
  border-color:var(--blue);
}
.card-head { display:flex; align-items:flex-start; gap:8px; min-width:0; }
.control-row .card-head { align-items:center; }
.card-head > .chip { margin-top:4px; }
.card-name { flex:1; min-width:0; }
.card-head h3 { font-size:14px; font-weight:750; overflow-wrap:anywhere; }
.identity { display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin-top:4px; font-size:11px; color:var(--muted); }
.identity code { background:var(--sunken); border-radius:4px; padding:1px 4px; white-space:nowrap; }
.control-row .identity { margin-top:0; }
.expand svg { transition:transform 140ms; }
.expand[aria-expanded="true"] { color:var(--blue); background:var(--blue-bg); }
.expand[aria-expanded="true"] svg { transform:rotate(180deg); }
input[type="checkbox"] { width:16px; height:16px; margin:0; accent-color:var(--blue); }
.card-head input { margin-top:2px; flex:none; }
.batch { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; min-height:24px; }
.batch label { display:inline-flex; align-items:center; gap:8px; color:var(--ink-2); font-size:12px; }
.batch-actions { display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
.card-meta, .power-strip { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; min-height:20px; font-size:11px; color:var(--muted); }
.verified { display:inline-flex; align-items:center; gap:4px; color:var(--green-ink); }
.verified svg { width:13px; height:13px; }
.power-strip { justify-content:space-between; gap:4px; background:var(--sunken); padding:4px 8px; border-radius:8px; }
.power-strip > span { display:inline-flex; flex-wrap:wrap; align-items:center; gap:4px; }
.power-strip strong { color:var(--ink-2); }
.power-strip .chip { padding-block:0; }
.camera-wall { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; }
.camera-tile {
  position:relative; padding:0; border:0; background:var(--sunken); border-radius:10px;
  overflow:hidden; min-width:0; aspect-ratio:16 / 9; isolation:isolate; text-align:left;
}
.camera-tile:first-child { grid-column:1 / -1; }
.camera-tile img, .camera-tile .placeholder { width:100%; height:100%; position:absolute; inset:0; object-fit:cover; }
.placeholder { display:grid; place-items:center; color:var(--muted); }
.camera-tile.missing { border:1px dashed var(--line-strong); background:var(--panel); }
.camera-tile.warn { background:var(--amber-bg); }
.camera-tile.warn .placeholder { color:var(--amber-ink); }
.camera-tile:focus-visible { z-index:1; }
.camera-caption { position:absolute; inset:auto 4px 4px; display:flex; justify-content:space-between; gap:2px; align-items:center; }
.camera-caption .chip { padding:1px 4px; font-size:10px; line-height:14px; }
.camera-caption strong {
  color:var(--ink); background:var(--panel); border-radius:4px; padding:1px 4px;
  font-size:10px; white-space:nowrap; box-shadow:var(--shadow-soft);
}
.camera-tile:hover .camera-caption strong { color:var(--blue); }
.camera-line { display:flex; justify-content:space-between; gap:4px; color:var(--muted); font-size:11px; }
.facts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; }
.facts dt { color:var(--muted); font-size:11px; }
.facts dd { font-size:12px; font-weight:650; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.station-card-foot { margin-top:auto; padding-top:8px; border-top:1px solid var(--line); display:grid; gap:4px; }
.quick { display:flex; align-items:center; gap:4px; min-width:0; }
.quick .button { gap:4px; }
.pose { touch-action:none; user-select:none; }
.pose[aria-pressed="true"] { color:var(--blue); background:var(--blue-bg); }
.station-card-hint {
  display:block; min-width:0; min-height:16px; height:16px; line-height:16px; font-size:11px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted);
}
.station-card-hint.warn { color:var(--amber-ink); }
.station-card-hint.bad { color:var(--danger); }
.detail { grid-column:1 / -1; background:var(--sunken); border:1px solid var(--line); border-radius:14px; padding:16px; display:grid; gap:12px; }
.detail h3 { font-size:16px; }
.detail-cols, .detail-cams { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.detail-cams { grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
.detail-cams .camera-tile { grid-column:auto; }
.detail-block { border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--panel); min-width:0; }
.detail-block h4 { font-size:13px; margin-bottom:8px; }
.detail-block dl > div { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding-block:4px; font-size:12px; }
.detail-block dt { color:var(--muted); }
.detail-block dd { text-align:right; overflow-wrap:anywhere; }
.detail-actions, .dialog-actions { display:flex; flex-wrap:wrap; gap:4px; }
.records { display:grid; gap:12px; }
table { width:100%; table-layout:fixed; border:1px solid var(--line); border-spacing:0; border-radius:10px; font-size:12px; text-align:left; }
th, td { padding:8px 12px; overflow-wrap:anywhere; }
th { background:var(--sunken); color:var(--muted); font-size:11px; font-weight:650; }
th:first-child { border-top-left-radius:10px; }
th:last-child { border-top-right-radius:10px; }
td { border-top:1px solid var(--line); }
.state { min-height:144px; display:grid; align-content:center; justify-items:center; gap:8px; color:var(--muted); text-align:center; }
.state svg { width:24px; height:24px; }
.state.error { color:var(--danger); }
.operations { display:grid; gap:8px; }
dialog {
  border:1px solid var(--line); border-radius:16px; padding:16px; width:min(480px,calc(100% - 24px));
  color:var(--ink); background:var(--panel); max-height:calc(100dvh - 24px); box-shadow:var(--shadow-soft);
}
dialog::backdrop { background:color-mix(in srgb, var(--ink-2) 48%, transparent); }
[data-theme="dark"] dialog::backdrop { background:color-mix(in srgb, var(--canvas) 76%, transparent); }
dialog.camera-dialog { width:min(860px,calc(100% - 24px)); }
.dialog-body { display:grid; gap:12px; }
.dialog-body h2 { font-size:17px; }
.dialog-frame { display:grid; place-items:center; aspect-ratio:16 / 9; background:var(--sunken); border-radius:10px; overflow:hidden; }
.dialog-frame img { width:100%; height:100%; object-fit:cover; }
.dialog-frame span { display:grid; justify-items:center; gap:8px; padding:12px; text-align:center; color:var(--muted); }
.dialog-actions { justify-content:flex-end; }
.toast {
  position:fixed; inset:auto 16px 16px auto; z-index:2; width:min(400px,calc(100% - 32px)); display:flex;
  align-items:flex-start; gap:8px; padding:12px; border:1px solid var(--line-strong);
  border-radius:14px; background:var(--panel); box-shadow:var(--shadow-soft);
}
.toast > svg { margin-top:4px; color:var(--green-ink); }
.toast.pending > svg { color:var(--blue); }
.toast.error > svg { color:var(--danger); }
.toast-copy { flex:1; min-width:0; overflow-wrap:anywhere; }
.toast p { font-size:12px; color:var(--muted); margin-top:4px; }
.spin { animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion:reduce) { .spin { animation:none; } .expand svg { transition:none; } }
@container cluster (max-width:1430px) { .stock-grid { grid-template-columns:repeat(3,minmax(0,360px)); } }
@container cluster (max-width:1000px) { .robot-grid { grid-template-columns:repeat(2,minmax(0,460px)); } }
@container cluster (max-width:1100px) { .stock-grid { grid-template-columns:repeat(2,minmax(0,360px)); } }
@container cluster (max-width:680px) {
  .robot-grid, .stock-grid { grid-template-columns:minmax(0,1fr); }
  .detail-cols { grid-template-columns:minmax(0,1fr); }
  .detail-cams { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@container viewport (max-width:860px) {
  .search { flex:1 1 240px; }
  .result-count { margin-inline-start:0; }
}
@container viewport (max-width:600px) {
  .topbar-inner, .page-content { padding-inline:12px; }
  .page-content { padding-top:16px; gap:12px; }
  .topbar-row { min-height:64px; }
  .preview-controls { gap:4px; }
  .preview-controls .segments { padding:2px; gap:0; }
  .preview-controls .segments button { padding-inline:4px; }
  .phase-tabs button { padding-inline:6px; }
  .search { flex-basis:100%; }
  .toolbar .button, .toolbar .picker { padding-inline:8px; gap:4px; }
  .toolbar .result-count { order:1; margin-inline-start:auto; }
  .group, .records { padding:12px; }
  table { min-width:840px; }
  th, td { padding:8px 4px; }
  .camera-caption .chip { font-size:9px; padding-inline:2px; }
}
</style>
</head>
<body>
<div class="viewport" data-width="auto">
  <header class="topbar"><div class="topbar-inner"><div class="topbar-row">
    <div><span class="eyebrow" id="context"></span><h1 id="page-title"></h1></div>
    <div class="preview-controls">
      <label class="picker" id="preview-picker"><select id="preview-width">
        <option value="auto">Auto</option><option>2000</option><option>1440</option><option>390</option>
      </select></label>
      <div class="segments" id="languages" role="group">
        <button type="button" id="lang-zh" lang="zh-CN">中</button><button type="button" id="lang-en" lang="en">EN</button>
      </div>
      <div class="segments" id="themes" role="group"><button type="button" id="theme-light"></button><button type="button" id="theme-dark"></button></div>
    </div>
  </div></div></header>
  <main class="page-content" aria-labelledby="page-title"><div class="stations-frame">
    <div class="segments phase-tabs" id="phases" role="group"></div>
    <div class="toolbar" id="toolbar">
      <label class="search"><span id="search-icon" aria-hidden="true"></span><input id="search" type="search"></label>
      <button type="button" class="button" id="refresh"></button>
      <output class="result-count" id="result-count" aria-live="polite"></output>
      <label class="picker"><span id="filter-icon" aria-hidden="true"></span><select id="cluster"></select></label>
      <button type="button" class="button" id="operations-toggle" aria-controls="operations" aria-expanded="false" disabled></button>
      <button type="button" class="button" id="models"></button>
      <button type="button" class="button primary" id="join"></button>
    </div>
    <section class="operations" id="operations" hidden></section>
    <section class="groups" id="groups"></section>
    <section class="records" id="records" aria-labelledby="records-title"></section>
  </div></main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<aside id="toast" class="toast" hidden></aside>

<script>
"use strict";

const icons = {
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
  refresh:'<path d="M20 7v5h-5M4 17v-5h5M6 8a7 7 0 0 1 12-2l2 4M4 14l2 4a7 7 0 0 0 12-2"/>',
  filter:'<path d="M4 7h16M7 12h10m-7 5h4"/>',
  key:'<circle cx="8" cy="15" r="5"/><path d="m12 11 8-8 2 2-2 2-2-2m0 4-2-2"/>',
  boxes:'<path d="m12 2 5 3v5l-5 3-5-3V5l5-3ZM7 10l-5 3v5l5 3 5-3v-5m5-3 5 3v5l-5 3-5-3M7 5l5 3 5-3M12 8v5m-10 0 5 3 5-3m0 0 5 3 5-3M7 16v5m10-5v5"/>',
  chevron:'<path d="m6 9 6 6 6-6"/>',
  camera:'<path d="M14 4h-4L8 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-4Z"/><circle cx="12" cy="13" r="3"/>',
  home:'<path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Zm6 11v-7h6v7"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  close:'<path d="m6 6 12 12M18 6 6 18"/>',
  load:'<path d="M21 12a9 9 0 1 1-9-9"/>',
  warning:'<path d="m12 3 10 18H2L12 3Zm0 6v4m0 4h.01"/>'
};
const icon = (key, extra = "") => `<svg ${extra} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[key]}</svg>`;
const byId = (id) => document.getElementById(id);
const groups = byId("groups");
const dialog = byId("dialog");
const toast = byId("toast");
const cl = {
  robot: { name:["深圳公司S1U调试集群","Shenzhen S1U test cluster"], ns:"rlark-robot-s1u-01" },

  byId("models").innerHTML = icon("boxes") + T("机器人型号","Robot models");
  byId("join").innerHTML = icon("key") + T("加入节点","Add node");
  byId("groups").setAttribute("aria-label", byId("page-title").textContent);
  renderPhases();
  renderList();
  renderRecords();
}

function renderPhases() {
  const base = byId("phases");
  base.setAttribute("aria-label", T("按状态筛选","Filter by status"));
  base.innerHTML = Object.entries(phaseNames).map(([key, name]) =>
    `<button type="button" data-phase="${key}" aria-pressed="${key === phase}">${loc(name)} <b>${key === "all" || key === "online" ? nodes.length : 0}</b></button>`).join("");
}

function heading(node) {
  const label = detailId === node.id ? T("收起详情","Collapse details") : T("展开详情","Expand details");
  const select = node.kind === "robot"
    ? `<input type="checkbox" data-choose="${node.id}" aria-label="${T("选中","Select")} ${node.id}" ${chosen.has(node.id) ? "checked" : ""}>` : "";
  const kind = node.kind === "robot" ? "S1U" : node.kind === "control" ? T("控制面","Control plane") : node.control ? chip(T("控制面","Control plane"), "info") : "—";
  return `<header class="card-head">${select}<div class="card-name"><h3 id="name-${node.id}">${node.id}</h3>
    <div class="identity">${kind}<code>UID ${node.uid}</code></div></div>${online()}
    ${btn("", `id="expand-${node.id}" data-expand="${node.id}" aria-expanded="${detailId === node.id}" aria-controls="detail-${node.id}" aria-label="${label} · ${node.id}" title="${label}"`, "chevron", "icon expand")}</header>`;
}

function cameraTile(node, index) {
  const frame = node.cameras[index];
  const hasFrame = Number.isInteger(frame);
  const name = loc(cameraNames[index]);
  const status = loc(cameraStates[hasFrame ? "normal" : frame]);
  const tone = hasFrame ? "good" : frame === "recovering" ? "warn" : "";
  const media = hasFrame ? `<img src="data:image/webp;base64,${frames[frame]}" alt="">`
    : `<span class="placeholder" aria-hidden="true">${frame === "missing" ? "—" : icon("camera")}</span>`;
  return `<button type="button" class="camera-tile ${tone} ${frame === "missing" ? "missing" : ""}"
    data-camera="${node.id}" data-view="${index}" aria-haspopup="dialog" aria-label="${node.id} · ${name} · ${status}" title="${name} · ${status}">${media}
    <span class="camera-caption"><strong>${name}</strong>${chip(status, tone, frame !== "missing")}</span></button>`;
}

function facts(node) {
  const [days, hours] = node.uptime;
  return `<dl class="facts">
    <div><dt>${T("运行时间","Uptime")}</dt><dd>${T(`${days} 天 ${hours} 小时`,`${days} d ${hours} h`)}</dd></div>
    <div><dt>${T("重启次数","Restarts")}</dt><dd>0</dd></div>
    <div><dt>${T("最近上报","Last report")}</dt><dd>${T(`${node.seen} 秒前`,`${node.seen} s ago`)}</dd></div>
  </dl>`;
}

function blockedHint(targets) {
  const blocked = targets.find(node => node.actual !== "ready");
  if (!blocked) return "";
  const reason = blocked.actual === "off"
    ? T("电源未上电，先上电","Power it on first")
    : T("驱动没在跑，先启动驱动","Start the driver first");
  return T(`回位不可用：${reason}`,`Home pose unavailable: ${reason}`);
}

function poseButton(key, targets) {
  const hint = blockedHint(targets);
  return btn(T("按住回位","Hold home"), `data-pose="${key}" aria-pressed="false" aria-describedby="hint-${key}"
    title="${hint || T("按住移动到初始姿势，松开即停","Hold to move to the home pose; let go to stop")}" ${hint ? "disabled" : ""}`, "home", "compact pose");
}

function hintSlot(key, targets) {
  const hint = blockedHint(targets);
  return `<small id="hint-${key}" class="station-card-hint ${hint ? "warn" : ""}" role="status" title="${hint}">${hint}</small>`;
}

function actionButton(key, action, compact = true) {
  return btn(loc(actionNames[action]), `data-power="${action}" data-target="${key}" ${pending ? "disabled" : ""}`, "", compact ? "compact" : "");
}

function card(node) {
  const head = heading(node);
  if (node.kind === "control") return `<article class="control-row" aria-labelledby="name-${node.id}">${head}</article>`;
  const robot = node.kind === "robot";
  const meta = `<div class="card-meta">${verified()}${robot ? chip(T("已入网","Enrolled"), "good", true) : T("未用入网码","No admission code")}</div>`;
  const extras = robot ? `<div class="power-strip">
    <span>${T("期望","Desired")} <strong data-desired="${node.id}">${loc(powerNames[node.desired])}</strong></span>
    <span>${T("实际","Actual")} <strong>${loc(actualNames[node.actual])}</strong></span>
    <span>${T("自检","Self-check")} ${checkState(node)}</span></div>
    <div class="camera-wall" role="group" aria-label="${T("相机","Cameras")}">${node.cameras.map((_, index) => cameraTile(node, index)).join("")}</div>
    <div class="camera-line"><span>${T("相机","Cameras")}</span><span>${detailId === node.id ? T("实时画面在下方","Live frames below") : T("慢速预览 · 5 秒","Preview · 5 s")}</span></div>` : "";
  const driver = node.actual === "ready" ? "driver_off" : node.actual === "powered" ? "driver_on" : "";
  const foot = robot ? `<footer class="station-card-foot"><div class="quick" role="group" aria-label="${T("机器人控制","Robot controls")}">
    ${driver ? actionButton(node.id, driver) : ""}${actionButton(node.id, node.actual === "off" ? "power_on" : "power_off")}${poseButton(node.id, [node])}
    </div>${hintSlot(node.id,[node])}</footer>` : "";
  return `<article class="station-card ${robot ? "robot-card" : "stock-card"}" aria-labelledby="name-${node.id}">${head}${meta}${extras}${facts(node)}${foot}</article>`;
}

function detail(node) {
  const robot = node.kind === "robot";
  const identity = `<section class="detail-block"><h4>${T("身份","Identity")}</h4><dl>
    <div><dt>${T("记录名","Record name")}</dt><dd>${node.id}</dd></div>
    <div><dt>${T("集群","Cluster")}</dt><dd>${clusterLabel(node.cluster)}</dd></div>
    <div><dt>${T("集群命名空间","Cluster namespace")}</dt><dd>${cl[node.cluster].ns}</dd></div>
    <div><dt>${T("Node UID","Node UID")}</dt><dd>${node.uid}</dd></div>
    <div><dt>${T("System UUID","System UUID")}</dt><dd>${node.kind === "robot" ? "9de2…4a18" : "4bb2…019c"}</dd></div>
    <div><dt>${T("声明类型 / 型号","Declared type / model")}</dt><dd>${robot ? "Robot · S1U" : T("普通节点","Generic node")}</dd></div>
  </dl></section>`;
  const network = `<section class="detail-block"><h4>${T("网络与入网","Network and admission")}</h4><dl>
    <div><dt>${T("网络已验证","Network verified")}</dt><dd>${T("已验证","Verified")}</dd></div>
    <div><dt>${T("WireGuard 公钥","WireGuard public key")}</dt><dd>pQ8f…Y2kM</dd></div>
    <div><dt>${T("隧道地址","Tunnel address")}</dt><dd>10.77.0.1${node.id.endsWith("2") ? "2" : "1"}/24</dd></div>
    <div><dt>${T("入网状态","Admission status")}</dt><dd>${T("已使用","Used")}</dd></div>
    <div><dt>${T("发码人","Issued by")}</dt><dd>operator</dd></div>
    <div><dt>${T("过期时间","Expires")}</dt><dd>2026-12-05 09:30</dd></div>
  </dl></section>`;
  const conditions = `<section class="detail-block"><h4>${T("条件","Conditions")}</h4><dl>
    <div><dt>${T("隧道连接","Tunnel connection")}</dt><dd>${T("已连接","Connected")}</dd></div>
    <div><dt>${T("身份验证","Identity verification")}</dt><dd>${T("通过","Passed")}</dd></div>
    <div><dt>${T("最后观测","Last observation")}</dt><dd>${T(`${node.seen} 秒前`,`${node.seen} seconds ago`)}</dd></div>
    ${robot ? `<div><dt>${T("相机自检","Camera self-check")}</dt><dd>${node.self === "pass" ? T("通过","Passed") : T("恢复中","Recovering")}</dd></div>` : ""}
  </dl></section>`;
  const power = robot ? `<section class="detail-block"><h4>${T("机器人电源","Robot power")}</h4><dl>
    <div><dt>${T("期望","Desired")}</dt><dd>${loc(powerNames[node.desired])}</dd></div>
    <div><dt>${T("现在","Now")}</dt><dd>${loc(actualNames[node.actual])}</dd></div>
    <div><dt>${T("自检","Self-check")}</dt><dd>${node.self === "pass" ? T("通过","Passed") : T("没过","Failed")}</dd></div>
    </dl><div class="detail-actions">
      ${["power_on","driver_on","driver_off","power_off"].map(action => actionButton(node.id, action, false)).join("")}
      ${poseButton(node.id,[node])}</div>
    <small class="station-card-hint ${blockedHint([node]) ? "warn" : ""}" title="${blockedHint([node])}">${blockedHint([node])}</small>
    <p class="muted">${T("期望状态持续保存；电源意外关闭或驱动停止时会自动恢复。急停或硬件故障时不会重拉。","Desired state persists and is reconciled after unexpected power or driver loss. It is not restored during an emergency stop or hardware fault.")}</p>
    <h4>${T("实时相机","Live cameras")}</h4><div class="detail-cams">${node.cameras.map((_, index) => cameraTile(node,index)).join("")}</div>
    </section>` : "";
  return `<section class="detail" id="detail-${node.id}" aria-labelledby="detail-title-${node.id}">
    <h3 id="detail-title-${node.id}" tabindex="-1">${T("节点详情","Node details")} · ${node.id}</h3>
    <div class="detail-cols">${identity}${network}${conditions}${power}</div>
    <div class="detail-actions">${btn(T("重发入网码","Reissue code"),`data-toast="${T("入网码已重发","Code reissued")}"`)}${btn(T("作废入网码","Revoke code"),`data-confirm="revoke" data-node="${node.id}"`,"","danger")}${btn(T("删除记录","Delete record"),`data-confirm="delete" data-node="${node.id}"`,"","danger")}${btn(T("关闭详情","Close details"),`data-close-details="${node.id}"`)}</div>
  </section>`;
}

function batchRow(groupRobots) {
  if (!groupRobots.length) return "";
  const chosenGroup = groupRobots.filter(node => chosen.has(node.id));
  const allChecked = chosenGroup.length === groupRobots.length;
  const targets = chosenGroup;
  const blocked = blockedHint(targets);
  const driver = targets.length && targets.every(node => node.actual === "ready") ? "driver_off" : "driver_on";
  const powerAction = targets.length && targets.every(node => node.actual === "off") ? "power_on" : "power_off";
  return `<div class="batch"><label><input type="checkbox" id="select-all" ${allChecked ? "checked" : ""}> ${T("全选当前集群机器人","Select all robots in this cluster")}</label>
    <div class="batch-actions">${T("已选","Chosen")} ${chosenGroup.length}/${groupRobots.length}
      <button type="button" class="button compact" data-batch="${driver}" ${!targets.length || pending ? "disabled" : ""}>${loc(actionNames[driver])}</button>
      <button type="button" class="button compact" data-batch="${powerAction}" ${!targets.length || pending ? "disabled" : ""}>${loc(actionNames[powerAction])}</button>
      ${btn(T("按住回位","Hold home"),`data-pose="batch" aria-pressed="false" ${!targets.length || blocked ? "disabled" : ""} title="${blocked}"`,"home","compact pose")}
    </div>
    ${chosenGroup.length && blocked ? `<small class="station-card-hint warn" title="${blocked}">${blocked}</small>` : ""}
  </div>`;
}

function renderState() {
  const states = {
    loading:`<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">${icons.load}</svg><strong>${T("正在加载节点…","Loading site nodes…")}</strong>`,
    empty:`<span>${icon("search")}</span><strong>${T("没有匹配的场站节点","No matching site nodes")}</strong><small>${T("调整搜索词或筛选条件","Adjust the search or filters")}</small>`,
    error:`<span>${icon("warning")}</span><strong>${T("暂时读不到场站节点","Site nodes are temporarily unavailable")}</strong><button type="button" class="button" data-retry>${T("重试","Retry")}</button>`
  };
  groups.innerHTML = listState === "success" ? "" : `<div class="state ${listState === "error" ? "error" : ""}" role="${listState === "error" ? "alert" : "status"}">${states[listState]}</div>`;
}

function renderList() {
  const term = byId("search").value.trim().toLowerCase();
  const cluster = byId("cluster").value;
  let visible = nodes.filter(node => (!cluster || node.cluster === cluster) && (!term || node.id.toLowerCase().includes(term) || node.uid.toLowerCase().includes(term)));
  if (phase === "offline") visible = [];
  if (phase === "conflicts" || phase === "retired") visible = [];
  byId("result-count").textContent = T(`${visible.length} 条结果`,`${visible.length} results`);
  renderState();
  if (listState !== "success") return;
  if (!visible.length) {
    groups.innerHTML = `<div class="state" role="status">${icon("search")}<strong>${T("没有匹配的场站节点","No matching site nodes")}</strong></div>`;
    return;
  }
  let html = "";
  const robotVisible = visible.filter(node => node.cluster === "robot");
  if (robotVisible.length) {
    const clusterRobots = robotVisible.filter(node => node.kind === "robot");
    const control = robotVisible.filter(node => node.kind === "control");
    html += `<section class="group" aria-label="${clusterLabel("robot")}">
      ${secHead(clusterLabel("robot"),`${T("机器人集群","Robot cluster")} · ${cl.robot.ns}`,`${clusterRobots.length} ${T("机器人","robots")}`)}
      ${control.map(card).join("")}${batchRow(clusterRobots)}
      ${clusterRobots.length ? `<div class="grid robot-grid">${clusterRobots.map(node => card(node) + (detailId === node.id ? detail(node) : "")).join("")}</div>` : ""}
      </section>`;
  }
  const stockVisible = visible.filter(node => node.cluster === "stock" && node.kind === "node");
  if (stockVisible.length) {
    html += `<section class="group" aria-label="${clusterLabel("stock")}">
      ${secHead(clusterLabel("stock"),`${T("普通节点","Node inventory")} · ${cl.stock.ns}`,`${stockVisible.length} ${T("节点","nodes")}`)}
      <div class="grid stock-grid">${stockVisible.map(node => card(node) + (detailId === node.id ? detail(node) : "")).join("")}</div>
      </section>`;
  }
  groups.innerHTML = html;
}

function renderRecords() {
  const title = T("入网记录","Admission records");
  byId("records").innerHTML = `${secHead(title,T("发码和使用状态 · 入网码本身不会保存","Issuance and redemption state · join codes themselves are never stored"),`${admissions.length} ${T("条记录","records")}`,"records-title")}
    <div style="overflow-x:auto;border-radius:10px">
    <table aria-labelledby="records-title">
      <thead><tr><th>${T("节点","Node")}</th><th>${T("集群","Cluster")}</th><th>${T("状态","State")}</th><th>${T("发码人","Issued by")}</th><th>${T("发码时间","Issued")}</th><th>${T("过期时间","Expires")}</th><th>${T("WireGuard 公钥","WireGuard key")}</th><th>${T("隧道地址","Tunnel address")}</th><th aria-label="${T("操作","Actions")}"></th></tr></thead>
      <tbody>${admissions.map(record => `<tr><td>${record.node.id}</td><td>${clusterLabel(record.node.cluster)}</td><td>${chip(T("已使用","Used"),"good")}</td><td>operator</td><td>${record.issued}</td><td>2026-12-05 09:30</td><td>pQ8f…Y2kM</td><td>10.77.0.${nodes.indexOf(record.node)+11}</td><td><button type="button" class="button compact" data-record="${record.node.id}">${T("查看","View")}</button></td></tr>`).join("")}</tbody>
    </table></div>`;
}

function dismissToast() {
  toast.hidden = true;
  toast.className = "toast";
}
function showToast(message, state = "") {
  toast.className = `toast ${state}`;
  toast.innerHTML = `${icon(state === "error" ? "warning" : state === "pending" ? "load" : "check", state === "pending" ? 'class="spin"' : "")}<div class="toast-copy"><strong>${state === "pending" ? T("正在下发操作","Sending command") : state === "error" ? T("操作失败","Action failed") : T("操作已下发","Action sent")}</strong><p>${message}</p></div>
    ${state === "pending" ? "" : `<button type="button" class="button icon compact" data-dismiss-toast aria-label="${closeLabel()}">${icon("close")}</button>`}`;
  toast.hidden = false;
}

function openConfirm(node, action, trigger) {
  confirmAction = { node, action, trigger };
  dialog.className = "";
  dialog.innerHTML = `<form method="dialog" class="dialog-body"><h2 id="dialog-title">${action === "delete" ? T("删除节点记录","Delete node record") : T("作废入网码","Revoke join code")}</h2>
    <p>${T("此演示只显示现有操作的确认步骤，不会连接后端。","This prototype illustrates the existing confirmation step and does not contact a backend.")}</p>
    <div class="dialog-actions"><button class="button" value="cancel" id="cancel-confirm">${cancelLabel()}</button><button class="button danger" value="confirm" id="confirm-action">${action === "delete" ? T("删除记录","Delete record") : T("作废入网码","Revoke code")}</button></div></form>`;
  dialog.showModal();
  byId("cancel-confirm").focus();
  byId("confirm-action").addEventListener("click", event => {
    event.preventDefault();
    dialog.close();
    showToast(T("仅原型交互，未发送任何请求。","Prototype interaction only. No request was sent."),"error");
  },{once:true});
  dialog.addEventListener("close", () => { confirmAction?.trigger?.focus(); confirmAction = null; }, {once:true});
}

function openCamera(node, view, trigger) {
  dialogTrigger = trigger;
  const frame = node.cameras[view];
  const name = loc(cameraNames[view]);
  const status = loc(cameraStates[Number.isInteger(frame) ? "normal" : frame]);
  const media = Number.isInteger(frame)
    ? `<img src="data:image/webp;base64,${frames[frame]}" alt="${name}">`
    : `<span>${icon("camera")}${status}</span>`;
  dialog.className = "camera-dialog";
  dialog.innerHTML = `<div class="dialog-body"><div class="section-head"><div><span class="eyebrow">${node.id}</span><h2 id="dialog-title">${name}</h2></div><button type="button" class="button icon" id="close-dialog" aria-label="${closeLabel()}">${icon("close")}</button></div>
    <div class="dialog-frame">${media}</div><div class="section-head"><span class="chip good dot">${status}</span><small>${T("慢速预览 · 每 5 秒","Slow preview · every 5 seconds")}</small></div></div>`;
  dialog.showModal();
  byId("close-dialog").focus();
  byId("close-dialog").addEventListener("click", () => dialog.close());
  dialog.addEventListener("close", () => { dialogTrigger?.focus(); dialogTrigger = null; }, {once:true});
}

function updatePower(targets, action) {
  if (pending || !targets.length) return;
  const label = loc(actionNames[action]);
  const isDriver = action.startsWith("driver");
  const verb = action.endsWith("on") ? T("启动","start") : T("停止","stop");
  const names = targets.map(node => node.id).join(zh ? "、" : ", ");
  const prompt = T(
    `${label}：${names}\n\n请确认这些机器人周围安全、现场有人守着急停。`,
    `${label}: ${names}\n\nMake sure the robots' surroundings are safe and someone is at their emergency stops.`
  );
  if (!window.confirm(prompt)) return;
  pending = true;
  const desiredByAction = {power_on:"powered",driver_on:"ready",driver_off:"powered",power_off:"off"};
  const payload = isDriver ? T(`正在向 ${names} ${verb}驱动…`,`Sending driver ${verb} command to ${names}…`)
    : T(`正在将 ${names} 的期望电源状态改为「${loc(powerNames[desiredByAction[action]])}」…`,`Setting desired power for ${names} to ${desiredByAction[action]}…`);
  showToast(payload,"pending");
  renderList();
  clearTimeout(refreshTimer);
  refreshTimer = window.setTimeout(() => {
    targets.forEach(node => {
      if (action === "driver_on" || action === "ready") { node.desired = "ready"; node.actual = "ready"; }
      if (action === "driver_off") { node.desired = "powered"; node.actual = "powered"; }
      if (action === "power_on") { node.desired = node.desired === "off" ? "powered" : node.desired; node.actual = "powered"; }
      if (action === "power_off" || action === "off") { node.desired = "off"; node.actual = "off"; }
    });
    pending = false;
    renderList();
    showToast(T("期望状态已修改（仅演示）；真实控制台会等待服务收敛并刷新。","Desired state changed in this prototype; the console waits for service reconciliation and refreshes."));
  }, 550);
}

function startHold(button, key, keyboard = false) {
  const targets = key === "batch" ? nodes.filter(node => chosen.has(node.id)) : nodes.filter(node => node.id === key);
  if (button.disabled || held) return;
  held = { button, targets, started: performance.now(), timer: 0, ticks: 0, keyboard };
  button.setAttribute("aria-pressed","true");
  button.textContent = T("移动中…松开停止","Moving… release to stop");
  held.timer = window.setInterval(() => { if (held) held.ticks += 1; }, 200);
  showToast(T("按住期间每 200 毫秒发送保持命令，松开即停。","A hold command repeats every 200 ms until release."),"pending");
}
function stopHold(restoreKeyboardFocus = true) {
  if (!held) return;
  const state = held;
  held = null;
  clearInterval(state.timer);
  renderList();
  showToast(state.ticks ? T("已停止。","Stopped.") : T("按住不放才会移动，松开即停。","Hold the button to move; release to stop."));
  if (state.keyboard && restoreKeyboardFocus) {
    const selector = `[data-pose="${state.button.dataset.pose}"]`;
    requestAnimationFrame(() => document.querySelector(selector)?.focus());
  }
}

document.addEventListener("click", event => {
  const target = event.target.closest("button");
  if (!target) return;
  if (target.id.startsWith("theme-")) return;
  if (target.id.startsWith("lang-")) return;
  if (target.dataset.phase) { phase = target.dataset.phase; renderPhases(); renderList(); }
  if (target.dataset.expand) {
    const id = target.dataset.expand;
    detailId = detailId === id ? "" : id;
    renderList();
    if (!detailId) byId("expand-" + id)?.focus();
    else byId("detail-title-" + id)?.focus({preventScroll:true});
  }
  if (target.dataset.camera !== undefined) {
    const node = nodes.find(entry => entry.id === target.dataset.camera);
    if (node) openCamera(node, Number(target.dataset.view), target);
  }
  if (target.dataset.power) updatePower(nodes.filter(node => node.id === target.dataset.target), target.dataset.power);
  if (target.dataset.batch) updatePower(nodes.filter(node => chosen.has(node.id)), target.dataset.batch);
  if (target.dataset.dismissToast) dismissToast();
  if (target.dataset.closeDetails) {
    const id = target.dataset.closeDetails; detailId = ""; renderList(); byId("expand-" + id)?.focus();
  }
  if (target.dataset.confirm) openConfirm(nodes.find(node => node.id === target.dataset.node),target.dataset.confirm,target);
  if (target.dataset.toast) showToast(target.dataset.toast);
  if (target.dataset.record) { detailId = target.dataset.record; renderList(); byId("detail-title-" + detailId)?.focus({preventScroll:true}); }
  if ("retry" in target.dataset) {
    listState = "loading"; renderList();
    setTimeout(() => { listState = "success"; renderList(); }, 500);
  }
});
document.addEventListener("change", event => {
  const target = event.target;
  if (target.id === "lang-zh") { zh = true; renderLabels(); }
  if (target.id === "lang-en") { zh = false; renderLabels(); }
  if (target.id === "cluster" || target.id === "search") renderList();
  if (target.id === "preview-width") {
    const viewport = document.querySelector(".viewport");
    const value = target.value;
    viewport.dataset.width = value;
    viewport.style.width = value === "auto" ? "" : `${value}px`;
  }
  if (target.id === "select-all") {
    nodes.filter(node => node.kind === "robot" && node.cluster === "robot").forEach(node => {
      if (target.checked) chosen.add(node.id); else chosen.delete(node.id);
    });
    renderList();
  }
  if (target.dataset.choose) {
    if (target.checked) chosen.add(target.dataset.choose); else chosen.delete(target.dataset.choose);
    renderList();
  }
});
document.addEventListener("pointerdown", event => {
  const button = event.target.closest("[data-pose]");
  if (button && event.button === 0) startHold(button,button.dataset.pose);
});
document.addEventListener("keydown", event => {
  const button = event.target.closest?.("[data-pose]");
  if (event.key === "Escape" && !dialog.open && detailId) {
    const id = detailId;
    detailId = "";
    renderList();
    byId("expand-" + id)?.focus();
  }
  if (button && [" ","Enter"].includes(event.key) && !event.repeat) {
    event.preventDefault();
    startHold(button,button.dataset.pose,true);
  }
});
document.addEventListener("keyup", event => {
  if ([" ","Enter"].includes(event.key) && held?.keyboard) {
    const poseKey = held.button.dataset.pose;
    stopHold(false);
    requestAnimationFrame(() => document.querySelector(`[data-pose="${poseKey}"]:not(:disabled)`)?.focus());
  }
});
document.addEventListener("pointerup", stopHold);
document.addEventListener("pointercancel", stopHold);
window.addEventListener("blur", stopHold);
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !dialog.open && held) stopHold();
});
dialog.addEventListener("click", event => {
  if (event.target === dialog) dialog.close();
});
byId("lang-zh").addEventListener("click", () => { zh = true; renderLabels(); });
byId("lang-en").addEventListener("click", () => { zh = false; renderLabels(); });
byId("search").addEventListener("input", renderList);
byId("cluster").addEventListener("change", renderList);
byId("preview-width").addEventListener("change", event => {
  const value = event.target.value;
  const viewport = document.querySelector(".viewport");
  viewport.dataset.width = value;
  viewport.style.width = value === "auto" ? "" : `${value}px`;
});
byId("operations-toggle").addEventListener("click", event => {
  showOps = !showOps;
  event.currentTarget.setAttribute("aria-expanded",showOps);
  byId("operations").hidden = !showOps;
  byId("operations").innerHTML = showOps ? `<strong>${T("节点操作历史","Node operation history")}</strong><span class="muted">${T("当前集群暂无待处理操作","No pending operations in this cluster")}</span>` : "";
});
byId("refresh").addEventListener("click", event => {
  const button = event.currentTarget;
  button.disabled = true;
  showToast(T("正在刷新场站节点…","Refreshing site nodes…"),"pending");
  setTimeout(() => {
    button.disabled = false;
    renderList();
    showToast(T("场站节点已刷新。","Site nodes refreshed."));
  },450);
});
byId("join").addEventListener("click", () => showToast(T("打开「加入节点」流程（本原型不含跨页导航）。","The Add node flow is outside this page prototype.")));
byId("models").addEventListener("click", () => showToast(T("打开「机器人型号」流程（本原型不含跨页导航）。","The Robot models flow is outside this page prototype.")));
byId("theme-light").addEventListener("click", () => { document.documentElement.dataset.theme = "light"; renderLabels(); });
byId("theme-dark").addEventListener("click", () => { document.documentElement.dataset.theme = "dark"; renderLabels(); });
document.documentElement.addEventListener("pointerup", stopHold);
byId("preview-width").value = "auto";
document.querySelector(".viewport").dataset.width = "auto";
renderLabels();
</script>
</body>
</html>
