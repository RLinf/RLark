<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>场站节点 · RLark</title>
<style>
:root {
  --ink: #1d1d1f;
  --ink-2: #3a3a3c;
  --muted: #6e6e73;
  --soft: #a1a1a6;
  --line: #e4e4e0;
  --line-strong: #dadad6;
  --panel: #ffffff;
  --panel-2: #f0f0ee;
  --canvas: #f7f7f5;
  --sunken: #f2f2f0;
  --blue: #5b4bc4;
  --blue-bg: #f1eefb;
  --green: #3e9a5c;
  --green-soft: #e0f1e5;
  --green-ink: #2c6b41;
  --red: #c8463b;
  --danger: #a3332a;
  --danger-soft: #fbe2de;
  --orange: #d59b2d;
  --amber-bg: #fbeed2;
  --amber-ink: #8a5a0b;
  --info: #4f82b8;
  --info-bg: #e2ecf6;
  --info-ink: #2f5c8a;
  --shadow-soft: 0 1px 2px rgba(29, 29, 31, 0.05);
}
:root[data-theme="dark"] {
  --ink: #f2f2ef;
  --ink-2: #c9c9c4;
  --muted: #9a9a93;
  --soft: #6e6e68;
  --line: #34342f;
  --line-strong: #46463f;
  --panel: #1c1c1a;
  --panel-2: #242422;
  --canvas: #141413;
  --sunken: #171716;
  --blue: #b9a6ff;
  --blue-bg: #2b2540;
  --green: #6fbf8b;
  --green-soft: #1d3327;
  --green-ink: #9bd9b1;
  --red: #e0796e;
  --danger: #f08a80;
  --danger-soft: #3a211f;
  --orange: #e0b15a;
  --amber-bg: #332a18;
  --amber-ink: #f0cc8c;
  --info: #86addd;
  --info-bg: #1d2a38;
  --info-ink: #b7d0ee;
  --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.45 "Inter", system-ui, sans-serif; }
button, select, input { font: inherit; color: inherit; }
button, select { cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
button, .button, select, .search { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; }
button, .button, select { min-height: 36px; padding: 0 12px; }
button, .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:hover:not(:disabled), .button:hover { background: var(--panel-2); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
a { color: var(--blue); }
svg { flex: none; }
h1,h2,h3,h4,p,dl { margin: 0; }
small { font-size: 11px; }
code { font-size: 11px; overflow-wrap: anywhere; }
.dim, dt { color: var(--muted); }
.eyebrow { color: var(--muted); font-size: 11px; font-weight: 650; }
.frame { max-width: 1480px; margin-inline: auto; min-width: 0; }
.mast { border-bottom: 1px solid var(--line); background: var(--panel); padding: 12px 24px; }
.mast .frame, .page-head, .toolbar, .cluster-head, .detail-head, .records-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 750; }
.brand svg { color: var(--blue); }
.switches, .tool-actions, .tabs, .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.switches button, .switches select { min-height: 32px; font-size: 12px; }
.shell { width: var(--demo-width, 100%); max-width: 100%; margin-inline: auto; padding: 20px 24px 40px; container-type: inline-size; }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
h1 { font-size: 26px; font-weight: 760; line-height: 1.25; }
h2 { font-size: 17px; font-weight: 750; line-height: 1.35; }
h3 { font-size: 15px; font-weight: 750; overflow-wrap: anywhere; }
h4 { font-size: 13px; }
.tabs { gap: 2px; width: max-content; max-width: 100%; padding: 3px; border: 1px solid var(--line); background: var(--sunken); border-radius: 10px; }
.tabs button { border-color: transparent; min-height: 32px; padding-inline: 10px; background: transparent; font-size: 12px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--panel); border-color: var(--line); color: var(--ink); box-shadow: var(--shadow-soft); }
.tabs b { color: var(--blue); font-variant-numeric: tabular-nums; }
.toolbar { justify-content: flex-start; margin-top: -4px; }
.toolbar .tool-actions { flex: 1 1 auto; min-width: 0; }
.toolbar .primary { margin-inline-start: auto; }
.search { display: flex; align-items: center; gap: 8px; flex: 0 1 340px; max-width: 100%; padding: 0 12px; color: var(--muted); }
.search input { width: 100%; min-height: 38px; background: transparent; border: 0; color: var(--ink); outline: 0; }
.search:focus-within { outline: 2px solid var(--blue); outline-offset: 2px; }
.toolbar button, .toolbar select { min-height: 40px; }
.tool-actions > select { max-width: 100%; }
.primary { background: var(--blue-bg); color: var(--blue); border-color: color-mix(in srgb, var(--blue) 34%, var(--line)); font-weight: 700; }
.cluster, .records, .list-state { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow-soft); min-width: 0; }
#groups { display: grid; gap: 16px; }
.cluster-head { align-items: center; }
.cluster-id { color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; margin: 0; }
.stats > div { display: flex; align-items: baseline; gap: 6px; padding: 4px 10px; border-inline-start: 1px solid var(--line); }
.stats > div:first-child { border: 0; }
.stats dt { font-size: 11px; }
.stats dd { font-size: 14px; font-weight: 750; margin: 0; font-variant-numeric: tabular-nums; }
.good { color: var(--green-ink); }
.warn { color: var(--amber-ink); }
.danger { color: var(--danger); }
.grid { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); gap: 12px; }
.robot-grid { --columns: 3; grid-template-columns: repeat(var(--columns), minmax(0, 460px)); justify-content: space-between; }
.stock-grid { --columns: 4; grid-template-columns: repeat(var(--columns), minmax(0, 360px)); justify-content: space-between; }
@container (max-width: 1250px) { .stock-grid { --columns: 3; } }
@container (max-width: 1080px) { .robot-grid { --columns: 2; } }
@container (max-width: 890px) { .stock-grid { --columns: 2; } }
@container (max-width: 690px) { .robot-grid, .stock-grid { --columns: 1; grid-template-columns: minmax(0, 1fr); } }
.card { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.card[data-expanded="true"], .card[data-selected="true"] { border-color: color-mix(in srgb, var(--blue) 55%, var(--line)); }
.card-head { display: flex; align-items: flex-start; gap: 8px; }
.card-name { flex: 1; min-width: 0; }
.card-name .dim { display: block; margin-top: 2px; }
.icon { width: 32px; min-height: 32px; padding: 0; flex: none; }
.expander[aria-expanded="true"] svg { transform: rotate(180deg); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 20px; background: var(--panel-2); color: var(--muted); font-size: 11px; font-weight: 650; white-space: nowrap; }
.pill.good { background: var(--green-soft); color: var(--green-ink); }
.pill.warn { background: var(--amber-bg); color: var(--amber-ink); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.info { background: var(--info-bg); color: var(--info-ink); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
.control-row { padding: 8px 12px; border-radius: 10px; background: var(--sunken); }
.control-row .card-head { align-items: center; }
.control-row .control-icon { color: var(--muted); margin-right: 4px; }
.check { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
input[type="checkbox"] { width: 16px; height: 16px; margin: 2px 0; accent-color: var(--blue); flex: none; }
.batch { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 11px; }
.robot-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.robot-facts div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 5px; min-width: 0; }
.robot-facts dt { font-size: 11px; }
.robot-facts dd { margin: 0; font-size: 12px; font-weight: 670; }
.camera-wall { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 4px; }
.camera { position: relative; display: grid; place-items: center; padding: 0; min-width: 0; min-height: 0; overflow: hidden; aspect-ratio: 16 / 9; border: 0; background: var(--sunken); border-radius: 8px; color: var(--muted); cursor: zoom-in; }
.camera:hover:not(:disabled) { background: var(--panel-2); }
.camera-wall:not(.live) .camera:first-child { grid-column: 1 / -1; }
.camera-wall.live { grid-template-columns: repeat(4,minmax(0,1fr)); }
.camera img, .zoom-image { width: 100%; height: 100%; object-fit: cover; display: block; }
.camera img { position: absolute; inset: 0; }
.camera.missing { border: 1px dashed var(--line-strong); }
.camera-cap { position: absolute; inset: auto 0 0; display: flex; justify-content: space-between; align-items: center; gap: 4px; padding: 4px 6px; background: color-mix(in srgb, var(--sunken) 94%, transparent); color: var(--ink); font-size: 10px; }
.camera-cap small { display: inline-flex; align-items: center; gap: 4px; font-size: inherit; }
.camera-line { display: flex; justify-content: space-between; gap: 8px; margin-top: -5px; }
.facts { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; font-variant-numeric: tabular-nums; }
.facts dt { font-size: 11px; }
.facts dd { margin: 2px 0 0; font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
.station-card-foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.actions { gap: 4px; }
.actions button { min-height: 36px; font-size: 12px; padding: 0 8px; white-space: nowrap; }
.station-card-hint { display: block; height: 16px; line-height: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary { display: flex; flex-direction: column; justify-content: center; gap: 8px; min-width: 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--sunken); }
.summary-head, .health-label { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.summary-head a { font-size: 12px; text-underline-offset: 3px; }
.summary-metrics { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 11px; }
.summary-metrics strong { margin-left: 4px; color: var(--ink); }
.health { display: grid; gap: 4px; }
.health-label { font-size: 11px; color: var(--muted); }
.health-track { display: flex; height: 5px; border-radius: 10px; background: var(--line-strong); overflow: hidden; }
.health-track .online { background: var(--green); }
.health-track .conflict { background: var(--red); }
.detail { grid-column: 1 / -1; padding: 16px; border: 1px solid var(--line-strong); border-radius: 14px; background: var(--sunken); display: grid; gap: 12px; min-width: 0; }
.detail-columns { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
.detail-columns > div, .detail-robot { display: grid; align-content: start; gap: 8px; padding: 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.detail-columns dl { font-size: 12px; display: grid; gap: 8px; }
.detail-columns dd { margin: 0; overflow-wrap: anywhere; }
.list-state { justify-items: start; padding-block: 24px; }
.records:focus { outline: 2px solid var(--blue); outline-offset: 4px; }
.record-row { display: grid; grid-template-columns: 1.1fr 1.3fr 1fr .7fr; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding: 8px 4px 0; font-size: 12px; }
.record-cell { min-width: 0; overflow-wrap: anywhere; }
.record-cell small { display: none; }
.toast { position: fixed; z-index: 5; right: 16px; bottom: 16px; width: min(384px, calc(100% - 32px)); display: flex; align-items: flex-start; gap: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow-soft); }
.toast > div { flex: 1; }
.toast p { margin-top: 4px; font-size: 12px; }
[hidden] { display: none !important; }
dialog { width: min(720px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 16px; border: 1px solid var(--line-strong); border-radius: 16px; background: var(--panel); color: var(--ink); }
dialog::backdrop { background: color-mix(in srgb, var(--ink) 64%, transparent); }
#modal-body { margin-top: 12px; display: grid; gap: 12px; }
.modal-actions { justify-content: flex-end; }
.zoom-frame { min-height: 180px; aspect-ratio: 16/9; display: grid; place-items: center; overflow: hidden; border-radius: 10px; background: var(--sunken); }
.zoom-frame > div { text-align: center; color: var(--muted); }
@container (max-width: 690px) {
  .tabs button { padding-inline: 6px; }
  .toolbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .tool-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toolbar .primary { margin-inline-start: 0; }
  .tool-actions > small { text-align: end; padding-inline-end: 4px; }
  .cluster, .records { padding: 12px; }
  .detail-columns { grid-template-columns: minmax(0,1fr); }
  .camera-wall.live { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .record-row { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .record-head { display: none; }
  .record-cell small { display: block; }
}
@media (max-width: 700px) {
  .mast, .shell { padding-inline: 12px; }
}
.shell[data-preview="390"] { padding-inline: 12px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="mast"><div class="frame">
  <div class="brand" id="brand">RLark</div>
  <div class="switches">
    <button id="language" type="button"></button>
    <button id="theme" type="button"></button>
    <select id="viewport"></select>
    <select id="scenario"></select>
  </div>
</div></header>
<div class="shell">
<main class="frame">
  <header class="page-head"><div><div id="page-eyebrow" class="eyebrow"></div><h1 id="page-title"></h1></div></header>
  <div id="tabs" class="tabs" role="group"></div>
  <div class="toolbar">
    <label class="search" id="search-label"><input type="search" id="search"></label>
    <div class="tool-actions" id="tools"></div>
  </div>
  <section id="operations" class="list-state" hidden></section>
  <div id="groups"></div>
  <section class="records" id="admissions" tabindex="-1" aria-labelledby="admission-title"></section>
</main>
</div>
<div id="toast" class="toast" hidden></div>
<dialog id="modal" aria-labelledby="modal-title">
  <header class="detail-head">
    <div><div id="modal-eyebrow" class="eyebrow"></div><h2 id="modal-title"></h2></div>
    <button class="icon" id="modal-close" type="button" autofocus></button>
  </header>
  <div id="modal-body"></div>
</dialog>

  { name: '10-0-2-196', group: 1, type: 'node', uid: '42a9f4b7…1a5d', age: [14, 21], report: 2 },
  { name: '10-0-2-57', group: 1, type: 'node', uid: '4fd62c79…7021', age: [14, 21], report: 2, controlPlane: true },
].map(item => ({ ...item, phase: 'online' }));
const admissions = items.filter(item => item.type === 'robot').map((item, index) => ({
  name: item.name, group: item.group, state: 'joined', issuer: 'admin', time: `2026-11-25 09:${12 + index * 5}`,
}));
const views = [['头部', 'Head'], ['躯干', 'Torso'], ['左腕', 'Left wrist'], ['右腕', 'Right wrist']];
const siteNodes = new Map(items.map(item => [item.name, {
  verified: true,
  cameras: item.type === 'robot' ? views.map((_, view) => {
    if (item.name === 's1u-01-x86' && view > 1) return 'missing';
    if (item.name === 's1u-03-x86' && view === 0) return 'recovering';
    return 'ok';
  }) : null,
}]));
const phaseText = key => ({
  all: t('全部','All'), online: t('在线','Online'), offline: t('离线','Offline'),
  conflict: t('冲突','Conflicts'), retired: t('已移除','Retired'),
})[key];
const actionText = action => ({
  power_on: t('上电','Power on'), power_off: t('下电','Power off'),
  driver_on: t('启动驱动','Start driver'), driver_off: t('关闭驱动','Stop driver'),
  batch_on: t('上电并启动驱动','Power on and start driver'), batch_off: t('关闭驱动并下电','Stop driver and power off'),
})[action];
const cameraText = state => ({
  ok: t('正常','OK'), missing: t('未安装','Not fitted'), recovering: t('恢复中','Recovering'),
  loading: t('读取中','Loading'), unavailable: t('不可用','Unavailable'),
})[state];
const cameraTone = state => state === 'ok' ? 'good' : state === 'recovering' ? 'warn' : '';
const powerText = (state, desired = false) => ({
  powered: desired ? t('仅上电','Powered') : t('已上电','Powered'),
  ready: desired ? t('运行','Run') : t('运行中','Running'), off: t('已下电','Off'),
})[state] || t('未上报','No report');
const statusLabel = state => state === 'loading' ? t('读取中…','Loading…') : t('暂不可用','Unavailable');
const listAvailable = () => !['loading', 'error'].includes(scenario);
const siteState = () => scenario === 'site-loading' ? 'loading' : ['site-unavailable', 'error'].includes(scenario) ? 'unavailable' : scenario === 'loading' ? 'loading' : 'ready';
const loadedItems = () => listAvailable() && scenario !== 'empty' ? items : [];
const loadedAdmissions = () => scenario === 'empty' ? [] : admissions;
const joined = item => loadedAdmissions().find(record => record.name === item.name);
const titleOf = group => t(...group.title);
const iconPaths = {
  boxes: '<path d="M2 7l5-3 5 3-5 3-5-3Zm5 3v5m5-8 5-3 5 3-5 3-5-3Zm5 3v5M7 15l5-3 5 3-5 3-5-3Zm5 3v4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  refresh: '<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5 9a8 8 0 0 1 13-3l2 3M4 15l2 3a8 8 0 0 0 13-3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
  close: '<path d="m6 6 12 12M18 6 6 18"/>',
  server: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 8h.01M7 17h.01"/>',
  camera: '<path d="M14 4h-4L8 7H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  home: '<path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/>',
  check: '<path d="m5 12 4 4L19 6"/>',
  alert: '<path d="M12 8v5m0 3h.01M10.3 4.8 2.8 18a1.5 1.5 0 0 0 1.3 2h15.8a1.5 1.5 0 0 0 1.3-2L13.7 4.8a2 2 0 0 0-3.4 0Z"/>',
  arrow: '<path d="M5 12h14m-6-6 6 6-6 6"/>',
};
function icon(name, size = 16) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]}</svg>`;
}

function pill(label, tone = '') {
  return `<span class="pill ${tone}"><i class="dot" aria-hidden="true"></i>${label}</span>`;
}

function button(label, action, attributes = '', graphic = '') {
  return `<button type="button" data-action="${action}" ${attributes}>${graphic}${label}</button>`;
}

function countMetrics(cluster, members) {
  const site = siteState();
  const robots = members.filter(item => item.type === 'robot');
  const ready = robots.filter(item => item.actual === 'ready').length;
  const cameraIssues = robots.filter(item => siteNodes.get(item.name)?.cameras?.includes('recovering')).length;
  const errorsKnown = site === 'ready' && robots.every(item => siteNodes.get(item.name)?.cameras);
  return {
    total: members.length,
    online: members.filter(item => item.phase === 'online').length,
    conflicts: members.filter(item => item.phase === 'conflict').length,
    joined: site === 'ready' ? members.filter(item => joined(item)?.state === 'joined').length : null,
    robots: robots.length,
    ready: site === 'ready' && robots.every(item => item.actual) ? ready : null,
    cameraIssues: errorsKnown ? cameraIssues : null,
    cluster,
  };
}

function metric(label, value, tone = '') {
  const stateLabel = statusLabel(siteState() === 'ready' ? 'unavailable' : siteState());
  const display = value === null ? `<small title="${stateLabel}" aria-label="${stateLabel}">—</small>` : value;
  return `<div><dt>${label}</dt><dd class="${tone}">${display}</dd></div>`;
}

function statStrip(summary) {
  const metrics = summary.cluster.kind === 'robot' ? [
    [t('机器人','Robots'), summary.robots],
    [t('驱动就绪','Driver ready'), summary.ready, 'good'],
    [t('相机异常机器人','Robots with camera issues'), summary.cameraIssues, summary.cameraIssues ? 'warn' : ''],
  ] : [
    [t('节点','Nodes'), summary.total],
    [t('在线','Online'), summary.online, 'good'],
    [t('冲突','Conflicts'), summary.conflicts, summary.conflicts ? 'danger' : ''],
    [t('已入网','Admitted'), summary.joined],
  ];
  return `<dl class="stats" aria-label="${t('已加载节点统计','Loaded node statistics')}">${metrics.map(row => metric(...row)).join('')}</dl>`;
}

function StationClusterSummary(summary, span) {
  const site = siteState();
  const siteValue = value => value === null ? statusLabel(site === 'ready' ? 'unavailable' : site) : value;
  const onlineShare = 100 * summary.online / summary.total;
  const conflictShare = 100 * summary.conflicts / summary.total;
  const label = t(`在线 ${summary.online} / ${summary.total} · 冲突 ${summary.conflicts}`, `${summary.online} of ${summary.total} online · ${summary.conflicts} conflicts`);
  const facts = [
    [t('节点','Nodes'), summary.total], [t('已入网','Admitted'), siteValue(summary.joined)],
  ];
  if (summary.cluster.kind === 'robot') {
    facts.push([t('驱动就绪','Driver ready'), siteValue(summary.ready)], [t('相机异常机器人','Robots with camera issues'), siteValue(summary.cameraIssues)]);
  }
  return `<aside class="summary" style="grid-column: span ${span}" aria-label="${t('集群摘要','Cluster summary')}">
    <div class="summary-head"><h3>${t('集群摘要','Cluster summary')}</h3><a href="#admissions" data-admissions>${t('查看入网记录','View admission records')} ${icon('arrow', 11)}</a></div>
    <div class="health">
      <div class="health-label"><span>${t('已加载节点','Loaded nodes')}</span><strong>${label}</strong></div>
      <div class="health-track" aria-hidden="true"><span class="online" style="width:${onlineShare}%"></span><span class="conflict" style="width:${conflictShare}%"></span></div>
    </div>
    <div class="summary-metrics">${facts.map(([label, value]) => `<span>${label}<strong>${value}</strong></span>`).join('')}</div>
  </aside>`;
}

function expander(item) {
  const expanded = openKey === item.name;
  const label = expanded ? t('收起详情','Collapse details') : t('展开详情','Expand details');
  return button('', 'detail', `class="icon expander" id="expand-${item.name}" data-node="${item.name}" aria-expanded="${expanded}" aria-controls="detail-${item.name}" aria-label="${label} · ${item.name}" title="${label}"`, icon('chevron'));
}

function cameraState(item, view) {
  const site = siteState();
  return site === 'ready' ? siteNodes.get(item.name)?.cameras?.[view] || 'unavailable' : site;
}

function cameraWall(item, live = false) {
  return `<div class="camera-wall ${live ? 'live' : ''}" role="group" aria-label="${live ? t('实时相机','Live cameras') : t('相机预览','Camera previews')}">
    ${views.map((view, index) => {
      const state = cameraState(item, index);
      const frame = state === 'ok' ? cameraFrames[item.name]?.[index] : '';
      const name = t(...view);
      return `<button type="button" class="camera ${state}" data-action="camera" data-node="${item.name}" data-view="${index}" aria-label="${name} · ${cameraText(state)} · ${item.name}">
        ${frame ? `<img src="${frame}" alt="">` : icon('camera', 19)}
        <span class="camera-cap"><strong>${name}</strong><small class="${cameraTone(state)}"><i class="dot" aria-hidden="true"></i>${cameraText(state)}</small></span>
      </button>`;
    }).join('')}
  </div>`;
}

function factsOf(item) {
  const [days, hours] = item.age;
  return [[t('运行时间','Uptime'), t(`${days} 天 ${hours} 小时`, `${days}d ${hours}h`)], [t('重启次数','Restarts'), 0], [t('最近上报','Last report'), t(`${item.report} 秒前`, `${item.report}s ago`)]];
}

function dataList(facts, className = '') {
  return `<dl class="${className}">${facts.map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
}

function cardMeta(item) {
  const record = joined(item);
  return `<div class="card-meta">${siteNodes.get(item.name)?.verified ? pill(t('已验证','Verified'), 'good') : ''}
    ${siteState() !== 'ready' ? `<span class="dim">${statusLabel(siteState())}</span>` : record ? pill(t('已入网','Admitted'), 'good') : `<span class="dim">${t('未用入网码','No code used')}</span>`}</div>`;
}

function selfCheck(item) {
  return item.name === 's1u-03-x86' ? pill(t('未通过','Failed'), 'danger') : pill(t('通过','Passed'), 'good');
}

function poseTargets(key) {
  return key === 'batch' ? items.filter(item => selected.has(item.name) && visibleItem(item)) : items.filter(item => item.name === key);
}

function poseHint(key) {
  const targets = poseTargets(key);
  const blocked = targets.find(item => item.actual !== 'ready');
  if (blocked) return [blocked.actual === 'off'
    ? t('回位不可用：请先上电','Home pose unavailable: power on first')
    : t('回位不可用：请先启动驱动','Home pose unavailable: start the driver first'), 'warn'];
  if (held?.key === key) return [t('移动中，松开即停。','Moving. Release to stop.'), 'good'];
  const note = poseNotes.get(key);
  if (note === 'short') return [t('按住不放才会移动，松开即停。','Hold the button to move; release to stop.'), ''];
  if (note === 'stopped') return [t('已停止。','Stopped.'), ''];
  return ['', ''];
}

function homeButton(key, scope = 'card') {
  const ready = poseTargets(key).every(item => item.actual === 'ready');
  return button(t('按住回位','Hold home'), 'pose', `data-node="${key}" aria-describedby="pose-hint-${scope === 'detail' ? 'detail-' : ''}${key}" ${ready ? '' : 'disabled'}`, icon('home', 14));
}

function hintSlot(key, scope = 'card') {
  const [hint, tone] = poseHint(key);
  return `<small class="station-card-hint ${tone || 'dim'}" id="pose-hint-${scope === 'detail' ? 'detail-' : ''}${key}" data-hint="${key}" role="status" title="${hint}">${hint}</small>`;
}

function powerButton(action, key) {
  return button(actionText(action), 'power', `data-command="${action}" data-node="${key}" ${pending ? 'disabled' : ''}`);
}

function StationCard(item) {
  const robot = item.type === 'robot';
  const control = item.type === 'control';
  const info = [control ? t('控制面','Control plane') : robot ? 's1u' : item.controlPlane ? t('控制面','Control plane') : '', `<code>UID ${item.uid}</code>`].filter(Boolean).join(' · ');
  return `<article class="card ${control ? 'control-row' : robot ? 'robot-card' : 'stock-card'}" aria-labelledby="name-${item.name}" data-expanded="${openKey === item.name}" data-selected="${selected.has(item.name)}">
    <header class="card-head">
      ${robot ? `<input type="checkbox" data-select="${item.name}" aria-label="${t('选中','Select')} ${item.name}" ${selected.has(item.name) ? 'checked' : ''}>` : ''}
      ${control ? `<span class="control-icon">${icon('server')}</span>` : ''}
      <div class="card-name"><h3 id="name-${item.name}">${item.name}</h3><small class="dim">${info}</small></div>
      ${pill(phaseText(item.phase), item.phase === 'online' ? 'good' : '')}${expander(item)}
    </header>
    ${control ? '' : cardMeta(item)}
    ${robot ? `
      ${dataList([[t('期望','Desired'),powerText(item.desired,true)], [t('实际','Actual'),powerText(item.actual)], [t('自检','Self-check'),selfCheck(item)]], 'robot-facts')}
      ${cameraWall(item)}
      <small class="camera-line dim"><span>${t('相机','Cameras')}</span><span>${openKey === item.name ? t('实时画面在下方','Live frames below') : t('慢速预览 · 5 秒','Preview · 5 s')}</span></small>` : ''}
    ${control ? '' : dataList(factsOf(item), 'facts')}
    ${robot ? `<footer class="station-card-foot"><div class="actions">
      ${item.actual === 'off' ? '' : powerButton(item.actual === 'ready' ? 'driver_off' : 'driver_on', item.name)}
      ${powerButton(item.actual === 'off' ? 'power_on' : 'power_off', item.name)}
      ${homeButton(item.name)}
    </div>${hintSlot(item.name)}</footer>` : ''}
  </article>`;
}

function detail(item) {
  const cluster = groups[item.group];
  const record = joined(item);
  const robot = item.type === 'robot';
  const admission = siteState() !== 'ready' ? statusLabel(siteState()) : record ? t('已入网','Admitted') : t('未用入网码','No code used');
  return `<section id="detail-${item.name}" class="detail" aria-labelledby="detail-title-${item.name}" data-detail="${item.name}">
    <header class="detail-head"><div><div class="eyebrow">${t('节点详情','Node details')}</div>
      <h3 tabindex="-1" id="detail-title-${item.name}">${item.name} ${pill(phaseText(item.phase), 'good')}</h3></div>
      ${button('', 'detail', `class="icon" data-node="${item.name}" aria-label="${t('收起详情','Collapse details')}"`, icon('close'))}
    </header>
    <div class="detail-columns">
      <div><h4>${t('身份','Identity')}</h4>${dataList([[t('集群','Cluster'), titleOf(cluster)], ['Node UID', `<code>${item.uid}</code>`], [t('型号','Model'), robot ? 's1u' : '—']])}</div>
      <div><h4>${t('网络与入网','Network and admission')}</h4>${dataList([[t('网络验证','Network verification'), t('已验证','Verified')], [t('入网状态','Admission status'), admission], [t('发码人','Issued by'), siteState() === 'ready' ? record?.issuer || '—' : '—']])}</div>
      <div><h4>${t('条件','Conditions')}</h4>${dataList([[t('节点连接','Node connection'), pill(phaseText(item.phase), 'good')], [t('最近上报','Last report'), factsOf(item)[2][1]]])}</div>
    </div>
    ${robot ? `<div class="detail-robot"><h4>${t('机器人电源','Robot power')}</h4>
      ${dataList([[t('期望','Desired'), powerText(item.desired,true)], [t('实际','Actual'), powerText(item.actual)], [t('自检','Self-check'), selfCheck(item)]], 'facts')}
      ${item.name === 's1u-03-x86' ? `<small class="warn">${t('相机诊断 · 头部恢复中','Camera diagnostics · Head camera recovering')}</small>` : ''}
      <div class="actions">${['power_on','driver_on','driver_off','power_off'].map(action => powerButton(action,item.name)).join('')}${homeButton(item.name, 'detail')}</div>
      ${hintSlot(item.name, 'detail')}
      <h4>${t('实时相机','Live cameras')}</h4>${cameraWall(item, true)}</div>` : ''}
  </section>`;
}

function visibleItem(item) {
  const query = $('search').value.trim().toLocaleLowerCase();
  const group = groups[item.group];
  return (!phase || phase === item.phase) && (!clusterFilter || clusterFilter === group.id) &&
    (!query || [item.name, item.uid, group.id, ...group.title].some(value => value.toLocaleLowerCase().includes(query)));
}

function batchControls(robots) {
  const chosen = robots.filter(item => selected.has(item.name));
  return `<div class="batch">
    <label class="check"><input type="checkbox" id="select-robots" ${robots.length === chosen.length ? 'checked' : ''}>${t('全选当前集群机器人','Select all robots in this cluster')}</label>
    ${chosen.length ? `<span class="dim">${t(`已选 ${chosen.length} / ${robots.length} 台`, `${chosen.length} of ${robots.length} chosen`)}</span>
      <div class="actions">${powerButton('batch_on','batch')}${powerButton('batch_off','batch')}${homeButton('batch')}</div>${hintSlot('batch')}` : ''}
  </div>`;
}

function clusterGrid(members, kind) {
  return members.length ? `<div class="grid ${kind}-grid" data-members="${members.map(item => item.name).join(' ')}"></div>` : '';
}

function renderGrid(grid) {
  const members = grid.dataset.members.split(' ').map(name => items.find(item => item.name === name));
  const columns = Number(getComputedStyle(grid).getPropertyValue('--columns')) || 1;
  grid.dataset.columns = columns;
  const group = members[0].group;
  const summary = countMetrics(groups[group], loadedItems().filter(item => item.group === group));
  const rows = [];
  for (let start = 0; start < members.length; start += columns) {
    const row = members.slice(start, start + columns);
    const opened = row.find(item => item.name === openKey);
    rows.push(row.map(StationCard).join(''));
    if (row.length < columns) rows.push(StationClusterSummary(summary, columns - row.length));
    if (opened) rows.push(detail(opened));
  }
  grid.innerHTML = rows.join('');
}

const gridObserver = new ResizeObserver(entries => {
  for (const { target } of entries) {
    const columns = getComputedStyle(target).getPropertyValue('--columns').trim();
    if (target.isConnected && columns !== target.dataset.columns) {
      releasePose();
      renderGrid(target);
    }
  }
});

function renderOverview() {
  const loaded = loadedItems();
  const visible = loaded.filter(visibleItem);
  const known = listAvailable();
  $('tabs').innerHTML = ['all','online','offline','conflict','retired'].map(key => {
    const value = key === 'all' ? '' : key;
    const count = known ? loaded.filter(item => !value || item.phase === value).length : '—';
    return button(`${phaseText(key)} <b>${count}</b>`, 'phase', `data-phase="${value}" aria-pressed="${phase === value}"`);
  }).join('');
  $('tools').innerHTML = `${button(t('刷新','Refresh'), 'refresh', '', icon('refresh', 15))}
    <small class="dim" aria-live="polite">${known ? t(`${visible.length} 条结果`, `${visible.length} results`) : statusLabel(scenario === 'loading' ? 'loading' : 'unavailable')}</small>
    <select id="cluster-filter" aria-label="${t('成员集群','Member cluster')}">
      <option value="">${t('所有集群','All clusters')}</option>${groups.map(group => `<option value="${group.id}" ${clusterFilter === group.id ? 'selected' : ''}>${titleOf(group)}</option>`).join('')}
    </select>
    ${button(t('节点操作','Node operations'),'operations', `aria-controls="operations" aria-expanded="${operationsOpen}" ${clusterFilter ? '' : 'disabled'}`)}
    ${button(t('机器人型号','Robot models'),'models')}
    ${button(t('加入节点','Add node'),'add', 'class="primary"', icon('plus', 15))}`;
  $('operations').hidden = !clusterFilter || !operationsOpen;
  $('operations').innerHTML = `<h2>${t('节点操作','Node operations')}</h2><p class="dim">${t('暂无操作记录','No operation records')}</p>`;

  gridObserver.disconnect();
  if (!known || !visible.length) {
    const loading = scenario === 'loading';
    const error = scenario === 'error';
    $('groups').innerHTML = `<div class="list-state ${error ? 'danger' : 'dim'}" role="${error ? 'alert' : 'status'}" aria-busy="${loading}">
      ${loading ? t('正在加载场站节点…','Loading site nodes…') : error ? t('场站节点暂不可用','Site nodes are unavailable') : t('没有匹配的场站节点','No matching site nodes')}
      ${error ? button(t('重试','Retry'),'refresh') : ''}</div>`;
    return;
  }
  $('groups').innerHTML = groups.map((group, index) => {
    const members = visible.filter(item => item.group === index);
    if (!members.length) return '';
    const metrics = countMetrics(group, loaded.filter(item => item.group === index));
    const control = members.find(item => item.type === 'control');
    const robots = members.filter(item => item.type === 'robot');
    const stock = members.filter(item => item.type === 'node');
    const eyebrow = group.kind === 'robot' ? t('机器人集群','Robot cluster') : t('节点库存','Node inventory');
    return `<section class="cluster" aria-labelledby="group-${index}">
      <header class="cluster-head"><div><div class="eyebrow">${eyebrow}</div><h2 id="group-${index}">${titleOf(group)}</h2><code class="cluster-id">${group.id}</code></div>${statStrip(metrics)}</header>
      ${control ? StationCard(control) : ''}${control && control.name === openKey ? detail(control) : ''}
      ${robots.length ? batchControls(robots) : ''}
      ${clusterGrid(robots,'robot')}${clusterGrid(stock,'stock')}
    </section>`;
  }).join('');
  document.querySelectorAll('.grid').forEach(grid => {
    renderGrid(grid);
    gridObserver.observe(grid);
  });
  if ($('select-robots')) {
    const chosen = visible.filter(item => item.type === 'robot' && selected.has(item.name)).length;
    $('select-robots').indeterminate = chosen > 0 && !$('select-robots').checked;
  }
}

function renderAdmissions() {
  const state = siteState();
  const records = loadedAdmissions();
  const headings = [t('节点','Node'), t('集群','Cluster'), t('发码时间','Issued at'), t('状态','Status')];
  const rows = records.map(record => `<div class="record-row" role="row">${[
    `<strong>${record.name}</strong>`, titleOf(groups[record.group]), record.time, pill(t('已入网','Admitted'),'good'),
  ].map((value, index) => `<div class="record-cell" role="cell"><small class="dim">${headings[index]}</small>${value}</div>`).join('')}</div>`).join('');
  $('admissions').innerHTML = `<header class="records-head"><div><h2 id="admission-title">${t('入网记录','Admission records')}</h2>
    <small class="dim">${t('发码和使用状态 · 入网码本身不会保存','Issued and redemption status · codes are never stored')}</small></div>
    <small class="pill">${state === 'ready' ? t(`${records.length} 条记录`, `${records.length} records`) : statusLabel(state)}</small></header>
    ${state !== 'ready' ? `<p role="status" class="dim">${state === 'loading' ? t('正在读取入网记录…','Loading admission records…') : t('入网记录暂不可用','Admission records are unavailable')}</p>`
      : records.length ? `<div role="table" aria-labelledby="admission-title"><div class="record-row record-head dim" role="row">${headings.map(label => `<span role="columnheader">${label}</span>`).join('')}</div>${rows}</div>`
      : `<p class="dim">${t('暂无入网记录','No admission records')}</p>`}`;
}

function renderChrome() {
  document.documentElement.lang = t('zh-CN', 'en');
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.title = t('场站节点 · RLark', 'Site nodes · RLark');
  $('language').textContent = t('中文 / EN','EN / 中文');
  $('language').setAttribute('aria-label', t('切换为英文','Switch to Chinese'));
  $('theme').textContent = dark ? t('深色','Dark') : t('浅色','Light');
  $('theme').setAttribute('aria-label', t('切换明暗主题','Toggle light and dark theme'));
  $('theme').setAttribute('aria-pressed', String(dark));
  $('page-eyebrow').textContent = t('管理控制台','Administration');
  $('page-title').textContent = t('场站节点','Site nodes');
  $('tabs').setAttribute('aria-label', t('按状态筛选','Filter by status'));
  $('search').placeholder = t('搜索节点名或 UID','Search node or UID');
  $('search').setAttribute('aria-label', $('search').placeholder);
  $('viewport').setAttribute('aria-label', t('预览宽度','Preview width'));
  $('viewport').options[0].textContent = t('自适应宽度','Fit window');
  $('scenario').setAttribute('aria-label', t('原型数据状态','Prototype data state'));
  $('scenario').innerHTML = [
    ['ready', t('样例数据','Sample data')], ['loading', t('列表加载中','List loading')],
    ['empty', t('列表为空','Empty list')], ['error', t('列表不可用','List unavailable')],
    ['site-loading', t('入网与相机加载中','Site data loading')],
    ['site-unavailable', t('入网与相机不可用','Site data unavailable')],
    ['power-error', t('电源下发失败','Power request failure')],
  ].map(([value,label]) => `<option value="${value}">${label}</option>`).join('');
  $('scenario').value = scenario;
}

function render() {
  renderChrome();
  renderOverview();
  renderAdmissions();
  renderToast();
}

function renderToast() {
  const node = $('toast');
  node.hidden = !toast;
  if (!toast) return;
  const sending = toast.state === 'pending';
  const failed = toast.state === 'error';
  const title = sending ? t('正在下发','Sending command') : failed ? t('操作失败','Action failed') : t('操作已下发','Action sent');
  const message = sending ? actionText(toast.action) : failed
    ? t('模拟请求失败，期望状态未更新。','The simulated request failed. Desired state is unchanged.')
    : t('期望状态已更新，等待机器人跟进。','Desired state updated. Waiting for the robots to converge.');
  node.setAttribute('role', failed ? 'alert' : 'status');
  node.innerHTML = `<span class="${failed ? 'danger' : sending ? 'dim' : 'good'}">${icon(failed ? 'alert' : sending ? 'refresh' : 'check', 19)}</span>
    <div><strong>${title}</strong><p>${message}</p></div>
    ${sending ? '' : button('', 'dismiss', `class="icon" aria-label="${t('关闭提示','Dismiss notification')}"`, icon('close'))}`;
}

function openModal(trigger, eyebrow, title, body) {
  modalTrigger = trigger;
  $('modal-eyebrow').textContent = eyebrow;
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = body;
  $('modal-close').innerHTML = icon('close');
  $('modal-close').setAttribute('aria-label', t('关闭','Close'));
  $('modal').showModal();
}

function openCamera(trigger) {
  const item = items.find(item => item.name === trigger.dataset.node);
  const view = Number(trigger.dataset.view);
  const state = cameraState(item, view);
  const name = t(...views[view]);
  const frame = state === 'ok' ? cameraFrames[item.name]?.[view] : '';
  openModal(trigger, item.name, `${name} · ${t('相机','Camera')}`,
    `<div class="zoom-frame">${frame ? `<img class="zoom-image" src="${frame}" alt="${name}">` : `<div>${icon('camera',28)}<p>${state === 'missing' ? t('这台机器人没有安装此相机','This camera is not fitted') : cameraText(state)}</p></div>`}</div>
      <div class="batch">${pill(cameraText(state),cameraTone(state))}<small class="dim">${t('原型相机样例','Prototype camera sample')}</small></div>`);
  if (frame) cameraTimer = window.setInterval(() => {
    if (!document.hidden) $('modal-body').querySelector('img').src = frame;
  }, 1500);
}

function requestPower(trigger) {
  if (pending) return;
  const action = trigger.dataset.command;
  const key = trigger.dataset.node;
  const targets = poseTargets(key);
  openModal(trigger, t('模拟机器人操作','Simulated robot operation'), actionText(action),
    `<p><strong>${targets.map(item => item.name).join(t('、', ', '))}</strong></p>
    <p>${t('请确认机器人周围安全，现场有人守着急停。','Make sure the surroundings are safe and someone is at each emergency stop.')}</p>
    <div class="actions modal-actions">${button(t('取消','Cancel'),'cancel')}
    ${button(t('确认下发','Confirm'),'confirm', `class="primary" data-command="${action}" data-node="${key}"`)}</div>`);
}

function applyPower(action, key) {
  const targets = poseTargets(key);
  const fail = scenario === 'power-error';
  $('modal').close();
  releasePose();
  pending = true;
  toast = { state: 'pending', action, key };
  document.querySelectorAll('[data-action="power"]').forEach(button => { button.disabled = true; });
  renderToast();
  window.setTimeout(() => {
    if (!fail) for (const item of targets) {
      item.desired = ({
        power_on: item.desired === 'off' ? 'powered' : item.desired,
        power_off: 'off',
        driver_on: 'ready',
        driver_off: item.desired === 'off' ? 'off' : 'powered',
        batch_on: 'ready',
        batch_off: 'off',
      })[action];
      poseNotes.delete(item.name);
    }
    pending = false;
    toast = { state: fail ? 'error' : 'success', action, key };
    renderToast();
    redrawOverview();
    if (!fail) window.setTimeout(() => {
      for (const item of targets) item.actual = item.desired;
      if (held && poseTargets(held.key).some(item => item.actual !== 'ready')) releasePose();
      redrawOverview();
    }, 850);
  }, 420);
}

function syncHints(key) {
  const [hint, tone] = poseHint(key);
  document.querySelectorAll(`[data-hint="${key}"]`).forEach(slot => {
    slot.textContent = hint;
    slot.title = hint;
    slot.className = `station-card-hint ${tone || 'dim'}`;
  });
}

function pressPose(button, input) {
  if (held || button.disabled) return;
  const key = button.dataset.node;
  if (poseTargets(key).some(item => item.actual !== 'ready')) return;
  poseNotes.delete(key);
  held = { key, button, at: performance.now(), input };
  button.setAttribute('aria-pressed', 'true');
  button.classList.add('primary');
  syncHints(key);
}

function releasePose() {
  if (!held) return;
  const { key, button, at } = held;
  held = null;
  button.setAttribute('aria-pressed', 'false');
  button.classList.remove('primary');
  poseNotes.set(key, performance.now() - at < 400 ? 'short' : 'stopped');
  syncHints(key);
}

function toggleDetail(key) {
  const opening = openKey !== key;
  openKey = opening ? key : '';
  redrawOverview(false);
  $(opening ? `detail-title-${key}` : `expand-${key}`)?.focus({ preventScroll: true });
}

function redrawOverview(restoreFocus = true) {
  const active = document.activeElement;
  const id = active.id;
  const dataset = { ...active.dataset };
  releasePose();
  renderOverview();
  if (!restoreFocus || active.isConnected) return;
  const attributes = ['action', 'command', 'node', 'phase', 'select', 'view']
    .filter(key => Object.hasOwn(dataset, key))
    .map(key => `[data-${key}="${CSS.escape(dataset[key])}"]`).join('');
  const replacement = (id && $(id)) || (attributes && document.querySelector(attributes));
  if (replacement && !replacement.disabled) replacement.focus({ preventScroll: true });
  if (replacement?.disabled && dataset.node) $(`expand-${dataset.node}`)?.focus({ preventScroll: true });
}

$('brand').insertAdjacentHTML('afterbegin', icon('boxes', 19));
$('search-label').insertAdjacentHTML('afterbegin', icon('search'));
$('viewport').innerHTML = '<option value=""></option><option>2000</option><option>1440</option><option>390</option>';
$('viewport').addEventListener('change', event => {
  const width = event.target.value;
  document.querySelector('.shell').dataset.preview = width;
  if (width) {
    document.documentElement.style.setProperty('--demo-width', `${width}px`);
  } else {
    document.documentElement.style.removeProperty('--demo-width');
  }
});
$('search').addEventListener('input', () => redrawOverview());
$('language').addEventListener('click', () => { zh = !zh; releasePose(); render(); });
$('theme').addEventListener('click', () => { dark = !dark; renderChrome(); });
$('scenario').addEventListener('change', event => {
  scenario = event.target.value;
  openKey = '';
  releasePose();
  render();
});
$('modal-close').addEventListener('click', () => $('modal').close());
$('modal').addEventListener('close', () => {
  clearInterval(cameraTimer);
  if (modalTrigger?.disabled) {
    const key = modalTrigger.dataset.node;
    $(key === 'batch' ? 'select-robots' : `expand-${key}`)?.focus({ preventScroll: true });
  } else {
    modalTrigger?.focus({ preventScroll: true });
  }
  modalTrigger = null;
});

document.addEventListener('change', event => {
  const input = event.target;
  if (input.id === 'cluster-filter') {
    clusterFilter = input.value;
    operationsOpen = false;
    redrawOverview();
  } else if (input.id === 'select-robots' || input.dataset.select) {
    const affected = input.dataset.select ? [input.dataset.select] : items.filter(item => item.type === 'robot' && visibleItem(item)).map(item => item.name);
    for (const key of affected) {
      if (input.checked) selected.add(key);
      else selected.delete(key);
    }
    redrawOverview();
  }
});

document.addEventListener('click', event => {
  const link = event.target.closest('[data-admissions]');
  if (link) {
    event.preventDefault();
    $('admissions').focus();
    $('admissions').scrollIntoView({ block: 'start' });
    return;
  }
  const trigger = event.target.closest('button[data-action]');
  if (!trigger) return;
  const { action, node, command } = trigger.dataset;
  switch (action) {
    case 'phase':
      phase = trigger.dataset.phase;
      redrawOverview();
      break;
    case 'detail': toggleDetail(node); break;
    case 'camera': openCamera(trigger); break;
    case 'power': requestPower(trigger); break;
    case 'confirm': applyPower(command, node); break;
    case 'cancel': $('modal').close(); break;
    case 'dismiss': {
      const key = toast?.key;
      toast = null;
      renderToast();
      if (key) $(key === 'batch' ? 'select-robots' : `expand-${key}`)?.focus({ preventScroll: true });
      break;
    }
    case 'operations':
      operationsOpen = !operationsOpen;
      redrawOverview();
      break;
    case 'refresh':
      scenario = 'loading';
      render();
      window.setTimeout(() => {
        if (scenario === 'loading') { scenario = 'ready'; render(); }
      }, 550);
      break;
    case 'models':
      openModal(trigger, t('场站节点','Site nodes'), t('机器人型号','Robot models'), '<p>s1u</p>');
      break;
    case 'add':
      openModal(trigger, t('场站节点','Site nodes'), t('加入节点','Add node'),
        `<p>${t('选择待加入的成员集群。','Select the member cluster to join.')}</p><select aria-label="${t('成员集群','Member cluster')}">${groups.map(group => `<option>${titleOf(group)}</option>`).join('')}</select>`);
      break;
  }
});
document.addEventListener('pointerdown', event => {
  const button = event.target.closest('[data-action="pose"]');
  if (button && event.button === 0) pressPose(button, 'pointer');
});
document.addEventListener('pointerout', event => {
  if (held?.input === 'pointer' && held.button.contains(event.target) && !held.button.contains(event.relatedTarget)) releasePose();
});
for (const event of ['pointerup','pointercancel']) {
  window.addEventListener(event, () => { if (held?.input === 'pointer') releasePose(); });
}
window.addEventListener('blur', releasePose);
document.addEventListener('visibilitychange', () => { if (document.hidden) releasePose(); });
document.addEventListener('focusout', event => { if (held?.button === event.target) releasePose(); });
document.addEventListener('keydown', event => {
  const button = event.target.closest('[data-action="pose"]');
  if (button && [' ', 'Enter'].includes(event.key)) {
    event.preventDefault();
    if (!event.repeat) pressPose(button, 'keyboard');
  }
  if (event.key === 'Escape' && !$('modal').open) {
    if (held) releasePose();
    else if (openKey && (event.target.closest('[data-detail]') || event.target.closest('.card')?.dataset.expanded === 'true')) {
      event.preventDefault();
      toggleDetail(openKey);
    }
  }
});
document.addEventListener('keyup', event => {
  if (held?.input === 'keyboard' && [' ', 'Enter'].includes(event.key)) releasePose();
});
window.setInterval(() => {
  if (document.hidden) return;
  document.querySelectorAll('.camera-wall:not(.live) img').forEach(frame => { frame.src = frame.getAttribute('src'); });
}, 5000);
render();
</script>
</body>
</html>
