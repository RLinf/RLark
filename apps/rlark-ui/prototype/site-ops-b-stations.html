<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RLark · 场站节点</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171b25;
      --muted: #7c8492;
      --soft: #a9b0bd;
      --line: #e7ebf0;
      --line-strong: #dce2ea;
      --panel: #fff;
      --canvas: #f4f6f9;
      --hover: #f5f0fe;
      --blue: #7c3aed;
      --blue-2: #a78bfa;
      --blue-bg: #efe9fd;
      --green: #36c98f;
      --green-soft: #e7f8f1;
      --red: #ef5a7a;
      --orange: #f59e35;
      --shadow-soft: 0 8px 24px rgba(28,39,58,.055);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow-x: clip; }
    body { background: var(--canvas); color: var(--ink); font: 13px/1.45 Inter, "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button, select { color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    :focus-visible { outline: 3px solid var(--blue-2); outline-offset: 2px; }
    .theme-dark {
      color-scheme: dark;
      --ink: #f5f7fb;
      --muted: #9ca8ba;
      --line: #273348;
      --line-strong: #34435a;
      --panel: #151d2b;
      --canvas: #0f1623;
      --blue: #a78bfa;
      --blue-bg: rgba(167,139,250,.18);
      --hover: rgba(167,139,250,.08);
    }
    .shell-sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; width: 256px; display: flex; flex-direction: column; padding: 19px 16px 14px; border-right: 1px solid var(--line); background: var(--panel); }
    .brand { display: flex; align-items: center; gap: 10px; min-height: 45px; margin: 0 10px 24px; color: var(--blue); font-size: 25px; font-weight: 800; letter-spacing: -.7px; }
    .brand-mark { width: 35px; height: 35px; display: grid; place-items: center; border: 2px solid var(--blue); border-radius: 50%; }
    .brand-mark svg { width: 22px; }
    .nav-caption { margin: 0 10px 8px; color: var(--soft); font-size: 10px; font-weight: 800; }
    .nav-list { display: grid; gap: 4px; }
    .nav-item { display: flex; align-items: center; gap: 12px; min-height: 43px; padding: 0 11px; border-radius: 12px; color: #596579; font-weight: 650; text-decoration: none; white-space: nowrap; }
    .nav-item svg { width: 17px; height: 17px; flex: none; }
    .nav-item:hover { background: var(--hover); color: var(--ink); }
    .nav-item.active { background: var(--blue-bg); color: var(--blue); }
    .nav-item.active::before { position: absolute; left: 0; width: 4px; height: 28px; border-radius: 0 4px 4px 0; background: var(--blue); content: ""; }
    .sidebar-bottom { margin-top: auto; }
    .sidebar-bottom button.nav-item { width: 100%; border: 0; background: transparent; font: inherit; text-align: left; }
    body.sidebar-collapsed .shell-sidebar { width: 80px; align-items: center; padding-right: 8px; padding-left: 8px; }
    body.sidebar-collapsed .brand { width: 42px; justify-content: center; margin-right: 0; margin-left: 0; font-size: 0; }
    body.sidebar-collapsed .brand-word, body.sidebar-collapsed .nav-caption, body.sidebar-collapsed .nav-item span { display: none; }
    body.sidebar-collapsed .nav-item { justify-content: center; width: 46px; margin-right: auto; margin-left: auto; padding: 0; }
    body.sidebar-collapsed .nav-item.active::before { left: -8px; }
    body.sidebar-collapsed .shell-main { width: calc(100% - 80px); margin-left: 80px; }
    .shell-main { width: calc(100% - 256px); min-height: 100vh; margin-left: 256px; }
    .topbar { position: sticky; z-index: 20; top: 0; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 28px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .topbar-current { display: grid; gap: 2px; }
    .topbar-current small { color: var(--soft); font-size: 10px; font-weight: 700; }
    .topbar-current strong { font-size: 14px; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .topbar-toggle { display: inline-flex; align-items: center; gap: 4px; padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
    .topbar-toggle button { min-height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; }
    .topbar-toggle button.active { background: var(--blue-bg); color: var(--blue); }
    .topbar-icon { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--panel); border-radius: 50%; background: #f6d8c5; color: #604632; font-size: 11px; font-weight: 800; }
    .page-content { display: grid; align-content: start; gap: 18px; min-width: 0; padding: 28px; padding-bottom: 52px; }
    .page-a, .page-b { display: grid; align-content: start; gap: 18px; min-width: 0; }
    .hero { position: relative; min-height: 158px; display: flex; align-items: center; justify-content: space-between; gap: 28px; padding: 24px 28px; overflow: hidden; border: 1px solid rgba(124,58,237,.12); border-radius: 22px; background: radial-gradient(circle at 78% -25%, rgba(124,58,237,.16), transparent 40%), linear-gradient(135deg, var(--panel) 28%, var(--blue-bg) 100%); box-shadow: var(--shadow-soft); }
    .hero::after { position: absolute; top: -172px; right: 8%; width: 260px; height: 260px; border: 40px solid rgba(124,58,237,.045); border-radius: 50%; content: ""; pointer-events: none; }
    .hero-copy, .hero-side { position: relative; z-index: 1; }
    .eyebrow { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 750; }
    .hero h1 { margin: 6px 0; font-size: 28px; line-height: 1.15; letter-spacing: -.5px; }
    .hero p { max-width: 620px; margin: 0; color: var(--muted); font-size: 13px; }
    .hero-side { display: grid; justify-items: end; gap: 11px; min-width: 260px; }
    .hero-empty-note { color: var(--muted); font-size: 10px; text-align: right; }
    .hero-empty-note a { color: var(--blue); font-weight: 700; }
    .health-summary { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--panel) 85%, transparent); }
    .health-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 14%, transparent); }
    .health-summary strong { font-size: 12px; }
    .health-summary small, .hero-side > small { color: var(--muted); font-size: 11px; }
    .health-summary-copy { display: grid; gap: 1px; }
    .primary-button, .secondary-button, .quiet-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font-weight: 700; white-space: nowrap; }
    .primary-button { border-color: var(--blue); background: var(--blue); color: var(--panel); box-shadow: 0 8px 18px rgba(124,58,237,.18); }
    .primary-button:hover { filter: brightness(1.04); }
    .secondary-button:hover, .quiet-button:hover { border-color: var(--line-strong); background: var(--hover); }
    .button-icon { display: inline-grid; place-items: center; }
    .overview-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
    .overview-card { min-width: 0; min-height: 94px; display: grid; grid-template-columns: 40px minmax(0,1fr); align-items: center; gap: 12px; padding: 15px 17px; border: 1px solid var(--line); border-radius: 17px; background: var(--panel); box-shadow: var(--shadow-soft); }
    .overview-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--blue-bg); color: var(--blue); }
    .overview-card.green .overview-icon { background: var(--green-soft); color: #168a61; }
    .overview-card.orange .overview-icon { background: color-mix(in srgb, var(--orange) 15%, var(--panel)); color: #bf751c; }
    .overview-card.red .overview-icon { background: color-mix(in srgb, var(--red) 14%, var(--panel)); color: #cf3f61; }
    .overview-card small, .overview-card strong, .overview-card em { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .overview-card small { color: var(--muted); font-size: 10px; font-weight: 750; }
    .overview-card strong { margin-top: 1px; font-size: 22px; line-height: 1.15; }
    .overview-card em { margin-top: 3px; color: var(--soft); font-size: 10px; font-style: normal; }
    .filters { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .phase-tabs { flex: none; display: flex; align-items: center; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); }
    .phase-tab { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .phase-tab b { min-width: 18px; padding: 1px 5px; border-radius: 999px; background: var(--canvas); color: var(--muted); font-size: 10px; text-align: center; }
    .phase-tab.active { background: var(--blue-bg); color: var(--blue); }
    .search-field, .select-field { display: flex; align-items: center; gap: 8px; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--muted); }
    .search-field { flex: 1 1 210px; }
    .search-field input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 12px; }
    .search-field input::placeholder { color: var(--soft); }
    .select-field { flex: 0 1 190px; }
    .select-field select { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 12px; font-weight: 700; }
    .result-count { flex: none; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; }
    .toolbar-actions .secondary-button { min-height: 40px; padding: 0 11px; font-size: 12px; }
    .inventory-panel, .lower-panel, .cluster-section { min-width: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: var(--shadow-soft); }
    .panel-heading { min-height: 61px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 17px; border-bottom: 1px solid var(--line); }
    .panel-heading h2, .panel-heading h3 { margin: 0; font-size: 16px; }
    .panel-heading p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .panel-heading small { color: var(--muted); font-size: 11px; }
    .count-pill { flex: none; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--canvas); color: var(--muted); font-size: 10px; font-weight: 750; }
    .robot-bar { min-height: 51px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 15px; border-bottom: 1px solid var(--line); }
    .robot-summary { display: inline-flex; align-items: center; gap: 8px; margin-right: auto; font-weight: 750; }
    .robot-bar .secondary-button { min-height: 32px; padding: 0 10px; font-size: 11px; }
    .table-scroll { width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    .node-table { min-width: 1280px; table-layout: auto; }
    @media (min-width: 761px) and (max-width: 1500px) {
      .node-table { min-width: 0; table-layout: fixed; }
      .node-table th, .node-table td { padding-right: 6px; padding-left: 6px; font-size: 10px; }
      .node-table th:nth-child(1), .node-table td:nth-child(1) { width: 3%; }
      .node-table th:nth-child(2), .node-table td:nth-child(2) { width: 19%; }
      .node-table th:nth-child(3), .node-table td:nth-child(3) { width: 16%; }
      .node-table th:nth-child(4), .node-table td:nth-child(4) { width: 8%; }
      .node-table th:nth-child(5), .node-table td:nth-child(5) { width: 11%; }
      .node-table th:nth-child(6), .node-table td:nth-child(6) { width: 10%; }
      .node-table th:nth-child(7), .node-table td:nth-child(7) { display: none; }
      .node-table th:nth-child(8), .node-table td:nth-child(8) { width: 10%; }
      .node-table th:nth-child(9), .node-table td:nth-child(9) { width: 5%; }
      .node-table th:nth-child(10), .node-table td:nth-child(10) { width: 9%; }
      .node-table th:nth-child(11), .node-table td:nth-child(11) { width: 9%; }
      .node-identity { min-width: 0; }
    }
    th { height: 42px; padding: 0 10px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--canvas) 54%, var(--panel)); color: var(--muted); font-size: 10px; font-weight: 750; white-space: nowrap; }
    td { min-height: 58px; padding: 10px; border-bottom: 1px dashed var(--line); color: var(--ink); font-size: 11px; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.node-row { cursor: pointer; }
    tbody tr.node-row:hover, tbody tr.node-row:focus { background: var(--hover); }
    .check-cell { width: 38px; text-align: center; }
    input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: var(--blue); vertical-align: middle; }
    .node-identity { min-width: 200px; display: grid; gap: 3px; }
    .node-title-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .node-title-line strong { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .uid-chip { max-width: 168px; display: inline-block; overflow: hidden; padding: 3px 6px; border-radius: 6px; background: var(--canvas); color: var(--muted); text-overflow: ellipsis; vertical-align: middle; }
    .control-badge { display: inline-flex; padding: 2px 6px; border-radius: 999px; background: var(--blue-bg); color: var(--blue); font-size: 9px; font-weight: 750; }
    .status { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 750; white-space: nowrap; }
    .status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-online { background: var(--green-soft); color: #12865c; }
    .status-pending { background: color-mix(in srgb, var(--orange) 13%, var(--panel)); color: #a96313; }
    .status-failed { background: color-mix(in srgb, var(--red) 13%, var(--panel)); color: #c23858; }
    .status-stopped { background: var(--canvas); color: var(--muted); }
    .network-verified { color: #168a61; }
    .network-failed { color: #cf3f61; }
    .network-unknown { color: var(--muted); }
    .admission-chip { display: inline-flex; align-items: center; min-height: 22px; padding: 3px 8px; border-radius: 999px; background: var(--green-soft); color: #12865c; font-size: 10px; font-weight: 750; }
    .admission-chip.pending { background: color-mix(in srgb, var(--orange) 13%, var(--panel)); color: #a96313; }
    .admission-chip.expired, .admission-chip.revoked { background: var(--canvas); color: var(--muted); }
    .muted { color: var(--muted); }
    .table-footer { min-height: 47px; display: flex; align-items: center; justify-content: center; padding: 7px; border-top: 1px solid var(--line); }
    .table-footer button { min-height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--muted); font-size: 11px; font-weight: 700; }
    .empty-state { min-height: 142px; display: grid; align-content: center; justify-items: center; gap: 7px; padding: 20px; text-align: center; }
    .empty-state strong { font-size: 14px; }
    .empty-state p { max-width: 400px; margin: 0; color: var(--muted); font-size: 12px; }
    .empty-state .secondary-button, .empty-state .primary-button { margin-top: 4px; }
    .lower-deck.is-ledger-only { grid-template-columns: 1fr; }
    .lower-deck { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(300px,.8fr); align-items: start; gap: 16px; }
    .lower-panel { overflow: hidden; }
    .ledger-scroll { overflow-x: auto; }
    .ledger-table { min-width: 760px; }
    .ledger-table th { padding: 0 11px; }
    .ledger-table td { padding: 10px 11px; vertical-align: top; }
    .ledger-node { display: grid; gap: 4px; max-width: 210px; }
    .ledger-node small { overflow-wrap: anywhere; white-space: normal; }
    .ledger-actions { display: flex; flex-wrap: wrap; gap: 3px; }
    .table-action { min-height: 27px; padding: 0 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--blue); font-size: 10px; font-weight: 700; white-space: nowrap; }
    .table-action.danger { color: #c23858; }
    .attention-content { padding: 13px 15px; }
    .attention-group + .attention-group { margin-top: 14px; }
    .attention-group > strong { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; font-size: 12px; }
    .attention-item, .operation-item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; min-height: 39px; padding: 7px 0; border-top: 1px solid var(--line); }
    .attention-item > span:first-child, .operation-main { min-width: 0; display: grid; gap: 2px; }
    .attention-item small, .operation-main small { color: var(--muted); font-size: 10px; }
    .operation-item { grid-template-columns: 1fr auto; }
    .operation-item button { padding: 0; border: 0; background: transparent; color: var(--ink); text-align: left; }
    .operation-item details { grid-column: 1 / -1; color: var(--muted); font-size: 10px; }
    .operation-item summary { cursor: pointer; }
    .operation-item details p { margin: 5px 0 0; }
    .lower-empty { padding: 14px 0 4px; color: var(--muted); font-size: 11px; }
    .cluster-list { display: grid; gap: 15px; }
    .cluster-section { overflow: hidden; }
    .cluster-heading { min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 17px; border-bottom: 1px solid var(--line); }
    .cluster-title { min-width: 0; }
    .cluster-title h2 { margin: 0; overflow-wrap: anywhere; font-size: 16px; }
    .cluster-title small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }
    .cluster-metrics { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .cluster-metric { display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .cluster-metric strong { color: var(--ink); }
    .node-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); grid-auto-rows: 1fr; align-items: stretch; gap: 11px; padding: 13px; }
    .node-card { position: relative; min-width: 0; display: grid; align-content: start; grid-template-rows: auto 1fr auto; gap: 11px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); text-align: left; cursor: pointer; transition: border-color .14s ease, background .14s ease; }
    .node-card:hover { border-color: color-mix(in srgb, var(--blue) 40%, var(--line)); background: var(--hover); }
    .node-card.is-selected { border-color: var(--blue); box-shadow: 0 0 0 2px color-mix(in srgb, var(--blue) 13%, transparent); }
    .node-card-head { min-width: 0; display: flex; justify-content: space-between; gap: 8px; }
    .node-card-name { min-width: 0; display: grid; gap: 4px; }
    .node-card-name strong { overflow-wrap: anywhere; font-size: 13px; }
    .node-card-name code { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-card-state { flex: none; }
    .node-card-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 9px; border-top: 1px solid var(--line); }
    .node-card-details > span { min-width: 0; display: grid; gap: 3px; }
    .node-card-details small { color: var(--muted); font-size: 9px; }
    .node-card-details strong, .node-card-details code { min-width: 0; font-size: 10px; }
    .node-card-details .status, .node-card-details .admission-chip { max-width: 100%; justify-self: start; white-space: normal; overflow-wrap: anywhere; }
    .node-card-details .network-verified, .node-card-details .network-failed, .node-card-details .network-unknown { white-space: normal; overflow-wrap: anywhere; }
    .node-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 10px; }
    .card-select { display: inline-flex; align-items: center; gap: 6px; }
    .health-strip { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; }
    .health-stat { min-height: 72px; display: flex; align-items: center; gap: 10px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); box-shadow: var(--shadow-soft); }
    .health-stat strong { display: block; font-size: 20px; line-height: 1.1; }
    .health-stat small { color: var(--muted); font-size: 10px; }
    .health-stat.conflict { border-color: color-mix(in srgb, var(--red) 30%, var(--line)); }
    .health-stat.conflict strong { color: #c23858; }
    .board-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
    .board-toolbar .phase-tabs { margin-right: auto; }
    .board-toolbar .search-field { flex: 1 1 220px; }
    .board-lower { margin-top: 1px; }
    .admissions-collapsible > summary { list-style: none; }
    .admissions-collapsible > summary::-webkit-details-marker { display: none; }
    .summary-button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 18px; border: 0; background: transparent; text-align: left; cursor: pointer; }
    .summary-button > span:first-child { display: grid; gap: 3px; }
    .summary-button strong { font-size: 15px; }
    .summary-button small { color: var(--muted); font-size: 11px; }
    .admissions-collapsible[open] .summary-button { border-bottom: 1px solid var(--line); }
    .admissions-inner { padding: 0 14px 14px; }
    .drawer-backdrop { position: fixed; z-index: 80; inset: 0; background: rgba(12,18,29,.42); }

        if (event.target.id === "scenario") { state.scenario = event.target.value; state.phase = "all"; state.cluster = "all"; state.query = ""; state.shown = 8; state.selectedRobots = new Set(nodesByScenario[state.scenario].filter(n => n.robot).slice(0,1).map(n => n.id)); render(); }
        if (event.target.id === "theme") { state.theme = event.target.value; render(); }
        if (event.target.id === "language") { state.lang = event.target.value; render(); }
        if (event.target.id === "select-robots") { const all = nodes().filter(n => n.robot); state.selectedRobots = event.target.checked ? new Set(all.map(n => n.id)) : new Set(); render(); }
        if (event.target.matches("[data-robot]")) { const selected = new Set(state.selectedRobots); if (event.target.checked) selected.add(event.target.dataset.robot); else selected.delete(event.target.dataset.robot); state.selectedRobots = selected; render(); }
      });
      document.getElementById("review-toggle").addEventListener("click", () => { const panel = document.getElementById("review-panel"); panel.hidden = false; document.getElementById("review-toggle").hidden = true; document.getElementById("review-toggle").setAttribute("aria-expanded","true"); });
      document.getElementById("review-close").addEventListener("click", () => { document.getElementById("review-panel").hidden = true; document.getElementById("review-toggle").hidden = false; document.getElementById("review-toggle").setAttribute("aria-expanded","false"); document.getElementById("review-toggle").focus(); });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && state.drawerNode) closeDrawer();
        if ((event.key === "Enter" || event.key === " ") && event.target.matches("[data-node]")) { event.preventDefault(); openDrawer(event.target.dataset.node); }
        if (state.drawerNode && event.target.matches("[data-drawer-tab]") && ["ArrowRight", "ArrowLeft", "Home", "End"].includes(event.key)) { event.preventDefault(); const tabIds = ["overview", "network", "conditions"]; const current = tabIds.indexOf(state.drawerTab); const next = event.key === "Home" ? 0 : event.key === "End" ? tabIds.length - 1 : (current + (event.key === "ArrowRight" ? 1 : tabIds.length - 1)) % tabIds.length; state.drawerTab = tabIds[next]; renderDrawer(); document.querySelector(`[data-drawer-tab="${state.drawerTab}"]`)?.focus(); return; }
        if (state.drawerNode && (event.key === "Enter" || event.key === " ") && event.target.matches("[data-drawer-tab]")) { event.preventDefault(); state.drawerTab = event.target.dataset.drawerTab; renderDrawer(); }
        if (state.drawerNode && event.key === "Tab") {
          const drawer = document.querySelector(".station-drawer");
          const items = [...drawer.querySelectorAll("button:not(:disabled), [tabindex='0']")];
          const first = items[0], last = items[items.length-1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      });
      const startTheme = state.theme, startLang = state.lang;
      render();
      document.getElementById("scenario").value = state.scenario;
      document.getElementById("theme").value = startTheme;
      document.getElementById("language").value = startLang;
    })();
  </script>
</body>
</html>
