apiVersion: rlinf.io/v1alpha1
kind: Node
metadata:
  name: edge-node-1
spec:
  agentType: Kubernetes
  unschedulable: false
status:
  phase: Online
  reason: kubelet is ready
  nodeInfo:
    architecture: amd64
    kernelVersion: 6.8.0
    agentVersion: v0.1.0
    operatingSystem: linux
  addresses:
    - type: InternalIP
      address: 10.0.0.10
    - type: Hostname
      address: edge-node-1
  capacity:
    cpu: "8"
    memory: 16Gi
    ephemeral-storage: 200Gi
    nvidia.com/gpu: "1"
  allocatable:
    cpu: "7"
    memory: 14Gi
    ephemeral-storage: 180Gi
    nvidia.com/gpu: "1"
  used:
    cpu: "2"
    memory: 4Gi
    ephemeral-storage: 20Gi
    nvidia.com/gpu: "0"
---
