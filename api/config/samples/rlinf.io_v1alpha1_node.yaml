apiVersion: rlinf.io/v1alpha1
kind: Node
metadata:
  name: edge-node-1
  namespace: rlark-system
spec:
  identity:
    id: node-edge-1
    domain: edge-domain
    tenant: example-tenant
  runtime:
    type: Kubernetes
    name: default
  unschedulable: false
status:
  phase: Online
  kubernetesNodeUID: 11111111-1111-1111-1111-111111111111
  kubernetesReady: true
  diskPressure: false
  nodeInfo:
    architecture: amd64
    kernelVersion: 6.8.0
    agentVersion: v0.1.0
    operatingSystem: linux
  addresses:
    - type: InternalIP
      address: 10.0.0.10
    - type: Hostname
      address: edge-node-1
  capacity:
    cpu: "8"
    memory: 16Gi
    ephemeral-storage: 200Gi
    nvidia.com/gpu: "1"
  allocatable:
    cpu: "7"
    memory: 14Gi
    ephemeral-storage: 180Gi
    nvidia.com/gpu: "1"
  used:
    cpu: "2"
    memory: 4Gi
    ephemeral-storage: 20Gi
  capabilitySnapshot:
    runtime:
      type: Kubernetes
      version: v0.1.0
      workloadKinds:
        - rlinf.io/ray
    operations:
      logs: true
      exec: true
    network:
      crossCluster: true
    devices:
      - category: nvidia.com/gpu
        count: 1
        available: 1
  activeWorkloads:
    total: 2
    running: 2
---
# Request a one-shot drain with a new, stable ID for every request. The Node
# Controller reports Draining until all Task drain observations complete, then
# reports Cordoned while the completed operation remains in spec.operations.
# Execution and completion must be observed through the operation workflow
# before removing or replacing the operation.
apiVersion: rlinf.io/v1alpha1
kind: Node
metadata:
  name: edge-node-draining
  namespace: rlark-system
spec:
  runtime:
    type: Kubernetes
    name: default
  unschedulable: true
  operations:
    - id: drain-20261027-01
      type: Drain
