name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # =============================================== prepare release metadata ===========================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          # A SemVer pre-release is identified by a hyphen in the version string
          # (e.g. v0.1.0-rc.1). Anything without a hyphen is a stable release.
          if [ "${REF_NAME#*-}" != "${REF_NAME}" ]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi
          # GHCR requires an all-lowercase repository path.
          image_prefix="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${image_prefix}" >> "$GITHUB_OUTPUT"
          echo "=== Release metadata ==="
          echo "tag:           ${REF_NAME}"
          echo "is_prerelease: ${is_prerelease}"
          echo "image_prefix:  ${image_prefix}"

  # =============================================== build binaries ====================================================
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "apps/rlark/go.mod"
          cache: true
          cache-dependency-path: "apps/rlark/go.sum"

      - name: Build binaries
        working-directory: apps/rlark
        run: |
          echo "=== Building binaries ==="
          echo "GOOS=${{ matrix.goos }}, GOARCH=${{ matrix.goarch }}, VERSION=${{ github.ref_name }}"
          echo "Git ref: ${{ github.ref }}, SHA: ${{ github.sha }}"
          VERSION=${{ github.ref_name }} GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build
          echo "Build completed. Listing built binaries:"
          ls -la bin/
          echo "=== Creating archive ==="
          mkdir -p ../../dist/
          tar -czf ../../dist/rlark_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz -C bin .
          echo "Archive created: $(ls -lh ../../dist/rlark_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz | awk '{print $5, $NF}')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # =============================================== build & push docker images =========================================
  build-push-images:
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rlark image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/rlark/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.is_prerelease == 'true' && format('ghcr.io/{0}/rlark:{1}', needs.prepare.outputs.image_prefix, github.ref_name) || format('ghcr.io/{0}/rlark:{1},ghcr.io/{0}/rlark:latest', needs.prepare.outputs.image_prefix, github.ref_name) }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify rlark image metadata
        run: |
          echo "=== Verifying rlark image ==="
          echo "Image: ghcr.io/${{ needs.prepare.outputs.image_prefix }}/rlark:${{ github.ref_name }}"
          docker buildx imagetools inspect ghcr.io/${{ needs.prepare.outputs.image_prefix }}/rlark:${{ github.ref_name }} || echo "Image inspection skipped (not pulled)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/rlark-ui/package-lock.json

      - name: Build rlark-ui static files
        working-directory: apps/rlark-ui
        run: npm ci && npm run build

      - name: Build and push rlark-ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/rlark-ui/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.is_prerelease == 'true' && format('ghcr.io/{0}/rlark-ui:{1}', needs.prepare.outputs.image_prefix, github.ref_name) || format('ghcr.io/{0}/rlark-ui:{1},ghcr.io/{0}/rlark-ui:latest', needs.prepare.outputs.image_prefix, github.ref_name) }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify rlark-ui image metadata
        run: |
          echo "=== Verifying rlark-ui image ==="
          echo "Image: ghcr.io/${{ needs.prepare.outputs.image_prefix }}/rlark-ui:${{ github.ref_name }}"
          docker buildx imagetools inspect ghcr.io/${{ needs.prepare.outputs.image_prefix }}/rlark-ui:${{ github.ref_name }} || echo "Image inspection skipped (not pulled)"

      - name: Build and push embodied-runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/embodied-runtime/Dockerfile
          push: true
          tags: ${{ needs.prepare.outputs.is_prerelease == 'true' && format('ghcr.io/{0}/embodied-runtime:{1}', needs.prepare.outputs.image_prefix, github.ref_name) || format('ghcr.io/{0}/embodied-runtime:{1},ghcr.io/{0}/embodied-runtime:latest', needs.prepare.outputs.image_prefix, github.ref_name) }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify embodied-runtime image metadata
        run: |
          echo "=== Verifying embodied-runtime image ==="
          echo "Image: ghcr.io/${{ needs.prepare.outputs.image_prefix }}/embodied-runtime:${{ github.ref_name }}"
          docker buildx imagetools inspect ghcr.io/${{ needs.prepare.outputs.image_prefix }}/embodied-runtime:${{ github.ref_name }} || echo "Image inspection skipped (not pulled)"

  # =============================================== create github release ==============================================
  create-release:
    needs: [prepare, build-binaries, build-push-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Restricted to the binary artifacts on purpose: docker/build-push-action
      # also uploads *.dockerbuild build records, which are not release assets.
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt

      # Best-effort only: the public history squashes each internal sync into a
      # single commit, so git-cliff can rarely produce a useful changelog here.
      # It is kept purely as a fallback and must never fail the release.
      - name: Generate CHANGELOG with git-cliff
        id: git_cliff
        continue-on-error: true
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: git-cliff-changelog.md

      - name: Resolve release notes
        id: release_notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version="${REF_NAME#v}"
          notes_file="release-notes.md"
          cliff_file="git-cliff-changelog.md"
          : > "${notes_file}"

          # Primary source: the hand-written CHANGELOG.md section for this tag.
          # Section heading format: "## [<version>] - YYYY-MM-DD".
          # Plain string comparison is used so dots in the version need no escaping.
          if [ -f CHANGELOG.md ]; then
            awk -v heading="## [${version}]" '
              index($0, heading) == 1 { capture = 1; print; next }
              capture && index($0, "## [") == 1 { exit }
              capture { print }
            ' CHANGELOG.md > "${notes_file}"
          fi

          if [ -s "${notes_file}" ]; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
            echo "Release notes taken from CHANGELOG.md section '## [${version}]'."
          elif [ -s "${cliff_file}" ]; then
            cat "${cliff_file}" > "${notes_file}"
            echo "source=git-cliff" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG.md section not found; falling back to git-cliff output."
          else
            printf 'Release %s\n\nSee the commit history for the changes in this release.\n' "${REF_NAME}" > "${notes_file}"
            echo "source=fallback" >> "$GITHUB_OUTPUT"
            echo "Neither CHANGELOG.md section nor git-cliff output available; using minimal fallback notes."
          fi

          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"
          echo "=== Release notes body ==="
          cat "${notes_file}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          generate_release_notes: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
