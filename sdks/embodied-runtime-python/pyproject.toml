[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
# Generated protobuf stubs are off-limits for lint and formatting.
extend-exclude = ["embodied_runtime/gen", "build", "dist", "*.egg-info", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true

